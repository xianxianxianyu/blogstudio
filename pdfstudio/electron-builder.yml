# PDF Studio 的打包配置（ADR-0006/0014）。
appId: com.pdfstudio.app
productName: PDF Studio
directories:
  # **app 指向打包目录，不是仓库根。** 指向仓库根时 electron-builder 会反复改写仓库的
  # package.json（scripts 整段删掉、main 重算成某个依赖里的路径），而且会把整棵生产
  # 依赖树装进去——这个仓库还住着 Blog Studio。
  #
  # 主进程全量打包（只有 electron 外部），所以这个目录里不需要 node_modules：
  # 一个 main.mjs、一份 renderer/、一个自己的 package.json。
  app: pdfstudio/dist
  output: pdfstudio/release

# 主进程是全量打包的，运行时不 require 任何包——所以整棵 node_modules 都不要。
# 不排的话 electron-builder 会顺着目录往上找到仓库的 node_modules，把 Blog Studio 那套
# （drizzle、wrangler、Cloudflare）一起装进去，安装包从 280 MB 涨到 526 MB。
files:
  - "**/*"
  - "!node_modules/**"

# **权重与 llama.cpp 都不打进安装包**：识别 1.7 GB + 向量 318 MB，跟着分发一次都嫌多，
# 而且读者可能想换模型。首次用到时由 LocalEngine 下到应用数据目录。

mac:
  category: public.app-category.productivity
  target:
    - dir # 先只出 .app 目录形态。dmg 要签名与公证，那需要开发者证书（ADR-0014 边界）。
