<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>PDF Studio — 框选竖切</title>
    <style>
      body { font: 14px/1.6 system-ui; margin: 0; display: flex; height: 100vh; }
      #left { flex: 1; overflow: auto; background: #f4f4f5; padding: 16px; }
      #right { width: 420px; border-left: 1px solid #d4d4d8; padding: 16px; overflow: auto; }
      #stage { position: relative; display: inline-block; }
      canvas { display: block; box-shadow: 0 1px 8px rgba(0,0,0,.15); }
      #box { position: absolute; border: 2px solid #2563eb; background: rgba(37,99,235,.12); display: none; pointer-events: none; }
      pre { white-space: pre-wrap; word-break: break-word; background: #fafafa; padding: 8px; }
      img { max-width: 100%; border: 1px solid #d4d4d8; }
    </style>
  </head>
  <body>
    <div id="left"><div id="stage"><canvas id="page"></canvas><div id="box"></div></div></div>
    <div id="right">
      <p><b>在左边拖一个框。</b>这一页只验一条链路：拖框 → 换算成页面坐标 → 裁成 PNG → 交给识别模块。</p>
      <p>
        <button id="prev">← 上一页</button>
        第 <input id="pageNo" type="number" value="1" min="1" style="width:4em"> / <span id="total">?</span> 页
        <button id="next">下一页 →</button>
      </p>
      <p>缩放 <input id="scale" type="number" value="1.5" step="0.25" min="0.5" style="width:4em">（改完自动重画）</p>
      <div id="out"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
