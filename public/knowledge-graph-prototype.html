"use strict";

/* ==========================================================================
   1. 假数据
   ========================================================================== */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 权重是「有多少 context 会挂上这个主题」。真实读法一定是偏斜的——
// 你在集中读一个方向，所以有一个主题会吃掉一大块。
const TOPIC_POOL = [
  { name: "agent-design",    hot: 30, flat: 8 },
  { name: "eval",            hot: 12, flat: 8 },
  { name: "rag",             hot: 11, flat: 8 },
  { name: "context-window",  hot: 8,  flat: 8 },
  { name: "provenance",      hot: 7,  flat: 8 },
  { name: "tool-use",        hot: 7,  flat: 8 },
  { name: "prompt-cache",    hot: 5,  flat: 8 },
  { name: "本地模型",         hot: 5,  flat: 8 },
  { name: "多模态",           hot: 4,  flat: 8 },
  { name: "知识图",           hot: 4,  flat: 8 },
  { name: "写作流程",         hot: 4,  flat: 8 },
  { name: "成本",             hot: 3,  flat: 8 },
];

const CLAIMS = [

   "Corpora assembled only from supporting evidence read like marketing copy."],
  ["一旦在入库阶段就转述，幻觉就在最上游进来了，后面全是复利。",
   "Paraphrasing at ingestion admits hallucination upstream, and it compounds."],
  ["judge 没有参照物就只会给趋中的安全分。",
   "Without an anchor, an LLM judge regresses to safe middling scores."],
  ["线性覆盖的思路默认「最新 = 最好」，但迭代是会退步的。",
   "Linear revision assumes latest is best; iteration frequently regresses."],
  ["散文的自动 merge 无解，只能用持笔锁绕开。",
   "Prose has no viable auto-merge; an explicit write lock is the workaround."],
  ["把状态藏在对话历史里，第 3 轮就回不到第 1 轮的版本。",
   "State kept in conversation history cannot be rolled back to round one."],
  ["agent 讨论的字数一定多于文章本身，默认折叠成结论才划算。",
   "Agent deliberation always outweighs the artifact; collapse it to conclusions."],
  ["模型在超过一定上下文长度后，中段信息的召回明显低于首尾。",
   "Recall of mid-context material falls off sharply past a threshold length."],
  ["工具返回的错误文本本身就是 prompt，写得含糊模型就会瞎试。",
   "Tool error strings are prompts; vague ones make the model guess."],
  ["本地 embedding 的中英跨语检索需要专门的多语模型，通用英文模型直接归零。",
   "Cross-lingual retrieval needs a multilingual embedder; English-only models score zero."],
  ["prompt cache 的命中率取决于前缀稳定性，把变量放前面等于关掉缓存。",
   "Cache hit rate hinges on prefix stability; leading variables disable it."],
  ["视觉模型读公式比 OCR 稳，但会悄悄补全它看不清的下标。",
   "Vision models beat OCR on formulas but silently invent unclear subscripts."],
  ["检索的 abstention 阈值必须按背景分布标定，不能取固定分数。",
   "Abstention thresholds must be calibrated to the background distribution."],
  ["空块不命中任何查询，却会把背景分布的中位数拉低。",
   "Empty chunks match nothing yet depress the background median."],
  ["RRF 融合下短而密的块会系统性压过长正文块。",
   "Under RRF, short dense chunks systematically outrank long body chunks."],
  ["双栏 PDF 的阅读顺序不能按 y 坐标排，必须先归栏。",
   "Two-column PDFs need column assignment before any reading-order sort."],
  ["让浏览器做命中测试，比自己按 width 均分猜字符位置准得多。",
   "Browser hit-testing beats guessing glyph positions from average width."],
  ["截图作为地面真值就不能重渲染，渲染参数一变它就不是真值了。",
   "A screenshot used as ground truth cannot be re-rendered; parameters drift."],

   "More than three deliberations means the topic itself is unresolved."],

   "Scheduled work is not a separate system; it is a cron-triggered graph."],

  ["颜色是阅读态，主题是内容，两者跨文档复用的价值完全不同。",
   "Highlight color is reading state; topic is content. They reuse differently."],
  ["五个值的分类按相同性连边，只会把库塌成五个巨型连通块。",
   "Linking on a five-valued category collapses the corpus into five blobs."],
  ["文件是唯一真相，数据库是可重建的缓存；反过来不成立。",
   "Files are the source of truth; the index is a rebuildable cache, not vice versa."],
  ["markdown 不是为存储发明的格式，它本来就是这个领域里的形状。",
   "Markdown was not invented for storage; it is the domain's native shape."],
  ["索引落后可以靠重建修复，所以先落文件再更新索引，顺序不能反。",
   "Write files before the index: a stale index is repairable, a lost file is not."],
  ["local-first 的个人工具里，文件可被手改更像特性而非缺陷。",
   "In a local-first personal tool, hand-editable files are a feature."],
  ["读者是先认出「这段要留」才框的，不该等模型回答完才准标。",
   "The reader recognizes salience before capture; don't gate marking on the model."],
];

const SOURCES = [
  "Lost in the Middle, §4.2", "attention is all you need, p.6", "本地实验记录 2026-07",
  "RAG survey, §3.1", "Constitutional AI, p.12", "内部 eval 报告 v3",
  "Chain-of-Thought, §5", "pdf.js 文档 · TextLayer", "BGE-M3 技术报告, §2",
  "读书笔记 · 认知负荷", "SWE-bench, table 3", "自己的博客草稿 #14",
];

function generate(n, skew) {
  const rnd = mulberry32(20260817);
  const key = skew === "hot" ? "hot" : "flat";
  const weighted = [];
  for (const t of TOPIC_POOL) {
    for (let i = 0; i < t[key]; i++) weighted.push(t.name);
  }

  const out = [];
  for (let i = 0; i < n; i++) {
    // 主题个数：0 / 1 / 2 / 3，其中 0 是孤儿——必须真的存在，spec 要求它显式可见。
    const roll = rnd();
    const count = roll < 0.09 ? 0 : roll < 0.42 ? 1 : roll < 0.85 ? 2 : 3;
    const topics = [];
    for (let k = 0; k < count; k++) {
      const t = weighted[Math.floor(rnd() * weighted.length)];
      if (!topics.includes(t)) topics.push(t);
    }
    const claim = CLAIMS[i % CLAIMS.length];
    const s = rnd();
    out.push({
      id: "ctx_" + String(i + 1).padStart(3, "0"),
      claim: claim[0],
      evidence: claim[1],
      source: SOURCES[Math.floor(rnd() * SOURCES.length)],
      topics,
      // 大部分 pending，少量已判。rejected 仍然进图（issue 02 的规则），只是画得暗。
      status: s < 0.55 ? "pending" : s < 0.82 ? "approved" : s < 0.93 ? "disputed" : "rejected",
      recycled: i >= CLAIMS.length,
    });
  }
  return out;
}

/* ==========================================================================
   2. buildGraph —— 规则与 .scratch/knowledge-graph/issues/02 一致
   ========================================================================== */

const normalizeTopic = (t) => t.trim().toLowerCase();

function buildGraph(contexts) {
  const nodes = contexts.map((c) => ({
    id: c.id, claim: c.claim, evidence: c.evidence, source: c.source,
    topics: c.topics, status: c.status, recycled: c.recycled, degree: 0,
  }));

  // 主题 → 成员。共享主题的成员两两连边（ADR-0002）。
  const byTopic = new Map();
  for (const c of contexts) {
    for (const t of c.topics) {
      const k = normalizeTopic(t);
      if (!byTopic.has(k)) byTopic.set(k, []);
      byTopic.get(k).push(c.id);
    }
  }

  // (a,b) 与 (b,a) 是同一条边，且共享两个主题只算一条边、topics 有两项。
  const edgeMap = new Map();
  for (const [topic, members] of byTopic) {
    for (let i = 0; i < members.length; i++) {
      for (let j = i + 1; j < members.length; j++) {
        const [a, b] = members[i] < members[j] ? [members[i], members[j]] : [members[j], members[i]];
        const key = a + "|" + b;
        if (!edgeMap.has(key)) edgeMap.set(key, { a, b, topics: [] });
        edgeMap.get(key).topics.push(topic);
      }
    }
  }

  const edges = [...edgeMap.values()].sort((x, y) => (x.a + x.b).localeCompare(y.a + y.b));
  const index = new Map(nodes.map((nd) => [nd.id, nd]));
  for (const e of edges) { index.get(e.a).degree++; index.get(e.b).degree++; }

  const topicSizes = [...byTopic.entries()]
    .map(([name, m]) => ({ name, size: m.length, edges: (m.length * (m.length - 1)) / 2 }))
    .sort((x, y) => y.edges - x.edges);

  // 主题 → 挂了几条。稀有度排序（变体 D）要用它，而它本来就在手边。
  const topicSize = new Map(topicSizes.map((t) => [t.name, t.size]));

  return { nodes, edges, index, topicSizes, topicSize };
}

/* ==========================================================================
   3. 力导向：自己写一个，别引依赖——原型不该有构建步骤
   ========================================================================== */

function layout(nodes, edges, w, h, iterations) {
  const n = nodes.length;
  if (n === 0) return;
  const rnd = mulberry32(7);
  const R = Math.min(w, h) * 0.38;
  nodes.forEach((nd, i) => {
    const a = (i / n) * Math.PI * 2;
    nd.x = w / 2 + Math.cos(a) * R * (0.6 + rnd() * 0.5);
    nd.y = h / 2 + Math.sin(a) * R * (0.6 + rnd() * 0.5);
    nd.vx = 0; nd.vy = 0;
  });

  const idx = new Map(nodes.map((nd, i) => [nd.id, i]));
  const springs = edges.map((e) => [idx.get(e.a), idx.get(e.b)]).filter(([a, b]) => a != null && b != null);

  // 边多的时候单条弹簧要弱下来，否则枢纽节点会把整张图拽塌成一个点。
  const springK = 0.0022 * Math.min(1, 220 / Math.max(1, springs.length / Math.max(1, n)));
  const repel = 1600 + n * 6;
  const rest = Math.max(28, Math.min(w, h) / Math.sqrt(n) * 0.9);

  for (let step = 0; step < iterations; step++) {
    const alpha = 1 - step / iterations;

    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = (i - j) * 0.01 + 0.1; dy = 0.1; d2 = 1; }
        const f = repel / d2;
        const d = Math.sqrt(d2);
        const fx = (dx / d) * f, fy = (dy / d) * f;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }

    for (const [i, j] of springs) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (d - rest) * springK;
      const fx = (dx / d) * f * d, fy = (dy / d) * f * d;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }

    for (const nd of nodes) {
      nd.vx += (w / 2 - nd.x) * 0.004;
      nd.vy += (h / 2 - nd.y) * 0.004;
      const speed = Math.hypot(nd.vx, nd.vy);
      const cap = 14 * alpha + 1;
      const scale = speed > cap ? cap / speed : 1;
      nd.x += nd.vx * scale; nd.y += nd.vy * scale;
      nd.vx *= 0.72; nd.vy *= 0.72;
      nd.x = Math.max(14, Math.min(w - 14, nd.x));
      nd.y = Math.max(14, Math.min(h - 14, nd.y));
    }
  }
}

/* ==========================================================================
   4. 画布
   ========================================================================== */

const STATUS_COLOR = {
  pending:  { fill: "#8b919b", ring: "#5c6370" },
  approved: { fill: "#1a7f45", ring: "#0f5c30" },
  disputed: { fill: "#a37a08", ring: "#7a5c06" },
  rejected: { fill: "#ce3a3a", ring: "#9c2c2c" },
};

function fitCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  cv.width = Math.max(1, Math.round(rect.width * dpr));
  cv.height = Math.max(1, Math.round(rect.height * dpr));
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

function radius(nd) { return 3.2 + Math.min(7, Math.sqrt(nd.degree) * 1.25); }

function drawGraph(ctx, w, h, nodes, edges, opts) {
  const o = opts || {};
  ctx.clearRect(0, 0, w, h);
  const pos = new Map(nodes.map((nd) => [nd.id, nd]));

  ctx.lineWidth = o.thickEdges ? 1.4 : 0.7;
  for (const e of edges) {
    const a = pos.get(e.a), b = pos.get(e.b);
    if (!a || !b) continue;
    ctx.strokeStyle = e.hot ? getVar("--edge-hot") : getVar("--edge");
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  for (const nd of nodes) {
    const c = STATUS_COLOR[nd.status] || STATUS_COLOR.pending;
    const r = radius(nd);
    ctx.beginPath();
    ctx.arc(nd.x, nd.y, r, 0, Math.PI * 2);
    ctx.fillStyle = nd.status === "rejected" ? c.fill + "66" : c.fill;
    ctx.fill();
    if (nd.hi) { ctx.strokeStyle = getVar("--accent"); ctx.lineWidth = 2.4; ctx.stroke(); ctx.lineWidth = 0.7; }
    if (nd.degree === 0) {
      ctx.strokeStyle = getVar("--warn");
      ctx.lineWidth = 1.6;
      ctx.setLineDash([2, 2]);
      ctx.beginPath(); ctx.arc(nd.x, nd.y, r + 3.2, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 0.7;
    }
  }

  if (o.labels) {
    ctx.font = "11px " + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = getVar("--text");
    ctx.textAlign = "center";
    for (const nd of nodes) {
      if (!nd.showLabel) continue;
      const text = nd.claim.length > 22 ? nd.claim.slice(0, 21) + "…" : nd.claim;
      const wid = ctx.measureText(text).width;
      ctx.fillStyle = getVar("--card");
      ctx.globalAlpha = 0.86;
      ctx.fillRect(nd.x - wid / 2 - 4, nd.y + radius(nd) + 3, wid + 8, 15);
      ctx.globalAlpha = 1;
      ctx.fillStyle = getVar("--text");
      ctx.fillText(text, nd.x, nd.y + radius(nd) + 14);
    }
  }
}

function getVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function hitTest(nodes, x, y) {
  let best = null, bestD = 1e9;
  for (const nd of nodes) {
    const d = Math.hypot(nd.x - x, nd.y - y);
    if (d < radius(nd) + 5 && d < bestD) { best = nd; bestD = d; }
  }
  return best;
}

/* ==========================================================================
   5. 三个变体
   ========================================================================== */

const tip = document.getElementById("tip");

function showTip(nd, ev) {
  tip.innerHTML =
    '<div class="tid">' + nd.id + " · " + nd.source + " · " + nd.status +
    (nd.degree === 0 ? ' · <span style="color:var(--warn)">孤儿</span>' : " · " + nd.degree + " 邻居") + "</div>" +
    '<div class="tclaim">' + nd.claim + "</div>" +
    '<div class="tev">' + nd.evidence + "</div>" +
    '<div class="ttopics">' + (nd.topics.length ? nd.topics.map((t) => "<b>#" + t + "</b>").join("") : '<span style="color:var(--warn)">无主题 —— 新主题的种子</span>') + "</div>";
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - r.width - 10, ev.clientX + 14) + "px";
  tip.style.top = Math.min(window.innerHeight - r.height - 10, ev.clientY + 14) + "px";
}
const hideTip = () => { tip.style.display = "none"; };

function orphanStrip(graph) {
  const orphans = graph.nodes.filter((nd) => nd.degree === 0);
  if (!orphans.length) return '<div class="orphans"><h4>孤儿 0 条</h4><div style="font-size:12px;color:var(--dim)">这一批里每条 context 都至少和另一条共享一个主题。</div></div>';
  return '<div class="orphans"><h4>孤儿 ' + orphans.length + " 条 —— 不是噪声，是新主题的种子</h4>" +
    '<div class="orphan-row">' +
    orphans.slice(0, 24).map((nd) => '<span class="orphan" title="' + nd.claim + '">' + nd.id + " · " + nd.claim + "</span>").join("") +
    (orphans.length > 24 ? '<span class="orphan" style="background:var(--sunken);border-style:dashed">…还有 ' + (orphans.length - 24) + " 条</span>" : "") +
    "</div></div>";
}

/* ---- A：全局图（照抄 Obsidian 的做法）---- */
const variantA = {
  name: "全局图 —— 照抄 Obsidian",
  verdict: "<b>它想证明的是它自己不成立。</b>Obsidian 的全局图之所以能看，是因为节点是「一篇笔记」——一本书读完几十个。断言级粒度下同样的读量是几百个节点，再叠上共享主题的两两连边，60 条就开始糊，140 条以上只剩一团毛线的美学价值。<b>把这个当主视图，等于把知识库做成一张海报。</b>",
  render(host, graph) {

/* ---- B：聚焦（选中节点 + 一跳邻居）---- */
const variantB = {
  name: "聚焦 —— 一个节点和它的邻居",
  verdict: "<b>这才是主视图。</b>不管库里是 24 条还是 320 条，屏幕上永远只有一个节点和它的一跳邻居——读者的注意力本来就是这个形状（「我正在看这条，旁边还有什么」）。边上标着共享的主题，所以「为什么连」当场可读，这正是 ADR-0002 要求边记住 <code>topics</code> 的理由。<b>O(n²) 的代价被局部化了：只有枢纽节点的邻居列表会长，而那是可以排序和截断的。</b>",
  render(host, graph) {

      '<div class="focus-layout"><div class="focus-list">' +

        '<div class="focus-item" data-id="' + nd.id + '" aria-selected="' + (i === 0) + '">' +

        '<div class="fclaim">' + nd.claim + "</div></div>").join("") +
      '</div><div class="focus-pane"><canvas></canvas></div></div>' +

    const cv = host.querySelector("canvas");
    const pane = host.querySelector(".focus-pane");

    function focusOn(id) {
      const center = graph.index.get(id);
      const near = graph.edges.filter((e) => e.a === id || e.b === id);
      const ids = new Set([id]);
      near.forEach((e) => { ids.add(e.a); ids.add(e.b); });

      if (near.length === 0) {
        pane.innerHTML = '<div class="focus-empty" style="flex-direction:column;gap:10px;text-align:center;padding:0 40px">' +

      const c = sub.find((nd) => nd.id === id);
      const dx = w / 2 - c.x, dy = h / 2 - c.y;
      sub.forEach((nd) => { nd.x += dx; nd.y += dy; });

      ctx.font = "10px " + getComputedStyle(document.body).fontFamily;

      for (const e of subEdges) {

    host.querySelectorAll(".focus-item").forEach((el) => {

      };

/* ---- D：枢纽节点的邻居到底该怎么排（issue 05）---- */

/**
 * 主题的稀有度，就是 IDF。共享一个只挂了 3 条 context 的主题，
 * 比共享一个挂了 123 条的主题信息量大得多——后者几乎等于没说。
 */
function idf(graph, topic) {
  const size = graph.topicSize.get(topic) || 1;
  return Math.log(graph.nodes.length / size);
}

const STATUS_RANK = { approved: 3, pending: 2, disputed: 1, rejected: 0 };

const ORDERINGS = [
  { key: "count", name: "共享主题数", desc: "共享得越多越相关",
    score: (n) => n.edge.topics.length,
    fmt: (n) => n.edge.topics.length + " 个" },
  { key: "rarity", name: "主题稀有度（IDF）", desc: "共享一个冷门主题，比共享热门主题有信息量",
    score: (n, g) => n.edge.topics.reduce((sum, t) => sum + idf(g, t), 0),
    fmt: (n, g) => n.edge.topics.reduce((sum, t) => sum + idf(g, t), 0).toFixed(2) },
  { key: "status", name: "审核状态", desc: "approved 的排前面",
    score: (n) => STATUS_RANK[n.other.status] ?? 0,
    fmt: (n) => n.other.status },
  { key: "recent", name: "入库顺序", desc: "最近入库的排前面",
    score: (n) => Number(n.other.id.slice(4)),
    fmt: (n) => "#" + Number(n.other.id.slice(4)) },
];

function neighborsOf(graph, id) {
  return graph.edges
    .filter((e) => e.a === id || e.b === id)
    .map((e) => ({ edge: e, other: graph.index.get(e.a === id ? e.b : e.a) }));
}

let cutoff = 8;

const variantD = {
  name: "邻居排序 —— 四种排法对比",
  verdict: "<b>稀有度赢，但赢的理由和我预想的不一样。</b>320 条时 <b>94.4% 的边只共享 1 个主题</b>——所以「共享主题数」对绝大多数邻居给出<b>同一个分数</b>，它压根排不出名次，剩下的顺序是数组下标决定的。稀有度的价值就在这里：它能给这 94.4% 排出先后，而 count 不能。<b>但要诚实：</b>在这份只有 12 个主题的假数据里，两者的前 8 只差 2 个——优势没充分展开，因为真实知识库的主题数是几百，IDF 的分布会宽得多。「审核状态」和「入库顺序」各自的前 8 有 7 个是独有的，那不是「排得更好」，是<b>它们在回答完全不同的问题</b>（可信度、我最近在读什么），混进相关度排序会骗人——该做成筛选器，不是排序。<b>白送的副产品：同一个 IDF 能识别笼统主题</b>（<code>#agent-design</code> 挂了 123 条，idf=0.96；冷门主题 idf 高一倍），正好补上 ADR-0003 留下的那个洞——假边没有药。",
  render(host, graph) {
    const hubs = [...graph.nodes].sort((a, b) => b.degree - a.degree).slice(0, 6);
    const hub = graph.index.get(variantD.hubId) && variantD.hubId
      ? graph.index.get(variantD.hubId) : hubs[0];
    const near = neighborsOf(graph, hub.id);

    // 每种排法各自的前 K，然后标出「只有这一栏把它排进来了」的那些——
    // 四个长得差不多的列表看不出胜负，差异才看得出。
    const ranked = ORDERINGS.map((o) => ({
      ...o,
      list: [...near].sort((x, y) => o.score(y, graph) - o.score(x, graph)).slice(0, cutoff),
    }));
    const appearances = new Map();
    for (const r of ranked) {
      for (const n of r.list) appearances.set(n.other.id, (appearances.get(n.other.id) || 0) + 1);
    }

    host.innerHTML =
      '<div class="stage"><div class="stage-head"><h3>枢纽节点 ' + hub.id + " 有 " + hub.degree +
      " 个邻居，一屏放不下</h3><span class=\"hint\">★ = 只有这一栏把它排进了前 " + cutoff + "</span></div>" +
      '<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:16px;flex-wrap:wrap;align-items:center">' +
      '<span class="ctl-label">聚焦在</span><span class="seg" id="hubPick">' +
      hubs.map((n) => '<button data-id="' + n.id + '" aria-pressed="' + (n.id === hub.id) + '">' +
        n.id + " · " + n.degree + "</button>").join("") + "</span>" +
      '<span class="ctl-label">截断</span><span class="seg" id="cut">' +
      [5, 8, 15].map((k) => '<button data-k="' + k + '" aria-pressed="' + (k === cutoff) + '">前 ' + k + "</button>").join("") +
      "</span></div>" +
      '<div style="padding:10px 16px 4px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--border)">' +
      "它自己说的是：<b style=\"color:var(--text)\">" + hub.claim + "</b>　挂着 " +
      hub.topics.map((t) => '<code style="font-size:11px">#' + t + "</code>").join(" ") + "</div>" +
      '<div class="cols" style="align-items:stretch">' +
      ranked.map((r) =>
        '<div class="col" style="flex:0 0 296px"><div class="col-head" style="display:block">' +
        '<div class="tname" style="color:var(--text);font-family:inherit;font-weight:600">' + r.name + "</div>" +
        '<div style="font-size:11.5px;color:var(--faint);line-height:1.4;margin-top:2px">' + r.desc + "</div></div>" +
        '<div class="col-body">' +
        r.list.map((n, i) => {
          const unique = appearances.get(n.other.id) === 1;
          return '<div class="ccard"' + (unique ? ' style="border-color:var(--accent-border);background:var(--accent-bg)"' : "") + ">" +
            '<div class="cid">' + (i + 1) + ". " + n.other.id + " · " + r.fmt(n, graph) +
            (unique ? ' <b style="color:var(--accent)">★</b>' : "") + "</div>" +
            '<div class="cclaim">' + n.other.claim + "</div>" +
            '<div class="calso">共享 ' + n.edge.topics.map((t) => "<b>#" + t + "</b>").join(" ") + "</div></div>";
        }).join("") +
        '<div style="font-size:11.5px;color:var(--faint);text-align:center;padding:6px">另有 ' +
        (near.length - r.list.length) + " 个邻居没进前 " + cutoff + "</div>" +
        "</div></div>").join("") +
      "</div></div>";

    host.querySelector("#hubPick").onclick = (ev) => {
      const b = ev.target.closest("button"); if (!b) return;
      variantD.hubId = b.dataset.id; render();
    };
    host.querySelector("#cut").onclick = (ev) => {
      const b = ev.target.closest("button"); if (!b) return;
      cutoff = Number(b.dataset.k); render();
    };
  },
};

const VARIANTS = { A: variantA, B: variantB, C: variantC, D: variantD };

/* ==========================================================================
   6. 状态面板 + 装配
   ========================================================================== */

let state = { n: 60, skew: "hot", variant: "A" };

function renderStats(graph) {
  const orphans = graph.nodes.filter((nd) => nd.degree === 0).length;
  const hottest = graph.topicSizes[0];
  const maxDeg = graph.nodes.reduce((m, nd) => Math.max(m, nd.degree), 0);
  const possible = (graph.nodes.length * (graph.nodes.length - 1)) / 2;
  const density = possible ? ((graph.edges.length / possible) * 100).toFixed(1) : "0";
  const heavy = graph.edges.length > 900;

  document.getElementById("stats").innerHTML = [
    ["节点 nodes", graph.nodes.length, ""],
    ["边 edges", graph.edges.length, heavy ? "alarm" : ""],
    ["图密度", density + "%", heavy ? "alarm" : ""],
    ["最大度数", maxDeg, ""],
    ["孤儿 orphans", orphans, ""],
    ["最热主题", hottest ? "#" + hottest.name : "—", "", hottest ? hottest.size + " 条 → " + hottest.edges + " 条边" : ""],
  ].map(([k, v, cls, sub]) =>
    '<div class="stat ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v +
    (sub ? "<br><small>" + sub + "</small>" : "") + "</div></div>").join("");
}

function render() {
  const contexts = generate(state.n, state.skew === "skewed" ? "hot" : "flat");
  const graph = buildGraph(contexts);
  renderStats(graph);

  const v = VARIANTS[state.variant];
  document.getElementById("curKey").textContent = state.variant;
  document.getElementById("curName").textContent = v.name;
  document.getElementById("verdict").innerHTML = v.verdict;
  v.render(document.getElementById("stage"), graph);
}

function setVariant(key) {
  state.variant = key;
  const url = new URL(location.href);
  url.searchParams.set("variant", key);
  history.replaceState(null, "", url);
  render();
}

document.getElementById("density").onclick = (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  state.n = Number(b.dataset.n);
  document.querySelectorAll("#density button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
};
document.getElementById("skew").onclick = (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  state.skew = b.dataset.skew;
  document.querySelectorAll("#skew button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
};

const KEYS = ["A", "B", "C", "D"];
const step = (d) => setVariant(KEYS[(KEYS.indexOf(state.variant) + d + KEYS.length) % KEYS.length]);
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.addEventListener("keydown", (ev) => {
  const t = ev.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (ev.key === "ArrowLeft") step(-1);
  if (ev.key === "ArrowRight") step(1);
});

state.variant = KEYS.includes(new URL(location.href).searchParams.get("variant"))
  ? new URL(location.href).searchParams.get("variant") : "A";
render();
window.addEventListener("resize", () => { clearTimeout(window.__rt); window.__rt = setTimeout(render, 220); });
</script>
