  #blog-studio-chat-concepts .chat-rail {

  #blog-studio-chat-concepts .chat-rail-message {

  #blog-studio-chat-concepts .chat-inline-diff {

  #blog-studio-chat-concepts .chat-inline-diff del,

  #blog-studio-chat-concepts .chat-semantic-prompts {

  #blog-studio-chat-concepts .chat-prompt-button[aria-pressed=&quot;true&quot;] {

      position: absolute;
      z-index: 24;
      right: 10px;
      bottom: 90px;

      border: 1px solid var(--chat-line-strong);

      box-shadow: 0 12px 30px var(--chat-shadow);
    }
    #blog-studio-chat-concepts .chat-sheet-copy { grid-template-columns: 1fr; }

  @media (max-width: 520px) {
    #blog-studio-chat-concepts .chat-window { min-height: 760px; }
    #blog-studio-chat-concepts .chat-topbar { gap: 7px; }
    #blog-studio-chat-concepts .chat-title,
    #blog-studio-chat-concepts .chat-thread-state span:last-child,
    #blog-studio-chat-concepts .chat-brand &gt; span:nth-child(2) { display: none; }

    #blog-studio-chat-concepts .chat-sidebar { display: none; }
    #blog-studio-chat-concepts .chat-workspace { min-height: 706px; }
    #blog-studio-chat-concepts .chat-work-grid,
    #blog-studio-chat-concepts .chat-article-stage { min-height: 658px; }
    #blog-studio-chat-concepts .chat-article-stage { padding: 26px 7% 128px; }

    #blog-studio-chat-concepts .chat-bubble {
      top: auto;
      right: 10px;
      bottom: 112px;
      left: 10px;
      width: auto;
    }
    #blog-studio-chat-concepts .chat-bubble::before { display: none; }
    #blog-studio-chat-concepts .chat-lens { grid-template-columns: 1fr; }
    #blog-studio-chat-concepts .chat-lens-context { display: none; }
    #blog-studio-chat-concepts .chat-semantic-prompts { right: 10px; left: 10px; bottom: 110px; }
    #blog-studio-chat-concepts .chat-composer { right: 10px; bottom: 10px; left: 10px; }
  }
&lt;/style&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;blog-studio-chat-concepts&quot;);
    if (!root) return;

    const concepts = {
      anchor: {
        label: &quot;A · Anchor&quot;,
        abstract: &quot;空间锚点&quot;,
        fit: &quot;局部解释、单段核查、短改写&quot;,
        cost: &quot;长回复遮挡；编辑后锚点漂移&quot;,
        guard: &quot;6 行上限；超长升级 Sheet；语义 block anchor&quot;
      },
      sheet: {
        label: &quot;B · Sheet&quot;,
        abstract: &quot;时间焦点&quot;,
        fit: &quot;来源比较、长解释、移动端&quot;,
        cost: &quot;双滚动、软键盘、覆盖正文&quot;,
        guard: &quot;Article inset；Peek / Half / Focus；Esc 逐级收起&quot;
      },
      lens: {
        label: &quot;C · Lens&quot;,
        abstract: &quot;认知模式&quot;,
        fit: &quot;深度研究、多轮分支、后台任务&quot;,
        cost: &quot;暂时失去文章全貌；模式切换&quot;,
        guard: &quot;保留 excerpt；关闭后恢复选区、光标与滚动&quot;
      },
      rail: {
        label: &quot;D · Rail&quot;,
        abstract: &quot;空间让渡&quot;,
        fit: &quot;长回复与正文持续并看&quot;,
        cost: &quot;文章重排；Split 和窄屏过载&quot;,
        guard: &quot;只在宽屏非 Split 启用；其余降级 Sheet&quot;
      },
      semantic: {
        label: &quot;E · Semantic&quot;,
        abstract: &quot;语义落点 · 推荐&quot;,
        fit: &quot;一个入口覆盖局部问答、长分析、深聊与改文&quot;,
        cost: &quot;状态迁移与实现复杂度最高&quot;,
        guard: &quot;Input floats；answer lands；change becomes diff&quot;
      }
    };

    const state = { concept: &quot;semantic&quot;, mode: &quot;read&quot;, intent: &quot;local&quot; };

    const source = `# 把 Chat 从一个房间变成一种能力

固定侧栏很清晰，但它会长期占据阅读和编辑真正需要的空间。

如果输入框悬浮在文章上，回复不应该永远悬浮。短解释靠近原文，长分析进入 Sheet，真正的修改回到正文 Diff。`;

    function conceptPicker() {
      return `&lt;div class=&quot;chat-concept-picker&quot; aria-label=&quot;Chat design concepts&quot;&gt;
        ${Object.entries(concepts).map(([key, item]) =&gt; `&lt;button class=&quot;chat-concept-button&quot; type=&quot;button&quot; data-action=&quot;concept&quot; data-value=&quot;${key}&quot; aria-pressed=&quot;${state.concept === key}&quot;&gt;&lt;strong&gt;${item.label}&lt;/strong&gt;&lt;span&gt;${item.abstract}&lt;/span&gt;&lt;/button&gt;`).join(&quot;&quot;)}
      &lt;/div&gt;`;
    }

    function toolbar() {
      return `&lt;div class=&quot;chat-article-toolbar&quot;&gt;
        &lt;div class=&quot;chat-mode-switch&quot; aria-label=&quot;Article mode&quot;&gt;
          ${[&quot;read&quot;, &quot;edit&quot;, &quot;split&quot;].map(mode =&gt; `&lt;button class=&quot;chat-mode-button&quot; type=&quot;button&quot; data-action=&quot;mode&quot; data-value=&quot;${mode}&quot; aria-pressed=&quot;${state.mode === mode}&quot;&gt;${mode[0].toUpperCase() + mode.slice(1)}&lt;/button&gt;`).join(&quot;&quot;)}
        &lt;/div&gt;
        &lt;span class=&quot;chat-spacer&quot;&gt;&lt;/span&gt;
        &lt;span class=&quot;chat-thread-chip&quot;&gt;2 anchored&lt;/span&gt;
        &lt;button class=&quot;chat-thread-button&quot; type=&quot;button&quot;&gt;Threads · 4&lt;/button&gt;
      &lt;/div&gt;`;
    }

    function articleContent(withDiff = false) {
      return `&lt;article class=&quot;chat-article&quot;&gt;
        &lt;h1&gt;把 Chat 从一个房间变成一种能力&lt;/h1&gt;
        &lt;p class=&quot;chat-deck&quot;&gt;当对话离开固定侧栏，输入、回答、修改和历史应该去哪里？&lt;/p&gt;
        &lt;p&gt;固定的 Chat 侧栏有一种诚实的简单：文章在这里，对话在那里。但这种清晰是用空间换来的。进入 Split 后，源码、预览和 Chat 同时争夺宽度，真正重要的正文反而最窄。&lt;/p&gt;
        &lt;p&gt;&lt;span class=&quot;chat-selected&quot;&gt;我更想让对话从文章本身发生，而不是先离开文章，再进入另一个房间。&lt;span class=&quot;chat-anchor-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;
        ${withDiff ? `&lt;div class=&quot;chat-inline-diff&quot;&gt;&lt;span class=&quot;chat-status-chip&quot;&gt;Proposed diff · paragraph 3&lt;/span&gt;&lt;del&gt;Chat 应该悬浮在文章上方。&lt;/del&gt;&lt;ins&gt;输入可以悬浮，但回答应根据长度与意图回到最适合的位置。&lt;/ins&gt;&lt;div class=&quot;chat-actions&quot;&gt;&lt;button class=&quot;chat-mini-action primary&quot; type=&quot;button&quot;&gt;Accept&lt;/button&gt;&lt;button class=&quot;chat-mini-action&quot; type=&quot;button&quot;&gt;Reject&lt;/button&gt;&lt;button class=&quot;chat-mini-action&quot; type=&quot;button&quot;&gt;Ask why&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;` : &quot;&quot;}
        &lt;p&gt;这里的关键不是把右栏做成一个浮窗，而是拆开 Composer、Answer、Artifact 和 Memory。它们共享同一个上下文，却不需要共享同一个矩形。&lt;/p&gt;
        &lt;p&gt;短解释可以停在段落旁，长分析需要一个稳定的阅读面，真正的文字修改则必须变成可接受或拒绝的 Diff。&lt;/p&gt;
      &lt;/article&gt;`;
    }

    function articleStage(withDiff = false) {
      if (state.mode === &quot;edit&quot;) return `&lt;div class=&quot;chat-article-stage&quot;&gt;&lt;pre class=&quot;chat-code-source&quot; aria-label=&quot;Markdown editor&quot;&gt;${source.replaceAll(&quot;&amp;&quot;, &quot;&amp;amp;&quot;).replaceAll(&quot;&lt;&quot;, &quot;&amp;lt;&quot;)}&lt;/pre&gt;&lt;/div&gt;`;
      if (state.mode === &quot;split&quot;) return `&lt;div class=&quot;chat-split-stage&quot;&gt;&lt;pre class=&quot;chat-code-source&quot; aria-label=&quot;Markdown editor&quot;&gt;${source.replaceAll(&quot;&amp;&quot;, &quot;&amp;amp;&quot;).replaceAll(&quot;&lt;&quot;, &quot;&amp;lt;&quot;)}&lt;/pre&gt;${articleContent(withDiff)}&lt;/div&gt;`;
      return `&lt;div class=&quot;chat-article-stage&quot;&gt;${articleContent(withDiff)}&lt;/div&gt;`;
    }

    function composer() {
      return `&lt;div class=&quot;chat-composer&quot; aria-label=&quot;Floating article chat composer&quot;&gt;
        &lt;div class=&quot;chat-composer-main&quot;&gt;
          &lt;div class=&quot;chat-composer-context&quot;&gt;&lt;span class=&quot;chat-context-chip&quot;&gt;Current draft&lt;/span&gt;&lt;span class=&quot;chat-context-chip&quot;&gt;Selected paragraph&lt;/span&gt;&lt;span class=&quot;chat-context-chip&quot;&gt;5 sources&lt;/span&gt;&lt;/div&gt;
          &lt;textarea aria-label=&quot;Ask Codex&quot; placeholder=&quot;Ask about this article…&quot;&gt;&lt;/textarea&gt;
        &lt;/div&gt;
        &lt;button class=&quot;chat-send&quot; type=&quot;button&quot;&gt;Send ↑&lt;/button&gt;
      &lt;/div&gt;`;
    }

    function bubble(text = &quot;这句话表达的是空间关系：对话入口贴近文章，但回答不必一直覆盖文章。建议把它收紧为一句产品原则。&quot;) {
      return `&lt;aside class=&quot;chat-bubble&quot; aria-label=&quot;Anchored answer&quot;&gt;&lt;div class=&quot;chat-answer-head&quot;&gt;&lt;strong&gt;Answer · paragraph 2&lt;/strong&gt;&lt;span class=&quot;chat-status-chip&quot;&gt;Anchor&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;chat-answer-copy&quot;&gt;${text}&lt;/p&gt;&lt;div class=&quot;chat-actions&quot;&gt;&lt;button class=&quot;chat-mini-action primary&quot; type=&quot;button&quot;&gt;Turn into diff&lt;/button&gt;&lt;button class=&quot;chat-mini-action&quot; type=&quot;button&quot;&gt;Expand&lt;/button&gt;&lt;button class=&quot;chat-mini-action&quot; type=&quot;button&quot;&gt;Collapse&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;`;
    }

    function sheet() {
      return `&lt;aside class=&quot;chat-sheet&quot; aria-label=&quot;Long answer sheet&quot;&gt;&lt;div class=&quot;chat-answer-head&quot;&gt;&lt;strong&gt;Source comparison · 5 sources&lt;/strong&gt;&lt;span class=&quot;chat-status-chip&quot;&gt;Half sheet&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;chat-sheet-copy&quot;&gt;&lt;p&gt;&lt;strong&gt;共同点&lt;/strong&gt;&lt;br&gt;几个来源都把固定 Chat 视为工作区，但忽略了文章本身已经是主要工作区。持续并列会让阅读宽度成为稀缺资源。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;分歧&lt;/strong&gt;&lt;br&gt;一种思路让回答覆盖内容，另一种让布局临时重排。前者稳定正文宽度，后者保留并看能力；Split 模式需要自动降级。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;chat-actions&quot;&gt;&lt;button class=&quot;chat-mini-action&quot; type=&quot;button&quot;&gt;Peek&lt;/button&gt;&lt;button class=&quot;chat-mini-action primary&quot; type=&quot;button&quot;&gt;Half&lt;/button&gt;&lt;button class=&quot;chat-mini-action&quot; type=&quot;button&quot;&gt;Open focus&lt;/button&gt;&lt;button class=&quot;chat-mini-action&quot; type=&quot;button&quot;&gt;Collapse to thread&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;`;
    }

    function lens() {
      return `&lt;section class=&quot;chat-lens&quot; aria-label=&quot;Conversation focus lens&quot;&gt;&lt;aside class=&quot;chat-lens-context&quot;&gt;&lt;span class=&quot;chat-status-chip&quot;&gt;Context preserved&lt;/span&gt;&lt;blockquote&gt;“我更想让对话从文章本身发生……”&lt;/blockquote&gt;&lt;span class=&quot;chat-context-chip&quot;&gt;5 sources&lt;/span&gt;&lt;span class=&quot;chat-context-chip&quot;&gt;revision 18&lt;/span&gt;&lt;/aside&gt;&lt;div class=&quot;chat-lens-main&quot;&gt;&lt;div class=&quot;chat-answer-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;chat-status-chip&quot;&gt;Deep research&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;chat-mini-action&quot; type=&quot;button&quot;&gt;Return to article&lt;/button&gt;&lt;/div&gt;&lt;h2&gt;Chat 不应该拥有一个永久地址&lt;/h2&gt;&lt;p&gt;深度讨论暂时占据注意力，但仍保持与原文的可逆连接。&lt;/p&gt;&lt;div class=&quot;chat-reasoning-section&quot;&gt;&lt;strong&gt;1 · 输入与回答解耦&lt;/strong&gt;&lt;p&gt;Composer 保持轻量，回答根据长度、意图和后续动作选择 Bubble、Sheet 或 Artifact。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;chat-reasoning-section&quot;&gt;&lt;strong&gt;2 · 修改回到文章&lt;/strong&gt;&lt;p&gt;所有改写结果都生成 Proposed Diff；聊天记录解释为什么改，文章层决定是否接受。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;chat-reasoning-section&quot;&gt;&lt;strong&gt;3 · 历史退到背景&lt;/strong&gt;&lt;p&gt;收起后只留下 Thread Chip。它保留锚点、revision 与阅读位置，但不永久消耗正文宽度。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`;
    }

    function rail() {
      return `&lt;aside class=&quot;chat-rail&quot; aria-label=&quot;Temporary chat rail&quot;&gt;&lt;div class=&quot;chat-answer-head&quot;&gt;&lt;strong&gt;Article chat&lt;/strong&gt;&lt;span class=&quot;chat-status-chip&quot;&gt;Temporary rail&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;chat-rail-message&quot;&gt;我把 5 个来源的分歧整理成了三组。当前段落的判断更接近“语义落点”，而不是单一浮层。&lt;/div&gt;&lt;div class=&quot;chat-rail-message&quot;&gt;如果你准备修改正文，我可以把结论转成一个逐段 Proposed Diff。&lt;/div&gt;&lt;div class=&quot;chat-actions&quot;&gt;&lt;button class=&quot;chat-mini-action primary&quot; type=&quot;button&quot;&gt;Create diff&lt;/button&gt;&lt;button class=&quot;chat-mini-action&quot; type=&quot;button&quot;&gt;Collapse&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;`;
    }

    function semanticControls() {
      return `&lt;div class=&quot;chat-semantic-prompts&quot; aria-label=&quot;Semantic answer examples&quot;&gt;
        ${[
          [&quot;local&quot;, &quot;Explain selection&quot;],
          [&quot;compare&quot;, &quot;Compare sources&quot;],
          [&quot;deep&quot;, &quot;Deep research&quot;],
          [&quot;rewrite&quot;, &quot;Rewrite paragraph&quot;]
        ].map(([key, label]) =&gt; `&lt;button class=&quot;chat-prompt-button&quot; type=&quot;button&quot; data-action=&quot;intent&quot; data-value=&quot;${key}&quot; aria-pressed=&quot;${state.intent === key}&quot;&gt;${label}&lt;/button&gt;`).join(&quot;&quot;)}
      &lt;/div&gt;`;
    }

    function workspace() {
      let gridClass = &quot;chat-work-grid&quot;;
      let overlay = &quot;&quot;;
      let side = &quot;&quot;;
      let diff = false;

      if (state.concept === &quot;anchor&quot;) overlay = bubble();
      if (state.concept === &quot;sheet&quot;) { gridClass += &quot; has-sheet&quot;; overlay = sheet(); }
      if (state.concept === &quot;lens&quot;) overlay = lens();
      if (state.concept === &quot;rail&quot;) { gridClass += &quot; has-rail&quot;; side = rail(); }
      if (state.concept === &quot;semantic&quot;) {
        if (state.intent === &quot;local&quot;) overlay = bubble(&quot;这段的核心不是让整个 Chat 浮起来，而是让问题在原文附近发生；回答读完后可以收成一个段落锚点。&quot;);
        if (state.intent === &quot;compare&quot;) { gridClass += &quot; has-sheet&quot;; overlay = sheet(); }
        if (state.intent === &quot;deep&quot;) overlay = lens();
        if (state.intent === &quot;rewrite&quot;) diff = true;
      }

      return `&lt;section class=&quot;chat-workspace&quot;&gt;${toolbar()}&lt;div class=&quot;${gridClass}&quot;&gt;${articleStage(diff)}${side}&lt;/div&gt;${overlay}${state.concept === &quot;semantic&quot; ? semanticControls() : &quot;&quot;}${state.concept === &quot;lens&quot; || (state.concept === &quot;semantic&quot; &amp;&amp; state.intent === &quot;deep&quot;) ? &quot;&quot; : composer()}&lt;/section&gt;`;
    }

    function sidebar() {
      return `&lt;aside class=&quot;chat-sidebar&quot;&gt;&lt;button class=&quot;chat-add&quot; type=&quot;button&quot;&gt;＋ Add draft&lt;/button&gt;&lt;div class=&quot;chat-sidebar-label&quot;&gt;Drafts&lt;/div&gt;&lt;button class=&quot;chat-draft&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;&lt;strong&gt;把 Chat 从一个房间变成一种能力&lt;/strong&gt;&lt;span&gt;2 threads · just now&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;chat-draft&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Agent 的边界不是权限开关&lt;/strong&gt;&lt;span&gt;5 sources · 12 min&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;chat-sidebar-label&quot;&gt;Knowledge&lt;/div&gt;&lt;button class=&quot;chat-draft&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Context engineering&lt;/strong&gt;&lt;span&gt;12 related items&lt;/span&gt;&lt;/button&gt;&lt;/aside&gt;`;
    }

    function note() {
      const item = concepts[state.concept];
      return `&lt;div class=&quot;chat-concept-note&quot;&gt;&lt;div class=&quot;chat-note-cell&quot;&gt;&lt;strong&gt;Best for&lt;/strong&gt;&lt;span&gt;${item.fit}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;chat-note-cell&quot;&gt;&lt;strong&gt;Main cost&lt;/strong&gt;&lt;span&gt;${item.cost}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;chat-note-cell&quot;&gt;&lt;strong&gt;Guardrail&lt;/strong&gt;&lt;span&gt;${item.guard}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
    }

    function render() {
      root.innerHTML = `${conceptPicker()}&lt;section class=&quot;chat-window&quot; aria-label=&quot;Blog Studio chat concept explorer&quot;&gt;&lt;header class=&quot;chat-topbar&quot;&gt;&lt;div class=&quot;chat-brand&quot;&gt;&lt;span class=&quot;chat-mark&quot;&gt;B&lt;/span&gt;&lt;span&gt;Blog Studio&lt;/span&gt;&lt;small class=&quot;chat-version&quot;&gt;after v0&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;chat-title&quot;&gt;Draft / 把 Chat 从一个房间变成一种能力&lt;/div&gt;&lt;div class=&quot;chat-thread-state&quot;&gt;&lt;span class=&quot;chat-running-dot&quot;&gt;&lt;/span&gt;&lt;span&gt;Autosaved&lt;/span&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;chat-body&quot;&gt;${sidebar()}${workspace()}&lt;/div&gt;${note()}&lt;/section&gt;`;
    }

    root.addEventListener(&quot;click&quot;, (event) =&gt; {
      const target = event.target.closest(&quot;[data-action]&quot;);
      if (!target) return;
      if (target.dataset.action === &quot;concept&quot;) state.concept = target.dataset.value;
      if (target.dataset.action === &quot;mode&quot;) state.mode = target.dataset.value;
      if (target.dataset.action === &quot;intent&quot;) state.intent = target.dataset.value;
      render();
    });

    render();
  })();
&lt;/script&gt;


&lt;style id=&quot;codex-visualization-document-scrollbar&quot;&gt;html,body{scrollbar-width:none!important}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important}&lt;/style&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;

"></iframe>
<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
