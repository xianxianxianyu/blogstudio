&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;blog-studio-chat-concepts&quot;);
    if (!root) return;

    const drafts = {
      chat: {
        title: &quot;把 Chat 从一个房间变成一种能力&quot;,
        deck: &quot;输入可以悬浮，但回答需要找到正确的落点。&quot;,
        meta: &quot;2 threads · just now&quot;,
        blocks: [
          &quot;固定 Chat 侧栏有一种诚实的简单：文章在这里，对话在那里。但这种清晰是用空间换来的，真正重要的正文反而最窄。&quot;,
          &quot;我更想让对话从文章本身发生，而不是先离开文章，再进入另一个房间。&quot;,
          &quot;Read 和 Edit 也不应该是两个页面。文章默认适合阅读，点击任意 Block 就能直接编辑，光标离开后恢复干净排版。&quot;,
          &quot;这里的关键不是把右栏做成浮窗，而是拆开 Composer、Answer、Artifact 和 Memory。&quot;
        ]
      },
      boundary: {
        title: &quot;Agent 的边界不是权限开关&quot;,
        deck: &quot;真正可靠的边界来自可见状态、可逆操作和确定性校验。&quot;,
        meta: &quot;5 sources · 12 min&quot;,
        blocks: [
          &quot;如果一个 Agent 能执行动作，权限开关只能回答它是否被允许，却不能解释它为何此刻应该执行。&quot;,
          &quot;人需要看到计划、输入、影响范围和失败后的恢复路径，而不是只看到一个最终按钮。&quot;,
          &quot;因此，建议和修改之间必须存在 Proposed Diff，批准和发布之间也必须存在确定性校验。&quot;,
          &quot;自动化最适合处理重复且可验证的步骤，而不是替代内容判断。&quot;
        ]
      },
      canvas: {
        title: &quot;Living Canvas 的编辑模型&quot;,
        deck: &quot;阅读是静止状态，编辑是激活状态，Source 只是逃生舱。&quot;,
        meta: &quot;1 thread · 28 min&quot;,
        blocks: [
          &quot;所见即所得并不意味着抛弃 Markdown，而是让 Markdown 退到可靠的数据层。&quot;,
          &quot;用户点击段落即可编辑；复杂结构可以进入专门的 Block Editor。&quot;,
          &quot;Source Drawer 仍然存在，用于 Frontmatter、Raw HTML、冲突和无损检查。&quot;,
          &quot;Agent 的文字结果首先成为 Diff，只有接受之后才进入文章。&quot;
        ]
      }
    };

    const state = {
      concept: &quot;semantic&quot;,
      draft: &quot;chat&quot;,
      focus: false,
      mobile: false,
      outline: false,
      menu: false,
      source: false,
      frontmatter: false,
      threads: false,
      addOpen: false,
      answer: &quot;near&quot;,
      selectedBlock: 1,
      composer: &quot;&quot;,
      addContext: &quot;&quot;,
      addPrompt: &quot;&quot;,
      saveLabel: &quot;Autosaved&quot;
    };

    const escapeHtml = (value) =&gt; String(value)
      .replaceAll(&quot;&amp;&quot;, &quot;&amp;amp;&quot;)
      .replaceAll(&quot;&lt;&quot;, &quot;&amp;lt;&quot;)
      .replaceAll(&quot;&gt;&quot;, &quot;&amp;gt;&quot;)
      .replaceAll('&quot;', &quot;&amp;quot;&quot;);

    function conceptPicker() {
      return `&lt;div class=&quot;studio-concepts&quot; aria-label=&quot;Retained chat concepts&quot;&gt;
        &lt;button class=&quot;studio-concept&quot; type=&quot;button&quot; data-action=&quot;concept&quot; data-value=&quot;anchor&quot; aria-pressed=&quot;${state.concept === &quot;anchor&quot;}&quot;&gt;&lt;strong&gt;A · Anchored Bubble&lt;/strong&gt;&lt;span&gt;一种固定落点：局部问题始终贴着对应 Block&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;studio-concept&quot; type=&quot;button&quot; data-action=&quot;concept&quot; data-value=&quot;semantic&quot; aria-pressed=&quot;${state.concept === &quot;semantic&quot;}&quot;&gt;&lt;strong&gt;E · Semantic Landing&lt;/strong&gt;&lt;span&gt;一个调度系统：Near / Expand / Focus / Inline Diff&lt;/span&gt;&lt;/button&gt;
      &lt;/div&gt;`;
    }

    function topbar(item) {
      return `&lt;header class=&quot;studio-topbar&quot;&gt;&lt;div class=&quot;studio-brand&quot;&gt;&lt;span class=&quot;studio-mark&quot;&gt;B&lt;/span&gt;&lt;span&gt;Blog Studio&lt;/span&gt;&lt;small class=&quot;studio-version&quot;&gt;v1 candidate&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;studio-breadcrumb&quot;&gt;Draft / ${escapeHtml(item.title)}&lt;/div&gt;&lt;div class=&quot;studio-save-state&quot;&gt;&lt;span class=&quot;studio-save-dot&quot;&gt;&lt;/span&gt;&lt;span&gt;${escapeHtml(state.saveLabel)}&lt;/span&gt;&lt;/div&gt;&lt;/header&gt;`;
    }

    function sidebar() {
      return `&lt;aside class=&quot;studio-sidebar&quot;&gt;&lt;button class=&quot;studio-add&quot; type=&quot;button&quot; data-action=&quot;open-add&quot;&gt;＋ Add draft&lt;/button&gt;&lt;div class=&quot;studio-side-label&quot;&gt;Drafts&lt;/div&gt;${Object.entries(drafts).map(([key, item]) =&gt; `&lt;button class=&quot;studio-draft&quot; type=&quot;button&quot; data-action=&quot;draft&quot; data-value=&quot;${key}&quot; aria-pressed=&quot;${state.draft === key}&quot;&gt;&lt;strong&gt;${escapeHtml(item.title)}&lt;/strong&gt;&lt;span&gt;${escapeHtml(item.meta)}&lt;/span&gt;&lt;/button&gt;`).join(&quot;&quot;)}&lt;div class=&quot;studio-side-label&quot;&gt;Knowledge&lt;/div&gt;&lt;div class=&quot;studio-draft&quot;&gt;&lt;strong&gt;Context engineering&lt;/strong&gt;&lt;span&gt;12 related items&lt;/span&gt;&lt;/div&gt;&lt;/aside&gt;`;
    }

    function toolbar() {
      const menu = state.menu
        ? `&lt;div class=&quot;studio-toolbar-menu&quot; role=&quot;menu&quot;&gt;&lt;button class=&quot;studio-menu-action&quot; type=&quot;button&quot; role=&quot;menuitem&quot; data-action=&quot;source&quot;&gt;&lt;span&gt;Markdown source&lt;/span&gt;&lt;span&gt;⌘ /&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;studio-menu-action&quot; type=&quot;button&quot; role=&quot;menuitem&quot; data-action=&quot;mobile&quot;&gt;&lt;span&gt;${state.mobile ? &quot;Exit mobile preview&quot; : &quot;Mobile preview&quot;}&lt;/span&gt;&lt;span&gt;Preview&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;studio-menu-action&quot; type=&quot;button&quot; role=&quot;menuitem&quot; data-action=&quot;frontmatter&quot;&gt;&lt;span&gt;Frontmatter&lt;/span&gt;&lt;span&gt;Metadata&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;`
        : &quot;&quot;;
      return `&lt;div class=&quot;studio-toolbar&quot;&gt;&lt;div class=&quot;studio-toolbar-group&quot;&gt;&lt;button class=&quot;studio-tool&quot; type=&quot;button&quot; data-action=&quot;focus&quot; aria-pressed=&quot;${state.focus}&quot;&gt;${state.focus ? &quot;Exit focus&quot; : &quot;Focus&quot;}&lt;/button&gt;&lt;button class=&quot;studio-tool&quot; type=&quot;button&quot; data-action=&quot;outline&quot; aria-pressed=&quot;${state.outline}&quot;&gt;Outline&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;studio-toolbar-group&quot;&gt;&lt;span class=&quot;studio-tool-label&quot;&gt;Living Canvas · click any paragraph to edit&lt;/span&gt;&lt;button class=&quot;studio-icon-tool&quot; type=&quot;button&quot; data-action=&quot;threads&quot; aria-label=&quot;Open chat history&quot; title=&quot;Chat history&quot; aria-pressed=&quot;${state.threads}&quot;&gt;↺&lt;span class=&quot;studio-history-badge&quot;&gt;3&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;studio-toolbar-menu-wrap&quot;&gt;&lt;button class=&quot;studio-icon-tool&quot; type=&quot;button&quot; data-action=&quot;menu&quot; aria-label=&quot;More article tools&quot; aria-haspopup=&quot;menu&quot; aria-expanded=&quot;${state.menu}&quot;&gt;···&lt;/button&gt;${menu}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
    }

    function outline() {
      if (!state.outline) return &quot;&quot;;
      return `&lt;nav class=&quot;studio-outline&quot; aria-label=&quot;Article outline&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;jump&quot; data-value=&quot;0&quot;&gt;01 · 固定侧栏的问题&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;jump&quot; data-value=&quot;1&quot;&gt;02 · 对话从文章发生&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;jump&quot; data-value=&quot;2&quot;&gt;03 · Living Canvas&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;jump&quot; data-value=&quot;3&quot;&gt;04 · 四层模型&lt;/button&gt;&lt;/nav&gt;`;
    }

    function diffBlock() {
      if (state.answer !== &quot;diff&quot;) return &quot;&quot;;
      return `&lt;div class=&quot;studio-diff&quot;&gt;&lt;span class=&quot;studio-status&quot;&gt;Proposed diff · paragraph ${state.selectedBlock + 1}&lt;/span&gt;&lt;del&gt;Chat 应该悬浮在文章上方。&lt;/del&gt;&lt;ins&gt;输入可以悬浮，但回答应根据长度与意图回到最合适的位置。&lt;/ins&gt;&lt;div class=&quot;studio-actions&quot;&gt;&lt;button class=&quot;studio-small-action primary&quot; type=&quot;button&quot; data-action=&quot;accept-diff&quot;&gt;Accept&lt;/button&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;reject-diff&quot;&gt;Reject&lt;/button&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;ask-diff&quot;&gt;Ask why&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
    }

    function article(item) {
      return `&lt;div class=&quot;studio-canvas ${state.answer === &quot;expand&quot; ? &quot;has-expand&quot; : &quot;&quot;}&quot;&gt;&lt;article class=&quot;studio-article&quot;&gt;&lt;h1&gt;${escapeHtml(item.title)}&lt;/h1&gt;&lt;p class=&quot;studio-deck&quot;&gt;${escapeHtml(item.deck)}&lt;/p&gt;${item.blocks.map((block, index) =&gt; `&lt;p class=&quot;studio-block ${state.selectedBlock === index ? &quot;is-selected&quot; : &quot;&quot;}&quot; contenteditable=&quot;true&quot; data-block=&quot;${index}&quot; spellcheck=&quot;false&quot;&gt;${escapeHtml(block)}&lt;/p&gt;${index === state.selectedBlock ? diffBlock() : &quot;&quot;}`).join(&quot;&quot;)}&lt;p class=&quot;studio-edit-hint&quot;&gt;Markdown-backed · click to edit · Source remains available as an escape hatch&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;`;
    }

    function prompts() {
      if (state.concept !== &quot;semantic&quot; || state.answer === &quot;focus&quot;) return &quot;&quot;;
      const choices = [[&quot;near&quot;, &quot;Explain selection&quot;], [&quot;expand&quot;, &quot;Compare sources&quot;], [&quot;focus&quot;, &quot;Deep research&quot;], [&quot;diff&quot;, &quot;Rewrite paragraph&quot;]];
      return `&lt;div class=&quot;studio-prompts&quot; aria-label=&quot;Semantic landing examples&quot;&gt;${choices.map(([key, label]) =&gt; `&lt;button class=&quot;studio-prompt&quot; type=&quot;button&quot; data-action=&quot;answer&quot; data-value=&quot;${key}&quot; aria-pressed=&quot;${state.answer === key}&quot;&gt;${label}&lt;/button&gt;`).join(&quot;&quot;)}&lt;/div&gt;`;
    }

    function composer() {
      if (state.answer === &quot;focus&quot;) return &quot;&quot;;
      return `&lt;form class=&quot;studio-composer&quot;&gt;&lt;div class=&quot;studio-composer-main&quot;&gt;&lt;div class=&quot;studio-context&quot;&gt;&lt;span class=&quot;studio-chip&quot;&gt;Current draft&lt;/span&gt;&lt;span class=&quot;studio-chip&quot;&gt;Paragraph ${state.selectedBlock + 1}&lt;/span&gt;&lt;span class=&quot;studio-chip&quot;&gt;5 sources&lt;/span&gt;&lt;/div&gt;&lt;textarea name=&quot;message&quot; aria-label=&quot;Ask Codex&quot; placeholder=&quot;Ask about this article…&quot;&gt;${escapeHtml(state.composer)}&lt;/textarea&gt;&lt;/div&gt;&lt;button class=&quot;studio-send&quot; type=&quot;submit&quot;&gt;Send ↑&lt;/button&gt;&lt;/form&gt;`;
    }

    function nearAnswer() {
      if (state.answer !== &quot;near&quot;) return &quot;&quot;;
      const text = state.concept === &quot;anchor&quot;
        ? &quot;A 把回答绑定在当前 Block。它很适合局部解释，但严格限制为短回复；更长内容进入完整 Thread，避免气泡继续遮挡正文。&quot;
        : &quot;这段适合 Near：它是在解释一个局部判断。回答贴近原文，读完后可以收成 Thread Chip，修改则转成 Proposed Diff。&quot;;
      return `&lt;aside class=&quot;studio-answer&quot; style=&quot;top:${210 + state.selectedBlock * 82}px&quot; aria-label=&quot;Anchored answer&quot;&gt;&lt;div class=&quot;studio-answer-head&quot;&gt;&lt;strong&gt;Answer · paragraph ${state.selectedBlock + 1}&lt;/strong&gt;&lt;span class=&quot;studio-status&quot;&gt;${state.concept === &quot;anchor&quot; ? &quot;A · Anchor&quot; : &quot;E · Near&quot;}&lt;/span&gt;&lt;/div&gt;&lt;p&gt;${text}&lt;/p&gt;&lt;div class=&quot;studio-actions&quot;&gt;&lt;button class=&quot;studio-small-action primary&quot; type=&quot;button&quot; data-action=&quot;make-diff&quot;&gt;Turn into diff&lt;/button&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;open-thread&quot;&gt;Open full answer&lt;/button&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;collapse&quot;&gt;Collapse&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;`;
    }

    function expandAnswer() {
      if (state.concept !== &quot;semantic&quot; || state.answer !== &quot;expand&quot;) return &quot;&quot;;
      return `&lt;aside class=&quot;studio-expand&quot; aria-label=&quot;Expanded long answer&quot;&gt;&lt;div class=&quot;studio-answer-head&quot;&gt;&lt;strong&gt;Source comparison · 5 sources&lt;/strong&gt;&lt;span class=&quot;studio-status&quot;&gt;E · Expand&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;studio-expand-copy&quot;&gt;&lt;p&gt;&lt;strong&gt;共同点&lt;/strong&gt;&lt;br&gt;几个来源都把固定 Chat 当作工作区，却忽略了文章本身已经是主要工作区。持续并列会让正文宽度成为稀缺资源。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;分歧&lt;/strong&gt;&lt;br&gt;有的方案让回复覆盖内容，有的让布局重排。Semantic Landing 的优势是根据任务选择表面，而不是强迫所有回复进入同一矩形。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;studio-actions&quot;&gt;&lt;button class=&quot;studio-small-action primary&quot; type=&quot;button&quot; data-action=&quot;answer&quot; data-value=&quot;focus&quot;&gt;Open focus&lt;/button&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;make-diff&quot;&gt;Create diff&lt;/button&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;collapse&quot;&gt;Collapse to thread&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;`;
    }

    function focusAnswer() {
      if (state.concept !== &quot;semantic&quot; || state.answer !== &quot;focus&quot;) return &quot;&quot;;
      return `&lt;section class=&quot;studio-focus-answer&quot; aria-label=&quot;Focused conversation&quot;&gt;&lt;aside class=&quot;studio-focus-context&quot;&gt;&lt;span class=&quot;studio-status&quot;&gt;Context preserved&lt;/span&gt;&lt;blockquote&gt;“${escapeHtml(drafts[state.draft].blocks[state.selectedBlock])}”&lt;/blockquote&gt;&lt;span class=&quot;studio-chip&quot;&gt;5 sources&lt;/span&gt; &lt;span class=&quot;studio-chip&quot;&gt;revision 18&lt;/span&gt;&lt;/aside&gt;&lt;div class=&quot;studio-focus-copy&quot;&gt;&lt;div class=&quot;studio-answer-head&quot;&gt;&lt;span class=&quot;studio-status&quot;&gt;E · Focus&lt;/span&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;return-canvas&quot;&gt;Return to canvas&lt;/button&gt;&lt;/div&gt;&lt;h2&gt;Chat 不应该拥有一个永久地址&lt;/h2&gt;&lt;p&gt;深度讨论可以暂时占据注意力，但仍保持与原文的可逆连接。&lt;/p&gt;&lt;div class=&quot;studio-focus-section&quot;&gt;&lt;strong&gt;输入和回答解耦&lt;/strong&gt;&lt;p&gt;Composer 保持轻量，回答根据意图选择 Near、Expand、Focus 或 Artifact。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;studio-focus-section&quot;&gt;&lt;strong&gt;修改回到文章&lt;/strong&gt;&lt;p&gt;聊天记录解释为什么改，Living Canvas 负责展示 Diff 并决定是否接受。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;studio-actions&quot;&gt;&lt;button class=&quot;studio-small-action primary&quot; type=&quot;button&quot; data-action=&quot;make-diff&quot;&gt;Create proposed diff&lt;/button&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;collapse&quot;&gt;Save to thread&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`;
    }

    function sourceDrawer(item) {
      if (!state.source) return &quot;&quot;;
      const markdown = `# ${item.title}\n\n${item.deck}\n\n${item.blocks.join(&quot;\n\n&quot;)}`;
      return `&lt;aside class=&quot;studio-drawer&quot; aria-label=&quot;Markdown source drawer&quot;&gt;&lt;div class=&quot;studio-source-head&quot;&gt;&lt;h2&gt;Markdown Source&lt;/h2&gt;&lt;button class=&quot;studio-close&quot; type=&quot;button&quot; data-action=&quot;close-source&quot;&gt;Close&lt;/button&gt;&lt;/div&gt;&lt;textarea aria-label=&quot;Markdown source&quot;&gt;${escapeHtml(markdown)}&lt;/textarea&gt;&lt;div class=&quot;studio-actions&quot;&gt;&lt;button class=&quot;studio-small-action primary&quot; type=&quot;button&quot; data-action=&quot;apply-source&quot;&gt;Apply &amp; return&lt;/button&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;close-source&quot;&gt;Cancel&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;`;
    }

    function frontmatterDrawer() {
      if (!state.frontmatter) return &quot;&quot;;
      return `&lt;aside class=&quot;studio-drawer&quot; aria-label=&quot;Frontmatter inspector&quot;&gt;&lt;div class=&quot;studio-source-head&quot;&gt;&lt;h2&gt;Frontmatter&lt;/h2&gt;&lt;button class=&quot;studio-close&quot; type=&quot;button&quot; data-action=&quot;close-frontmatter&quot;&gt;Close&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;studio-field&quot;&gt;&lt;label for=&quot;studio-frontmatter-description&quot;&gt;Description&lt;/label&gt;&lt;textarea id=&quot;studio-frontmatter-description&quot;&gt;输入可以悬浮，但回答需要找到正确的落点。&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;studio-field&quot;&gt;&lt;label for=&quot;studio-frontmatter-tags&quot;&gt;Tags&lt;/label&gt;&lt;input id=&quot;studio-frontmatter-tags&quot; value=&quot;design, agents, writing&quot;&gt;&lt;/div&gt;&lt;div class=&quot;studio-actions&quot;&gt;&lt;button class=&quot;studio-small-action primary&quot; type=&quot;button&quot; data-action=&quot;apply-frontmatter&quot;&gt;Save metadata&lt;/button&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;close-frontmatter&quot;&gt;Cancel&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;`;
    }

    function threadsDrawer() {
      if (!state.threads) return &quot;&quot;;
      return `&lt;aside class=&quot;studio-drawer&quot; aria-label=&quot;Chat history&quot;&gt;&lt;div class=&quot;studio-source-head&quot;&gt;&lt;h2&gt;Chat history&lt;/h2&gt;&lt;button class=&quot;studio-close&quot; type=&quot;button&quot; data-action=&quot;close-threads&quot;&gt;Close&lt;/button&gt;&lt;/div&gt;&lt;button class=&quot;studio-thread-row&quot; type=&quot;button&quot; data-action=&quot;open-answer&quot; data-value=&quot;near&quot;&gt;&lt;strong&gt;Why should input float?&lt;/strong&gt;&lt;span&gt;Paragraph 2 · 3 messages&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;studio-thread-row&quot; type=&quot;button&quot; data-action=&quot;open-answer&quot; data-value=&quot;expand&quot;&gt;&lt;strong&gt;Compare five interface references&lt;/strong&gt;&lt;span&gt;Article context · 6 messages&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;studio-thread-row&quot; type=&quot;button&quot; data-action=&quot;open-answer&quot; data-value=&quot;diff&quot;&gt;&lt;strong&gt;Rewrite the product principle&lt;/strong&gt;&lt;span&gt;Paragraph 3 · proposed diff&lt;/span&gt;&lt;/button&gt;&lt;/aside&gt;`;
    }

    function addModal() {
      if (!state.addOpen) return &quot;&quot;;
      return `&lt;div class=&quot;studio-backdrop&quot; data-action=&quot;close-add&quot;&gt;&lt;section class=&quot;studio-modal&quot; aria-label=&quot;Add draft&quot;&gt;&lt;div class=&quot;studio-modal-head&quot;&gt;&lt;h2&gt;Add draft&lt;/h2&gt;&lt;button class=&quot;studio-close&quot; type=&quot;button&quot; data-action=&quot;close-add&quot;&gt;Close&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;studio-field&quot;&gt;&lt;label for=&quot;studio-add-context&quot;&gt;Context or links&lt;/label&gt;&lt;textarea id=&quot;studio-add-context&quot; data-add-field=&quot;addContext&quot; placeholder=&quot;Paste raw context, links, or notes…&quot;&gt;${escapeHtml(state.addContext)}&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;studio-field&quot;&gt;&lt;label for=&quot;studio-add-prompt&quot;&gt;Your prompt&lt;/label&gt;&lt;input id=&quot;studio-add-prompt&quot; data-add-field=&quot;addPrompt&quot; value=&quot;${escapeHtml(state.addPrompt)}&quot; placeholder=&quot;Turn these materials into a concise blog draft&quot;&gt;&lt;/div&gt;&lt;div class=&quot;studio-modal-foot&quot;&gt;&lt;button class=&quot;studio-small-action&quot; type=&quot;button&quot; data-action=&quot;close-add&quot;&gt;Keep for later&lt;/button&gt;&lt;button class=&quot;studio-small-action primary&quot; type=&quot;button&quot; data-action=&quot;create-draft&quot;&gt;Create draft&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;`;
    }

    function note() {
      const anchor = state.concept === &quot;anchor&quot;;
      return `&lt;div class=&quot;studio-note&quot;&gt;&lt;div class=&quot;studio-note-cell&quot;&gt;&lt;strong&gt;Logic&lt;/strong&gt;&lt;span&gt;${anchor ? &quot;回答属于内容位置：所有回复先成为 Block 旁的 Bubble。&quot; : &quot;输入统一，回答按照意图落到 Near、Expand、Focus 或 Diff。&quot;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;studio-note-cell&quot;&gt;&lt;strong&gt;Best for&lt;/strong&gt;&lt;span&gt;${anchor ? &quot;局部解释、核查和短改写，规则简单可预测。&quot; : &quot;同时覆盖短答、长分析、深聊和直接改文。&quot;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;studio-note-cell&quot;&gt;&lt;strong&gt;Main guardrail&lt;/strong&gt;&lt;span&gt;${anchor ? &quot;Bubble 最多约 6 行，超长只给摘要和完整 Thread 入口。&quot; : &quot;表面迁移必须保留 Block、revision、光标和滚动位置。&quot;}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
    }

    function workspace(item) {
      return `&lt;main class=&quot;studio-workspace&quot;&gt;${toolbar()}${outline()}${article(item)}${prompts()}${composer()}${nearAnswer()}${expandAnswer()}${focusAnswer()}${sourceDrawer(item)}${frontmatterDrawer()}${threadsDrawer()}&lt;/main&gt;`;
    }

    function render() {
      const item = drafts[state.draft];
      root.innerHTML = `${conceptPicker()}&lt;div class=&quot;studio-window-wrap&quot;&gt;&lt;section class=&quot;studio-window ${state.mobile ? &quot;is-mobile&quot; : &quot;&quot;}&quot; aria-label=&quot;Blog Studio A and E prototype&quot;&gt;${topbar(item)}&lt;div class=&quot;studio-body ${state.focus ? &quot;is-focus&quot; : &quot;&quot;}&quot;&gt;${sidebar()}${workspace(item)}&lt;/div&gt;${note()}${addModal()}&lt;/section&gt;&lt;/div&gt;`;
    }

    root.addEventListener(&quot;input&quot;, (event) =&gt; {
      if (event.target.matches(&quot;.studio-composer textarea&quot;)) state.composer = event.target.value;
      if (event.target.dataset.addField) state[event.target.dataset.addField] = event.target.value;
      if (event.target.dataset.block !== undefined) {
        drafts[state.draft].blocks[Number(event.target.dataset.block)] = event.target.textContent;
        state.saveLabel = &quot;Saving…&quot;;
        setTimeout(() =&gt; {
          state.saveLabel = &quot;Autosaved&quot;;
          const label = root.querySelector(&quot;.studio-save-state span:last-child&quot;);
          if (label) label.textContent = state.saveLabel;
        }, 450);
      }
    });

    root.addEventListener(&quot;focusin&quot;, (event) =&gt; {
      if (event.target.dataset.block === undefined) return;
      state.selectedBlock = Number(event.target.dataset.block);
      root.querySelectorAll(&quot;[data-block]&quot;).forEach(node =&gt; node.classList.toggle(&quot;is-selected&quot;, Number(node.dataset.block) === state.selectedBlock));
    });

    root.addEventListener(&quot;submit&quot;, (event) =&gt; {
      if (!event.target.matches(&quot;.studio-composer&quot;)) return;
      event.preventDefault();
      const message = new FormData(event.target).get(&quot;message&quot;)?.toString().trim() || &quot;&quot;;
      state.composer = message;
      if (state.concept === &quot;anchor&quot;) state.answer = &quot;near&quot;;
      else if (/rewrite|改写|重写/i.test(message)) state.answer = &quot;diff&quot;;
      else if (/deep|研究|深入/i.test(message)) state.answer = &quot;focus&quot;;
      else if (/compare|比较|来源/i.test(message) || message.length &gt; 60) state.answer = &quot;expand&quot;;
      else state.answer = &quot;near&quot;;
      render();
    });

    root.addEventListener(&quot;click&quot;, (event) =&gt; {
      const target = event.target.closest(&quot;[data-action]&quot;);
      if (!target) return;
      const action = target.dataset.action;
      const value = target.dataset.value;

      if (action === &quot;close-add&quot; &amp;&amp; event.target.closest(&quot;.studio-modal&quot;) &amp;&amp; !event.target.closest(&quot;button[data-action='close-add']&quot;)) return;
      if (action === &quot;concept&quot;) {
        state.concept = value;
        state.answer = &quot;near&quot;;
      }
      if (action === &quot;draft&quot;) {
        state.draft = value;
        state.selectedBlock = 1;
        state.answer = &quot;near&quot;;
        state.source = false;
        state.frontmatter = false;
        state.threads = false;
        state.menu = false;
      }
      if (action === &quot;focus&quot;) state.focus = !state.focus;
      if (action === &quot;menu&quot;) state.menu = !state.menu;
      if (action === &quot;mobile&quot;) { state.mobile = !state.mobile; state.menu = false; }
      if (action === &quot;outline&quot;) state.outline = !state.outline;
      if (action === &quot;source&quot;) { state.source = true; state.frontmatter = false; state.threads = false; state.menu = false; }
      if (action === &quot;close-source&quot;) state.source = false;
      if (action === &quot;apply-source&quot;) { state.source = false; state.saveLabel = &quot;Source applied&quot;; }
      if (action === &quot;frontmatter&quot;) { state.frontmatter = true; state.source = false; state.threads = false; state.menu = false; }
      if (action === &quot;close-frontmatter&quot;) state.frontmatter = false;
      if (action === &quot;apply-frontmatter&quot;) { state.frontmatter = false; state.saveLabel = &quot;Metadata saved&quot;; }
      if (action === &quot;threads&quot; || action === &quot;open-thread&quot;) { state.threads = true; state.source = false; state.frontmatter = false; state.menu = false; }
      if (action === &quot;close-threads&quot;) state.threads = false;
      if (action === &quot;answer&quot;) state.answer = value;
      if (action === &quot;make-diff&quot;) { state.answer = &quot;diff&quot;; state.threads = false; }
      if (action === &quot;collapse&quot;) state.answer = &quot;none&quot;;
      if (action === &quot;return-canvas&quot;) state.answer = &quot;near&quot;;
      if (action === &quot;open-answer&quot;) { state.answer = value; state.threads = false; }
      if (action === &quot;accept-diff&quot;) { state.answer = &quot;none&quot;; state.saveLabel = &quot;Diff accepted · autosaved&quot;; }
      if (action === &quot;reject-diff&quot;) { state.answer = &quot;near&quot;; state.saveLabel = &quot;Diff rejected&quot;; }
      if (action === &quot;ask-diff&quot;) { state.answer = state.concept === &quot;semantic&quot; ? &quot;expand&quot; : &quot;near&quot;; }
      if (action === &quot;jump&quot;) { state.selectedBlock = Number(value); state.outline = false; }
      if (action === &quot;open-add&quot;) state.addOpen = true;
      if (action === &quot;close-add&quot;) state.addOpen = false;
      if (action === &quot;create-draft&quot;) {
        drafts.generated = {
          title: state.addPrompt.trim() || &quot;Untitled agent draft&quot;,
          deck: &quot;Generated from the saved creation context.&quot;,
          meta: &quot;new · autosaved&quot;,
          blocks: [
            state.addContext.trim() || &quot;Start writing here. This Living Canvas is ready for direct editing.&quot;,
            &quot;The source context remains attached to this draft and can be inspected from the article thread.&quot;,
            &quot;Ask Codex from the floating composer when you want to explain, compare, research, or rewrite.&quot;,
            &quot;Any generated change will appear as a Proposed Diff before it enters the article.&quot;
          ]
        };
        state.draft = &quot;generated&quot;;
        state.selectedBlock = 0;
        state.answer = &quot;none&quot;;
        state.addOpen = false;
        state.saveLabel = &quot;Draft created&quot;;
        state.addContext = &quot;&quot;;
        state.addPrompt = &quot;&quot;;
      }
      render();
    });

    root.addEventListener(&quot;keydown&quot;, (event) =&gt; {
      if (event.key !== &quot;Escape&quot;) return;
      if (state.addOpen) state.addOpen = false;
      else if (state.source) state.source = false;
      else if (state.threads) state.threads = false;
      else if (state.outline) state.outline = false;
      else if (state.answer === &quot;focus&quot; || state.answer === &quot;expand&quot;) state.answer = &quot;near&quot;;
      else if (state.answer !== &quot;none&quot;) state.answer = &quot;none&quot;;
      render();
    });

    render();
  })();
&lt;/script&gt;


&lt;style id=&quot;codex-visualization-document-scrollbar&quot;&gt;html,body{scrollbar-width:none!important}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important}&lt;/style&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
