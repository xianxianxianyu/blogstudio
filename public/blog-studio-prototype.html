  border-top: 1px solid var(--border);
  padding-top: 12px;
}

.screen-sync .sy-sec-cap {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 8px;
}

.screen-sync .sy-block {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-left: 3px solid var(--sync-solid);
  border-radius: var(--r);
  padding: 9px 11px 10px;
}

.screen-sync .sy-block-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-faint);
  margin-bottom: 6px;
}

.screen-sync .sy-block-text {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 13px;
  line-height: 1.75;
  color: var(--text);
  user-select: text;
}

.screen-sync .sy-block-foot {
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px dashed var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--text-dim);
}

.screen-sync .sy-toc { display: flex; flex-direction: column; gap: 2px; }

.screen-sync .sy-toc-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 5px 7px;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
}

.screen-sync .sy-toc-on {
  background: var(--bg-elev);
  border-color: var(--sync-border);
}

.screen-sync .sy-toc-n {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  flex: none;
  width: 12px;
}

.screen-sync .sy-toc-on .sy-toc-n { color: var(--sync); }

.screen-sync .sy-toc-t {
  font-size: 12.3px;
  line-height: 1.45;
  color: var(--text-dim);
  min-width: 0;
}

.screen-sync .sy-toc-on .sy-toc-t { color: var(--text); font-weight: 550; }

.screen-sync .sy-toc-n2 {
  margin-left: auto;
  flex: none;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
}

.screen-sync .sy-toc-flag {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 3px 0 2px 27px;
}

.screen-sync .sy-side-locked {
  margin: 0 12px 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 9px;
  border-radius: var(--r-sm);
  background: var(--bg-elev);
  border: 1px dashed var(--border-strong);
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-faint);
}

/* ---------- 4. 底部：输入 / Decision 表单 ---------- */

.screen-sync .sy-foot {
  flex: none;
  border-top: 1px solid var(--sync-border);
  background: color-mix(in srgb, var(--sync) 6%, var(--bg-elev));
  padding: 12px 16px 13px;
}

.screen-sync .sy-composer {
  display: flex;
  align-items: flex-end;
  gap: 12px;
}

.screen-sync .sy-ta {
  flex: 1;
  min-width: 0;
  min-height: 46px;
  max-height: 120px;
  resize: none;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 1px solid var(--border-strong);
  background: var(--bg-elev);
  color: var(--text);
  font-size: 13.5px;
  line-height: 1.6;
}

.screen-sync .sy-ta::placeholder { color: var(--text-faint); }

.screen-sync .sy-ta:focus {
  outline: none;
  border-color: var(--sync);
  box-shadow: 0 0 0 3px var(--sync-bg);
}

.screen-sync .sy-composer-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex: none;
}

.screen-sync .sy-hint {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--sync-text);
  opacity: 0.85;
}

/* ----- Decision 表单 ----- */

.screen-sync .sy-form {
  display: flex;
  flex-direction: column;
  gap: 11px;
  max-height: 44vh;
  overflow-y: auto;
  animation: sync-slide 0.16s ease-out;
}

@keyframes sync-slide {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.screen-sync .sy-form-head {
  display: flex;
  align-items: center;
  gap: 9px;
}

.screen-sync .sy-form-head .sy-form-sub {
  font-size: 11.5px;
  color: var(--sync-text);
  opacity: 0.85;
}

.screen-sync .sy-field { display: flex; flex-direction: column; gap: 6px; }

.screen-sync .sy-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--sync-text);
}

.screen-sync .sy-label em {
  font-style: normal;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  font-size: 11px;
  color: var(--text-faint);
}

.screen-sync .sy-form-ta {
  width: 100%;
  min-height: 62px;
  resize: none;
  padding: 9px 11px;
  border-radius: var(--r);
  border: 1px solid var(--sync-border);
  background: var(--bg-elev);
  color: var(--text);
  font-size: 13.5px;
  line-height: 1.62;
}

.screen-sync .sy-form-ta:focus {
  outline: none;
  border-color: var(--sync);
  box-shadow: 0 0 0 3px var(--sync-bg);
}

.screen-sync .sy-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.screen-sync .sy-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 11px 3px 7px;
  border-radius: 99px;
  border: 1px solid var(--border-strong);
  background: var(--bg-elev);
  color: var(--text-faint);
  font-size: 12px;
  cursor: pointer;
  user-select: none;
  transition: background 0.13s, border-color 0.13s, color 0.13s;
}

.screen-sync .sy-chip:hover { border-color: var(--sync); color: var(--sync-text); }

.screen-sync .sy-chip-on {
  background: var(--sync-bg);
  border-color: var(--sync);
  color: var(--sync-text);
  font-weight: 550;
}

.screen-sync .sy-chip-box {
  width: 13px;
  height: 13px;
  flex: none;
  border-radius: 3px;
  border: 1px solid var(--border-strong);
  display: grid;
  place-items: center;
  color: transparent;
}

.screen-sync .sy-chip-on .sy-chip-box {
  background: var(--sync-solid);
  border-color: var(--sync-solid);
  color: #fff;
}

.screen-sync .sy-form-foot {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 1px;
  padding-top: 11px;
  border-top: 1px solid var(--sync-border);
}

.screen-sync .sy-form-note {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--sync-text);
  opacity: 0.9;
  max-width: 520px;
}

.screen-sync .sy-form-note b { font-weight: 600; }

.screen-sync .sy-form-foot .btn { flex: none; }

/* ---------- 窄屏 ---------- */

@media (max-width: 900px) {
  .screen-sync .sy-panel { height: 92vh; }
  .screen-sync .sy-body { display: block; overflow-y: auto; }
  .screen-sync .sy-talk { overflow: visible; }
  .screen-sync .sy-side {
    overflow: visible;
    border-left: 0;
    border-top: 1px solid var(--border);
  }
  .screen-sync .sy-meter { display: none; }
  .screen-sync .sy-msg { max-width: 100%; }
}


/* ===== screen: loom ===== */
/* ===== S7 · Loom ===== */

.screen-loom .lm-ic { flex: none; }

/* ---------- 顶部 ---------- */
.screen-loom .lm-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 0 2px 12px;
}
.screen-loom .lm-bar-l,
.screen-loom .lm-bar-r { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.screen-loom .lm-bar-r { margin-left: auto; }
.screen-loom .lm-loom {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13.5px; font-weight: 600; color: var(--text);
}
.screen-loom .lm-loom .lm-ic { color: var(--accent); }
.screen-loom .badge .lm-ic { width: 12px; height: 12px; }

.screen-loom .lm-tabs {
  display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
}
.screen-loom .lm-tab {
  display: flex; flex-direction: column; gap: 1px;
  padding: 7px 14px; text-align: left;
  border: 1px solid var(--border); background: var(--bg-elev);
  border-radius: var(--r); cursor: pointer;
}
.screen-loom .lm-tab b { font-size: 13px; font-weight: 600; }
.screen-loom .lm-tab span { font-size: 11.5px; color: var(--text-faint); }
.screen-loom .lm-tab:hover { border-color: var(--border-strong); background: var(--bg-hover); }
.screen-loom .lm-tab.is-on {
  border-color: var(--accent); background: var(--accent-bg);
}
.screen-loom .lm-tab.is-on b { color: var(--accent-text); }
.screen-loom .lm-tab.is-on span { color: var(--accent-text); opacity: .8; }

/* ---------- 画布 ---------- */
.screen-loom .lm-graph .panel-head { flex-wrap: wrap; gap: 8px; }
.screen-loom .lm-canvas { padding: 6px 10px 12px; background: var(--bg-elev); }
.screen-loom .lm-canvas svg { display: block; width: 100%; height: auto; }

/* 边 */
.screen-loom .lm-edge { fill: none; stroke-width: 1.5; }
.screen-loom .lm-edge.is-planned { stroke: var(--border-strong); }
.screen-loom .lm-edge.is-walked { stroke: var(--text-faint); }
.screen-loom .lm-edge.is-cold { stroke: var(--border); stroke-dasharray: 4 4; }
.screen-loom .lm-edge.is-back { stroke: var(--accent); stroke-width: 1.6; }
.screen-loom .lm-edge.is-added {
  stroke: var(--accent); stroke-dasharray: 3 4; stroke-width: 1.4; opacity: .75;
}
.screen-loom .lm-mk.is-dim { fill: var(--border-strong); }
.screen-loom .lm-mk.is-strong { fill: var(--text-faint); }
.screen-loom .lm-mk.is-accent { fill: var(--accent); }

.screen-loom .lm-elabel {
  font-size: 10px; fill: var(--text-faint);
  font-family: var(--font-mono);
}
.screen-loom .lm-elabel.is-back { fill: var(--accent); }

/* 节点 */
.screen-loom .lm-node { cursor: pointer; }
.screen-loom .lm-n-box {
  fill: var(--bg-elev); stroke: var(--border-strong); stroke-width: 1.3;
}
.screen-loom .lm-node:hover .lm-n-box { stroke: var(--text-faint); }
.screen-loom .lm-n-bar { fill: var(--border-strong); }
.screen-loom .lm-n-dot { fill: var(--text-faint); }
.screen-loom .lm-n-label {
  font-size: 12.5px; font-weight: 600; fill: var(--text);
  font-family: var(--font-sans);
}
.screen-loom .lm-n-type {
  font-size: 9.5px; fill: var(--text-faint); font-family: var(--font-mono);
}
.screen-loom .lm-n-badge {
  font-size: 11px; font-weight: 700; fill: var(--accent);
  font-family: var(--font-mono);
}
.screen-loom .lm-n-chip { font-size: 10px; font-family: var(--font-mono); fill: var(--text-faint); }
.screen-loom .lm-n-chip.is-more { fill: var(--accent); }
.screen-loom .lm-n-chip.is-sync { fill: var(--sync); }
.screen-loom .lm-n-chip.is-added { fill: var(--accent); }
.screen-loom .lm-n-chip.is-bad { fill: var(--danger); }
.screen-loom .lm-n-chip.is-dim { fill: var(--text-faint); }

/* 节点状态 */
.screen-loom .lm-node.is-planned .lm-n-box { fill: var(--bg-sunken); }
.screen-loom .lm-node.is-done .lm-n-dot { fill: var(--support); }
.screen-loom .lm-node.is-blocked .lm-n-box { stroke: var(--danger); fill: var(--danger-bg); }
.screen-loom .lm-node.is-blocked .lm-n-dot { fill: var(--danger); }
.screen-loom .lm-node.is-pending .lm-n-box {
  stroke: var(--border); stroke-dasharray: 4 4; fill: transparent;
}
.screen-loom .lm-node.is-pending .lm-n-label { fill: var(--text-faint); }
.screen-loom .lm-node.is-pending .lm-n-dot { fill: var(--border-strong); }
.screen-loom .lm-node.is-escalated .lm-n-box {
  stroke: var(--sync-solid); stroke-width: 1.8; fill: var(--sync-bg);
}
.screen-loom .lm-node.is-escalated .lm-n-dot { fill: var(--sync-solid); }
.screen-loom .lm-node.is-escalated .lm-n-bar { fill: var(--sync-solid); }
.screen-loom .lm-node.is-added .lm-n-box {
  stroke: var(--accent); stroke-dasharray: 5 3; fill: var(--accent-bg);
}
.screen-loom .lm-node.is-added .lm-n-dot { fill: var(--accent); }
.screen-loom .lm-node.is-gate .lm-n-bar { fill: var(--accent); }
.screen-loom .lm-node.is-sel .lm-n-box {
  stroke: var(--accent); stroke-width: 2.2;
}

.screen-loom .lm-legend { display: flex; gap: 12px; flex-wrap: wrap; }
.screen-loom .lm-lg {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--text-dim);
}
.screen-loom .lm-lg i {
  width: 9px; height: 9px; border-radius: 2px; flex: none;
  border: 1.3px solid var(--border-strong); background: var(--bg-elev);
}
.screen-loom .lm-lg.is-done i { border-color: var(--support); background: var(--support-bg); }
.screen-loom .lm-lg.is-blocked i { border-color: var(--danger); background: var(--danger-bg); }
.screen-loom .lm-lg.is-pending i { border-style: dashed; background: transparent; }
.screen-loom .lm-lg.is-escalated i { border-color: var(--sync-solid); background: var(--sync-bg); }
.screen-loom .lm-lg.is-added i { border-color: var(--accent); border-style: dashed; background: var(--accent-bg); }
.screen-loom .lm-lg.is-gate i { border-left-width: 4px; border-left-color: var(--accent); }

.screen-loom .lm-hint {
  padding: 0 4px; font-size: 12px; color: var(--text-faint);
}

/* ---------- 侧栏 ---------- */
.screen-loom .lm-dvs { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; }
.screen-loom .lm-dv {
  display: grid; grid-template-columns: 1fr auto; gap: 1px 10px;
  padding: 6px 6px; border-radius: var(--r-sm);
}
.screen-loom .lm-dv:hover { background: var(--bg-hover); }
.screen-loom .lm-dv > span { font-size: 12.5px; color: var(--text-dim); }
.screen-loom .lm-dv > b {
  font-size: 13px; font-weight: 650; font-family: var(--font-mono);
  text-align: right; color: var(--text);
}
.screen-loom .lm-dv > i {
  grid-column: 1 / -1; font-style: normal; font-size: 11.5px; margin-top: -1px;
}
.screen-loom .lm-dv.is-more > b { color: var(--accent); }
.screen-loom .lm-dv.is-sync > b { color: var(--sync-text); }
.screen-loom .lm-dv.is-added > b { color: var(--accent); }
.screen-loom .lm-dv.is-dim > b { color: var(--text-faint); }

.screen-loom .lm-dv-foot {
  padding: 9px 14px; border-top: 1px solid var(--border);
  background: var(--bg-sunken); font-size: 11.5px; color: var(--text-faint);
}

.screen-loom .lm-rss { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
.screen-loom .lm-rs {
  padding: 10px 11px; border-radius: var(--r);
  border: 1px solid var(--sync-border); background: var(--sync-bg);
  cursor: pointer;
}
.screen-loom .lm-rs:hover { border-color: var(--sync-solid); }
.screen-loom .lm-rs.is-on { box-shadow: 0 0 0 2px var(--sync-solid); }
.screen-loom .lm-rs-top { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.screen-loom .lm-rs-sum {
  margin: 7px 0 5px; font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.5;
}
.screen-loom .lm-rs-cause { font-size: 11.5px; color: var(--sync-text); margin-bottom: 7px; }
.screen-loom .lm-rs-mut {
  display: flex; flex-direction: column; gap: 3px;
  padding: 7px 8px; border-radius: var(--r-sm);
  background: var(--bg-elev); border: 1px solid var(--border);
}
.screen-loom .lm-rs-mut > div { display: flex; gap: 8px; align-items: baseline; }
.screen-loom .lm-rs-mut code {
  font-family: var(--font-mono); font-size: 11px; color: var(--accent-text);
  flex: none; min-width: 74px;
}
.screen-loom .lm-rs-mut span { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.screen-loom .lm-rs-hash { margin-top: 7px; font-size: 11px; color: var(--text-faint); }

.screen-loom .lm-kvs { display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; }
.screen-loom .lm-kv {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 5px 6px; border-radius: var(--r-sm);

/* ---------- sparkline ---------- */
function posts_spark(trend) {
  if (!trend || trend.length < 2) return "";
  const w = 46,
    h = 16,
    pad = 2.4;
  const min = Math.min.apply(null, trend);
  const max = Math.max.apply(null, trend);
  const span = max - min || 1;
  const xy = trend.map(function (v, i) {
    const x = pad + ((w - pad * 2) * i) / (trend.length - 1);
    const y = h - pad - ((h - pad * 2) * (v - min)) / span;
    return [x, y];
  });
  const pts = xy
    .map(function (p) {
      return p[0].toFixed(1) + "," + p[1].toFixed(1);
    })
    .join(" ");
  const last = xy[xy.length - 1];
  return (
    '<svg class="spark" width="' +
    w +
    '" height="' +
    h +
    '" viewBox="0 0 ' +
    w +
    " " +
    h +
    '" fill="none" stroke="currentColor" stroke-width="1.5" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<polyline points="' +
    pts +
    '"/>' +
    '<circle cx="' +
    last[0].toFixed(1) +
    '" cy="' +
    last[1].toFixed(1) +
    '" r="1.7" fill="currentColor" stroke="none"/>' +
    "</svg>"
  );
}

  const delta =

      (delta !== null

          (rising ? " is-up" : "") +

          (rising ? "↑" : "↓") +

function context_ic(name) {
  return (
    '<svg class="ico" viewBox="0 0 16 16" width="16" height="16" fill="none" ' +
    'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
    (context_PATHS[name] || "") +
    "</svg>"
  );
}

/* ---------- 派生 ---------- */

function context_statusOf(c) {
  return STATE.context.actions[c.id] || c.status;
}

function context_sectionOf(c) {
  const m = STATE.context.moved;
  return Object.prototype.hasOwnProperty.call(m, c.id) ? m[c.id] : c.section;
}

function context_sectionTitle(id) {
  const t = DATA.post.toc.find((s) => s.id === id);
  return t ? "第 " + t.n + " 节 · " + t.title : "未归类";
}

function context_usedBy(c) {
  if (c.usedBy && c.usedBy.length) return c.usedBy;
  return DATA.post.blocks
    .filter((b) => (b.provenance || []).indexOf(c.id) > -1)
    .map((b) => b.id);
}

function context_dirtyIds() {
  const s = new Set(Object.keys(STATE.context.actions));
  Object.keys(STATE.context.moved).forEach((k) => s.add(k));
  return s;
}

function context_visible() {
  const st = STATE.context;
  return DATA.post.contexts.filter((c) => {
    if (st.stance !== "all" && c.stance !== st.stance) return false;
    if (st.status !== "all" && context_statusOf(c) !== st.status) return false;
    if (st.section === "none" && context_sectionOf(c) !== null) return false;
    if (st.section && st.section !== "none" && context_sectionOf(c) !== st.section)
      return false;
    return true;
  });
}

/* ---------- 交互 ---------- */

ACTIONS.context_setStance = (arg) => {
  STATE.context.stance = arg;
};

ACTIONS.context_setStatusFilter = (arg) => {
  STATE.context.status = arg;
};

ACTIONS.context_pickSection = (arg) => {
  STATE.context.section = STATE.context.section === arg ? null : arg;
};

ACTIONS.context_clearFilters = () => {
  STATE.context.stance = "all";
  STATE.context.status = "all";
  STATE.context.section = null;
};

ACTIONS.context_setStatus = (arg) => {
  const i = arg.indexOf(":");
  const id = arg.slice(0, i);
  const next = arg.slice(i + 1);
  const item = DATA.post.contexts.find((c) => c.id === id);
  if (!item) return;
  const cur = context_statusOf(item);
  if (cur === next || next === item.status) {
    delete STATE.context.actions[id];
  } else {
    STATE.context.actions[id] = next;
  }
  if (context_statusOf(item) === "disputed") STATE.context.expanded[id] = true;
  STATE.context.reassign = null;
};

ACTIONS.context_toggleExpand = (arg) => {
  STATE.context.expanded[arg] = !STATE.context.expanded[arg];
};

ACTIONS.context_toggleReassign = (arg) => {
  STATE.context.reassign = STATE.context.reassign === arg ? null : arg;
};

ACTIONS.context_moveTo = (arg) => {
  const i = arg.indexOf(":");
  const id = arg.slice(0, i);
  const target = arg.slice(i + 1);
  const item = DATA.post.contexts.find((c) => c.id === id);
  if (!item) return;
  const next = target === "none" ? null : target;
  if (next === item.section) delete STATE.context.moved[id];
  else STATE.context.moved[id] = next;
  STATE.context.reassign = null;
};

ACTIONS.context_escalate = (arg) => {
  openSync(arg);
};

ACTIONS.context_gotoDraft = () => {
  go("draft");
};

ACTIONS.context_submit = () => {
  STATE.context.actions = {};
  STATE.context.moved = {};
  STATE.context.reassign = null;
};

/* ---------- 片段 ---------- */

function context_coverageRow(sec) {
  const st = STATE.context;
  const max = Math.max.apply(
    null,
    DATA.post.toc.map((s) => s.support + s.refute + s.background)
  );
  const total = sec.support + sec.refute + sec.background;
  const width = Math.max(10, Math.round((total / (max || 1)) * 100));
  const active = st.section === sec.id;
  return `
    <div class="cov-row${sec.thin ? " is-thin" : ""}${active ? " is-active" : ""}"
         data-act="context_pickSection" data-arg="${esc(sec.id)}"
         title="只看第 ${sec.n} 节的材料">
      <span class="cov-n mono">${sec.n}</span>
      <span class="cov-title">${esc(sec.title)}</span>
      <span class="cov-track">
        <span class="bar" style="width:${width}%">
          <span style="flex:${sec.support};background:var(--support)"></span>
          <span style="flex:${sec.refute};background:var(--refute)"></span>
          <span style="flex:${sec.background};background:var(--border-strong)"></span>
        </span>
      </span>
      <span class="cov-nums mono">
        <span class="n-support${sec.support ? "" : " n-off"}">${sec.support}</span>
        <span class="n-refute${sec.refute ? "" : " n-off"}">${sec.refute}</span>
        <span class="n-bg${sec.background ? "" : " n-off"}">${sec.background}</span>
      </span>
      <span class="cov-end">
        ${
          sec.thin
            ? `<span class="badge badge-danger badge-square">材料不足</span>
               <button class="btn btn-sync-soft btn-sm"
                       data-act="context_escalate"
                       data-arg="覆盖度报告 · 第 ${sec.n} 节材料不足">${context_ic(
                "up"
              )}升级同步</button>`
            : `<span class="faint" style="font-size:11.5px">ok</span>`
        }
      </span>
    </div>`;
}

function context_coverage() {
  const p = DATA.post;
  const s = p.contextStats;
  return `
  <section class="panel">
    <div class="panel-head">
      <div class="row">
        <h2 class="panel-title">覆盖度报告</h2>
        <span class="badge badge-accent">闸门 A</span>
        <span class="meta faint">research agent · 昨天 18:02 · 扫描 61 个来源</span>
      </div>
      <div class="cov-legend">
        <span><i class="lg-support"></i>support</span>
        <span><i class="lg-refute"></i>refute</span>
        <span><i class="lg-bg"></i>background</span>
      </div>
    </div>
    <div class="cov-body">
      <div class="cov-main">
        ${p.toc.map(context_coverageRow).join("")}
        <div class="cov-foot">
          ${context_ic("alert")}
          <span>第 4 节只有 2 条材料 —— 要么补研究，要么这节本来就不该独立存在。TOC 在这一步允许被改。</span>
        </div>
      </div>
      <aside class="cov-side">
        <div class="seed">
          <div class="seed-head">${context_ic("seed")}未归类材料</div>
          <div class="seed-n">${p.unassignedContext} 条</div>
          <div class="seed-body">不属于任何一节 → 可能是新章节的种子</div>
          <button class="btn btn-sm" data-act="context_pickSection" data-arg="none">
            ${context_ic("filter")}只看这些
          </button>
        </div>
        <div class="cov-stats">
          <div class="cov-stat"><b>${s.total}</b><span>入库</span></div>
          <div class="cov-stat s-approved"><b>${s.approved}</b><span>approved</span></div>
          <div class="cov-stat s-rejected"><b>${s.rejected}</b><span>rejected</span></div>
          <div class="cov-stat s-disputed"><b>${s.disputed}</b><span>disputed</span></div>
        </div>
      </aside>
    </div>
  </section>`;
}

function context_filters(shown) {
  const st = STATE.context;
  const total = DATA.post.contextStats.total;
  const dirty = st.stance !== "all" || st.status !== "all" || st.section;
  const chip = (act, cur, o) =>
    `<button class="chip${cur === o.key ? " on " + o.cls : ""}" data-act="${act}" data-arg="${esc(
      o.key
    )}">${esc(o.label)}</button>`;
  return `
  <div class="filters">
    <div class="fgroup">
      <span class="flabel">stance</span>
      ${context_STANCE_FILTERS.map((o) =>
        chip("context_setStance", st.stance, o)
      ).join("")}
    </div>
    <span class="fdiv"></span>
    <div class="fgroup">
      <span class="flabel">status</span>
      ${context_STATUS_FILTERS.map((o) =>
        chip("context_setStatusFilter", st.status, o)
      ).join("")}
    </div>
    ${
      st.section
        ? `<span class="fdiv"></span>
           <button class="fpill" data-act="context_pickSection" data-arg="${esc(st.section)}">
             ${esc(
               st.section === "none" ? "未归类材料" : context_sectionTitle(st.section)
             )} ${context_ic("x")}
           </button>`
        : ""
    }
    <span class="spacer"></span>
    ${
      dirty
        ? `<button class="btn btn-ghost btn-sm" data-act="context_clearFilters">${context_ic(
            "reset"
          )}重置</button>`
        : ""
    }
    <span class="fcount">显示 <b>${shown}</b> / ${total}</span>
  </div>`;
}

function context_disputePanel(c) {
  const blocks = context_usedBy(c);
  const note =
    c.disputeNote ||
    "本轮标记为 disputed：出处或数据需要复核，暂不进入生成阶段。";
  return `
    <div class="dispute">
      <div class="dispute-head">${context_ic("alert")}Disputed · 需要裁决</div>
      <div class="dispute-body">
        <div class="dispute-note"><em>争议点：</em>${esc(note)}</div>
        ${
          blocks.length
            ? `<div class="chain">
                 ${context_ic("chain")}
                 <span>${blocks
                   .map(
                     (b) =>
                       `<span class="bchip" data-act="context_gotoDraft">${esc(b)}</span>`
                   )
                   .join(" ")}</span>
                 <span>共 <b>${blocks.length}</b> 个段落引用了它</span>
                 <span class="chain-arrow">→</span>
                 <span><b>已进入待重审</b></span>
               </div>`
            : `<div class="chain">${context_ic(
                "chain"
              )}<span>当前没有段落引用它，disputed 不会造成连锁影响。</span></div>`
        }
        <div class="dispute-foot">
          ${context_ic("book")}
          <span>连锁规则：disputed 的材料被引用时，引用它的 block 会一并进入待重审。${
            c.id === "ctx_31c8"
              ? "rev 3 的确定性检查已标记 b3 —— 正文以确定语气复述了未核实的数字。"
              : ""
          }</span>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn btn-sm" data-act="context_gotoDraft">${context_ic(
            "layers"
          )}在 Draft 中查看引用</button>
          <button class="btn btn-sync-soft btn-sm" data-act="context_escalate"
                  data-arg="Context ${esc(c.id)} · disputed 裁决">${context_ic(
    "up"
  )}升级同步</button>
        </div>
      </div>
    </div>`;
}

function context_card(c) {
  const status = context_statusOf(c);
  const section = context_sectionOf(c);
  const dirty = context_dirtyIds().has(c.id);
  const moved = Object.prototype.hasOwnProperty.call(STATE.context.moved, c.id);
  const conf = Math.round(c.confidence * 100);
  const low = c.confidence < 0.6;
  const stanceCls =
    c.stance === "support"
      ? "badge-support"
      : c.stance === "refute"
      ? "badge-refute"
      : "";
  const statusCls =
    status === "approved"
      ? "badge-support"
      : status === "disputed"
      ? "badge-refute"
      : "";
  const statusIcon =
    status === "approved" ? "check" : status === "disputed" ? "alert" : "x";
  const expanded = !!STATE.context.expanded[c.id];
  const showDispute = status === "disputed" && expanded;

  const actBtn = (key, label) =>
    `<button class="btn btn-sm act${
      status === key ? " on-" + key : ""
    }" data-act="context_setStatus" data-arg="${esc(c.id)}:${key}">${label}</button>`;

  return `
  <article class="card ctx-card st-${status}${dirty ? " is-dirty" : ""}">
    <div class="ctx-top">
      <span class="badge ${stanceCls}">${esc(c.stance)}</span>
      <span class="mono faint ctx-id">${esc(c.id)}</span>
      <span class="spacer"></span>
      <span class="conf${low ? " is-low" : ""}" title="相关性判定置信度">
        confidence
        <span class="bar"><span style="width:${conf}%;background:var(--${
    low ? "danger" : "accent"
  })"></span></span>
        <b>${(c.confidence).toFixed(2)}</b>
      </span>
      ${
        dirty
          ? `<span class="badge badge-accent badge-square">未提交</span>`
          : ""
      }
      <span class="badge ${statusCls} badge-square">${context_ic(
    statusIcon
  )}${esc(context_STATUS_LABEL[status] || status)}</span>
    </div>

    <div class="card-fade">
      <p class="claim">${esc(c.claim)}</p>

      <div class="ev">
        <span class="ev-tag">原文摘录 · 不可改写</span>
        <blockquote class="quote">${esc(c.evidence)}</blockquote>
      </div>

      <div class="srcline">
        <span class="src">${context_ic("book")}<span class="src-title">${esc(
    c.source.title
  )}</span></span>
        <span class="loc">${esc(c.source.locator)}</span>
        <span class="tags">${c.tags
          .map((t) => `<span class="tag">${esc(t)}</span>`)
          .join("")}</span>
        <span class="spacer"></span>
        <span class="hint${section ? "" : " hint-none"}">
          ${context_ic("layers")}${esc(
    section ? context_sectionTitle(section) : "未归类 · 新章节的种子"
  )}${moved ? " <span class='badge badge-accent badge-square'>已改归属</span>" : ""}
        </span>
      </div>
    </div>

    ${showDispute ? context_disputePanel(c) : ""}

    <div class="acts">
      ${actBtn("approved", "Approve")}
      ${actBtn("rejected", "Reject")}
      ${actBtn("disputed", "Dispute")}
      <button class="btn btn-sm" data-act="context_toggleReassign" data-arg="${esc(
        c.id
      )}">${context_ic("move")}改归属</button>
      <span class="spacer"></span>
      ${
        status === "disputed"
          ? `<button class="btn btn-ghost btn-sm" data-act="context_toggleExpand" data-arg="${esc(
              c.id
            )}">${
              expanded
                ? "收起争议"
                : "展开争议 · " + context_usedBy(c).length + " 处引用"
            }</button>`
          : ""
      }
    </div>

    ${
      STATE.context.reassign === c.id
        ? `<div class="reassign">
             <span class="rlabel">改归属到</span>
             ${DATA.post.toc
               .map(
                 (s) =>
                   `<button class="btn btn-sm rbtn${
                     section === s.id ? " on" : ""
                   }" data-act="context_moveTo" data-arg="${esc(c.id)}:${esc(
                     s.id
                   )}">第 ${s.n} 节</button>`
               )
               .join("")}
             <button class="btn btn-sm rbtn${
               section === null ? " on" : ""
             }" data-act="context_moveTo" data-arg="${esc(
            c.id
          )}:none">未归类</button>
           </div>`
        : ""
    }
  </article>`;
}

function context_pendbar() {
  const acts = STATE.context.actions;
  const ids = Object.keys(acts);
  const movedN = Object.keys(STATE.context.moved).length;
  const pending = context_dirtyIds().size;
  const n = (k) => ids.filter((id) => acts[id] === k).length;
  const zero = pending === 0;
  return `
  <div class="pendbar">
    <div class="pend-n${zero ? " is-zero" : ""}">
      <b>${pending}</b><span>pending</span>
    </div>
    <div class="pend-break">
      ${
        zero
          ? `<span class="faint">本轮还没有待提交的判定 —— 逐条 approve / reject / dispute 后一次性提交</span>`
          : `<span class="k k-approved">${n("approved")}</span> approve
             <span class="faint">·</span>
             <span class="k k-rejected">${n("rejected")}</span> reject
             <span class="faint">·</span>
             <span class="k k-disputed">${n("disputed")}</span> dispute
             <span class="faint">·</span>
             <span class="k k-moved">${movedN}</span> 改归属`
      }
    </div>
    <span class="spacer"></span>
    <span class="badge badge-danger">第 4 节材料不足</span>
    <span class="pend-sub">提交后 research agent 将补充缺口材料</span>
    <button class="btn btn-primary btn-lg" data-act="context_submit"${
      zero ? " disabled" : ""
    }>${context_ic("send")}Submit review</button>
  </div>`;
}

/* ---------- 主渲染 ---------- */

function renderContext() {
  const list = context_visible();
  const loaded = DATA.post.contexts.length;
  const total = DATA.post.contextStats.total;
  return `
    ${context_coverage()}
    ${context_filters(list.length)}
    <div class="list">
      ${
        list.length
          ? list.map(context_card).join("")
          : `<div class="empty">没有材料匹配当前过滤条件<br><button class="btn btn-sm" style="margin-top:10px" data-act="context_clearFilters">清除过滤</button></div>`
      }
    </div>
    <div class="more">
      ${context_ic("book")}
      <span>已加载 ${loaded} / ${total} 条 —— 其余为上一轮已 approve 的材料</span>
      <button class="btn btn-ghost btn-sm">加载更多</button>
    </div>
    ${context_pendbar()}
  `;
}


/* ===== screen: draft ===== */
/* ============================================================
   Draft · Studio —— 一篇文章的主页面
   打开先看到本体。运行状态一律退到 Git mode 和 Loom 抽屉里。
   ============================================================ */

STATE.draft = STATE.draft || {
  sel: null,
  sec: null,
  composer: "",
};

/* ---------- icons ---------- */
const draft_IC = {
  source:
    '<path d="M2.6 4.2A1.6 1.6 0 0 1 4.2 2.6h3l1.2 1.4h3.4a1.6 1.6 0 0 1 1.6 1.6v5.8a1.6 1.6 0 0 1-1.6 1.6H4.2a1.6 1.6 0 0 1-1.6-1.6z"/>',
  comment:
    '<path d="M13.4 9.2a1.7 1.7 0 0 1-1.7 1.7H5.5L2.6 13.4V4.3a1.7 1.7 0 0 1 1.7-1.7h7.4a1.7 1.7 0 0 1 1.7 1.7z"/>',
  edit: '<path d="M11.2 2.9a1.5 1.5 0 0 1 2.1 2.1L5.6 12.7l-3 .8.8-3z"/>',
  warn: '<path d="M8 2.6 14 13H2z"/><path d="M8 6.4v3"/><path d="M8 11.2h.01"/>',
  send: '<path d="M13.6 2.6 7.2 9"/><path d="M13.6 2.6 9.6 13.4 7.2 9 2.6 6.6z"/>',
  lock: '<rect x="3.4" y="7" width="9.2" height="6.4" rx="1.5"/><path d="M5.6 7V5.2a2.4 2.4 0 0 1 4.8 0V7"/>',
};

function draft_icon(name, cls) {
  return (
    '<svg class="st-ic' + (cls ? " " + cls : "") + '" width="15" height="15" viewBox="0 0 16 16" ' +
    'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true">' + (draft_IC[name] || "") + "</svg>"
  );
}

/* ---------- 派生 ---------- */

/* 最小编辑单位是一个 block：点开它就看到这一个 block 的全部信息 —— */

/* 确定性检查在正文里的落点 */
const draft_FLAG_TEXT = {
  b10: "经验上这条线大约落在「一个周期内能否察觉」这个位置。",
  b3: "误操作率能下降九成以上。",
};

function draft_ctx(id) {
  return DATA.post.contexts.find((c) => c.id === id) || null;
}

function draft_reviewsOf(id) {
  return DATA.post.reviews.filter((r) => r.block === id && r.state === "open");
}

/* 把标记片段包成下划线 span */
function draft_text(block) {
  const mark = draft_FLAG_TEXT[block.id];
  if (!mark || block.text.indexOf(mark) < 0) return esc(block.text);
  const i = block.text.indexOf(mark);
  const cls = block.flagged === "disputed" ? "is-disputed" : "is-unsourced";
  const title =
    block.flagged === "disputed"
      ? "引用了 disputed 材料 —— 正文以确定语气复述了未核实的数字"
      : "此断言无 provenance · 确定性检查未通过";
  return (
    esc(block.text.slice(0, i)) +
    '<span class="st-flag ' + cls + '" title="' + esc(title) + '">' +
    esc(mark) + "</span>" +
    esc(block.text.slice(i + mark.length))
  );
}

/* ---------- TOC（朴素） ---------- */

function draft_toc() {
  const heads = DATA.post.blocks.filter((b) => b.type === "h2");
  return (
    '<aside class="st-toc"><div class="st-toc-lab">目录</div><nav>' +
    heads
      .map((b, i) => {
        const on = STATE.draft.sec === b.id;
        return (
          '<button class="st-toc-i ' + (on ? "is-on" : "") +
          '" data-act="draft_sec" data-arg="' + b.id + '">' +
          '<i>' + String(i + 1).padStart(2, "0") + "</i>" + esc(b.text) + "</button>"
        );
      })
      .join("") +
    "</nav></aside>"
  );
}

/* ---------- 展开面板：一个 block 的全部 ---------- */

/* 1. 最新一次 diff */
function draft_diff(block) {
  const d = block.diff;
  if (!d) {
    return (
      '<div class="st-nodiff">' + draft_icon("edit") +
      "本轮未修改 · 最后一次改动在 rev 1</div>"
    );
  }
  return (
    '<div class="st-diff">' +
    '<div class="st-diff-head"><span class="mono">rev ' + d.rev + "</span>" +
    "<span>" + esc(d.by) + " · " + esc(d.at) + "</span>" +
    '<span class="st-diff-why">' + esc(d.why) + "</span></div>" +
    '<div class="st-d is-del"><i>−</i><span>' + esc(d.del) + "</span></div>" +
    '<div class="st-d is-ins"><i>+</i><span>' + esc(block.text) + "</span></div>" +
    "</div>"
  );
}

/* 2. context 索引 —— diff 下面，一个一个小点 */
function draft_srcDots(block) {
  const ids = block.provenance || [];
  if (!ids.length) {
    return (
      '<div class="st-src"><div class="st-src-i is-none">' +
      '<i class="st-dot is-none"></i>' +
      "<b>无来源</b><span>标记 authored，或引用材料</span>" +
      '<button class="btn btn-sm">标记 authored</button></div></div>'
    );
  }
  return (
    '<div class="st-src">' +
    ids
      .map((id) => {
        const c = draft_ctx(id);
        if (!c) return "";
        const bad = c.status === "disputed";
        return (
          '<div class="st-src-i ' + (bad ? "is-bad" : "") +
          '" data-act="__go" data-arg="context" title="' + esc(c.source.title) + '">' +
          '<i class="st-dot is-' + esc(c.stance) + '"></i>' +
          "<b>" + esc(c.claim) + "</b>" +
          '<span class="mono">' + esc(c.id) + "</span>" +
          (bad ? '<em>disputed</em>' : "") +
          "</div>"
        );
      })
      .join("") +
    "</div>"
  );
}

function draft_panel(block) {
  const revs = draft_reviewsOf(block.id);
  return (
    '<div class="st-panel">' +
    '<div class="st-panel-head">' +
    '<span class="mono st-bid">' + esc(block.id) + "</span>" +
    (revs.length
      ? '<button class="st-rev" data-act="draft_toGit" data-arg="' + block.id + '">' +
        draft_icon("comment") + revs.length + " 条 review · 去 Git mode →</button>"
      : '<span class="st-noreview">无待处理 review</span>') +
    "</div>" +
    draft_diff(block) +
    draft_srcDots(block) +
    "</div>"
  );
}

/* ---------- block ---------- */

function draft_block(block) {
  const sel = STATE.draft.sel === block.id;
  const isH = block.type === "h2";

  const inner = isH
    ? "<h2>" + esc(block.text) + "</h2>"
    : "<p>" + draft_text(block) + "</p>";

  return (
    '<div class="st-block ' + (sel ? "is-sel" : "") + (isH ? " is-h" : "") + '">' +
    '<div class="st-body" data-act="draft_pick" data-arg="' + block.id + '">' + inner + "</div>" +
    (sel && !isH ? draft_panel(block) : "") +
    "</div>"
  );
}

/* ---------- composer ---------- */

function draft_composer() {
  return (
    '<div class="st-composer-wrap"><form class="st-composer">' +
    '<div class="st-composer-state">' + draft_icon("lock") +
    "你持笔中 · loop 已暂停" +
    (STATE.draft.sel
      ? '<em>已锁定 <span class="mono">' + esc(STATE.draft.sel) + "</span></em>"
      : '<em>未选中段落 —— 提问会针对全文</em>') +
    "</div>" +
    '<div class="st-composer-row">' +
    '<textarea placeholder="问一句，或让它改选中的这段…" rows="1"></textarea>' +
    '<button class="btn btn-primary" type="button">' + draft_icon("send") + "发送</button>" +
    "</div>" +
    "</form></div>"
  );
}

/* ---------- actions ---------- */

/* 展开的面板可能落在底部 composer 后面 —— 重绘之后滚进可视区。 */
function draft_reveal() {
  if (typeof requestAnimationFrame !== "function") return;
  requestAnimationFrame(() => {
    const el = document.querySelector(".screen-draft .st-block.is-sel");
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" });
  });
}

ACTIONS.draft_pick = (arg) => {
  const open = STATE.draft.sel !== arg;
  STATE.draft.sel = open ? arg : null;
  if (open) draft_reveal();
};

ACTIONS.draft_sec = (arg) => {
  STATE.draft.sec = STATE.draft.sec === arg ? null : arg;
  STATE.draft.sel = arg;
};

ACTIONS.draft_toGit = () => {
  go("git");
};

/* ---------- 入口 ---------- */

function renderDraft() {
  const p = DATA.post;
  return (
    '<div class="st-wrap">' +
    draft_toc() +
    '<div class="st-main">' +
    '<article class="st-doc">' +
    "<h1>" + esc(p.title) + "</h1>" +
    p.blocks.map(draft_block).join("") +
    '<footer class="st-foot">正文按 block 存储，每段携带 provenance · ' +
    '<button class="st-link" data-act="__toggleGit">查看 ' +
    p.reviews.filter((r) => r.state === "open").length +
    " 条 review 与提交历史 →</button></footer>" +
    "</article>" +
    "</div>" +
    "</div>" +
    draft_composer()
  );
}

/* ---------- 派生 ---------- */

function review_state(r) {
  if (r.state === "resolved") return "resolved";
  return STATE.review.acts[r.id] || r.state || "open";
}

/* 排序依据当前状态，而不是初始状态 —— 否则撤销驳回后
   卡片显示成 open 却仍被排到底部。 */
function review_stateRank(r) {
  const s = review_state(r);
  if (s === "resolved") return 2;
  if (s === "dismissed") return 1;
  return 0;
}

const review_SEV_RANK = { high: 0, medium: 1, low: 2 };

function review_list() {
  return DATA.post.reviews
    .slice()
    .sort(
      (a, b) =>
        review_stateRank(a) - review_stateRank(b) ||
        (review_SEV_RANK[a.severity] ?? 3) - (review_SEV_RANK[b.severity] ?? 3)
    );
}

function review_counts() {
  const c = { all: 0, open: 0, accepted: 0, dismissed: 0, resolved: 0 };
  DATA.post.reviews.forEach((r) => {
    c.all++;
    c[review_state(r)]++;
  });
  if (STATE.review.myDraft) {
    c.all++;
    c.open++;
  }
  return c;
}

function review_pending() {
  const c = review_counts();
  return {
    accepted: c.accepted,
    dismissed: c.dismissed,
    added: STATE.review.myDraft ? 1 : 0,
    total: c.accepted + c.dismissed + (STATE.review.myDraft ? 1 : 0),
  };
}

  STATE.review.dismissError[id] = false;
  STATE.review.submitted = false;

/* ---------- 侧栏：迭代曲线 ---------- */

function review_curvePanel() {
  const revs = DATA.post.revisions.slice().sort((a, b) => a.rev - b.rev);
  if (!revs.length) return "";
  const W = 268;
  const padL = 26;
  const padR = 26;
  const top = 26;
  const bot = 76;
  const lo = 5.0;
  const hi = 7.8;
  const X = (i) => padL + (i * (W - padL - padR)) / (revs.length - 1 || 1);
  const Y = (v) => bot - ((v - lo) / (hi - lo)) * (bot - top);

  const pts = revs.map((r, i) => [X(i), Y(r.score)]);
  const line = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area =
    "M" +
    pts[0][0].toFixed(1) +
    "," +
    bot +
    " L" +
    line.split(" ").join(" L") +
    " L" +
    pts[pts.length - 1][0].toFixed(1) +
    "," +
    bot +
    " Z";

  const dots = revs
    .map((r, i) => {
      const best = r.best;
      return (
        '<g class="rv-pt' +
        (best ? " is-best" : "") +
        '">' +
        '<circle cx="' +
        pts[i][0].toFixed(1) +
        '" cy="' +
        pts[i][1].toFixed(1) +
        '" r="' +
        (best ? 4.5 : 3.2) +
        '"/>' +
        '<text class="rv-pt-val" x="' +
        pts[i][0].toFixed(1) +
        '" y="' +
        (pts[i][1] - 10).toFixed(1) +
        '">' +
        r.score.toFixed(1) +
        "</text>" +
        '<text class="rv-pt-x" x="' +
        pts[i][0].toFixed(1) +
        '" y="94">rev ' +
        r.rev +
        "</text>" +
        "</g>"
      );
    })
    .join("");

  return (
    '<section class="panel">' +
    '<div class="panel-head">' +
    '<h3 class="panel-title">迭代曲线</h3>' +
    '<span class="badge badge-square">第 ' +
    revs.length +
    " / 3 轮</span>" +
    "</div>" +
    '<div class="rv-curve">' +
    '<svg viewBox="0 0 ' +
    W +
    ' 100" width="100%" height="104" role="img" aria-label="eval 分数 5.4 → 6.4 → 7.2">' +
    '<line class="rv-axis" x1="10" y1="' +
    bot +
    '" x2="' +
    (W - 10) +
    '" y2="' +
    bot +
    '"/>' +
    '<path class="rv-area" d="' +
    area +
    '"/>' +
    '<polyline class="rv-line" points="' +
    line +
    '"/>' +
    dots +
    "</svg>" +
    "</div>" +
    '<ul class="rv-stop">' +
    '<li><span class="dot dot-support"></span>分数仍在提升（+1.0 → +0.8）· 继续迭代</li>' +
    '<li><span class="dot"></span>第 3 轮为上限 · 本轮是最后一轮</li>' +
    '<li><span class="dot dot-accent"></span>收工取历史最佳 rev，不一定是最后一轮</li>' +
    "</ul>" +
    "</section>"
  );
}

/* 可发布的 branch —— 从 posts 派生 */
function publish_branches() {
  return DATA.posts
    .filter((p) => p.branch && p.stageKey !== "published")
    .map((p) => {
      const main = p.current;
      const fails = main
        ? DATA.post.checks.filter((c) => c.state === "fail").length
        : 0;
      return {
        branch: p.branch,
        title: p.title,
        id: p.id,
        rev: main ? DATA.post.rev : null,
        score: p.score,
        stage: p.stage,
        ready: main ? fails === 0 : false,
        fails: main ? fails : null,
        reason: main
          ? fails
            ? "1 条断言无来源 · b10"
            : ""
          : "尚未进入迭代",
      };
    });
}

ACTIONS.publish_pick = (arg) => {
  STATE.publish.sel = arg;
};

ACTIONS.publish_goGit = () => go("git");

function publish_row(b) {
  const on = STATE.publish.sel === b.branch;
  return (

    (b.ready
      ? '<span class="badge badge-support badge-square">' + publish_icon("check") + "可发布</span>"

/* ---------- actions（shell 加载在本文件之后，所以延迟注册） ---------- */

function sync_install() {
  if (ACTIONS.sync_close) return;

  ACTIONS.sync_close = () => closeSync();

  ACTIONS.sync_toggleRef = (id) => {
    sync_ui.openRef = sync_ui.openRef === id ? null : id;
  };

  ACTIONS.sync_form = (v) => {
    sync_ui.form = v === "open";
  };

  ACTIONS.sync_chip = (arg) => {
    const [group, i] = String(arg).split(":");
    const bag = group === "scope" ? sync_ui.offScope : sync_ui.offNext;
    bag[i] = !bag[i];
  };

  /* 唯一的出口：记录 Decision → 回到异步 */
  ACTIONS.sync_commit = () => {
    sync_ui.form = false;
    closeSync();
    go("git");
  };
}

const loom_IC = {

function loom_icon(name, cls) {
  return (
    '<svg class="lm-ic' + (cls ? " " + cls : "") + '" width="16" height="16" viewBox="0 0 16 16" ' +
    'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" ' +

/* ---------- 派生 ---------- */

const loom_HW = 64;
const loom_HH = 24;

function loom_all() {
  const L = DATA.post.loom;
  const mode = STATE.loom.mode;
  // 预设图不含重构新增的节点
  return mode === "planned" ? L.nodes : L.nodes.concat(L.addedNodes || []);
}

function loom_find(id) {
  const L = DATA.post.loom;
  return (
    L.nodes.find((n) => n.id === id) ||
    (L.addedNodes || []).find((n) => n.id === id) ||
    null
  );
}

function loom_ex(id) {
  return DATA.post.loom.exec[id] || null;
}

/* 节点在当前模式下的视觉状态 */
function loom_stateOf(node) {
  if (STATE.loom.mode === "planned") return "planned";
  const ex = loom_ex(node.id);
  if (!ex) return "planned";
  if (ex.added) return "added";
  if (ex.resolution === "escalated") return "escalated";
  return ex.status; // done | blocked | pending
}

/* 该节点是否有未提交的产出 */
function loom_isPending(id) {
  if (STATE.loom.committed) return false;
  return (DATA.post.loom.pending || []).indexOf(id) >= 0;
}

function loom_instances(id) {
  return (DATA.post.loom.instances || {})[id] || [];
}

/* 会写 branch 的实例 = 一个 commit */
function loom_allCommits() {
  const inst = DATA.post.loom.instances || {};
  const out = [];
  Object.keys(inst).forEach((k) => {
    inst[k].forEach((i) => {
      if (i.commit) out.push({ node: k, i: i });
    });
  });
  return out.sort((a, b) => b.i.commit.rev - a.i.commit.rev);
}

/* diff 模式下节点底下那行偏离说明 */
function loom_devChip(node) {
  if (STATE.loom.mode !== "diff") return null;
  const ex = loom_ex(node.id);
  if (!ex) return null;
  if (ex.added) return { text: "重构新增", kind: "added" };
  if (ex.resolution === "escalated") return { text: "升级同步", kind: "sync" };
  if (ex.resolution === "approved") return { text: "直接通过", kind: "dim" };
  if (ex.status === "pending") return { text: "未到达", kind: "dim" };
  if (ex.status === "blocked") return { text: "阻断", kind: "bad" };
  if (ex.instances > 1) return { text: "预设 1 · 实际 " + ex.instances, kind: "more" };
  return null;
}

/* ---------- 边 ---------- */

function loom_edgePath(a, b, e) {
  if (e && e.back) {
    const x = Math.max(a.x, b.x) + loom_HW + 40;
    return (
      "M " + (a.x + loom_HW) + " " + a.y +
      " C " + x + " " + a.y + ", " + x + " " + b.y + ", " + (b.x + loom_HW) + " " + b.y
    );
  }
  if (a.y === b.y) {
    return a.x < b.x
      ? "M " + (a.x + loom_HW) + " " + a.y + " L " + (b.x - loom_HW) + " " + b.y
      : "M " + (a.x - loom_HW) + " " + a.y + " L " + (b.x + loom_HW) + " " + b.y;
  }
  if (a.x === b.x) {
    return a.y < b.y
      ? "M " + a.x + " " + (a.y + loom_HH) + " L " + b.x + " " + (b.y - loom_HH)
      : "M " + a.x + " " + (a.y - loom_HH) + " L " + b.x + " " + (b.y + loom_HH);
  }
  return "M " + a.x + " " + a.y + " L " + b.x + " " + b.y;
}

const loom_EDGE_LABEL = {
  "n6>n7": "iterate",
  "n7>n6": "回边 · 分数提升 且 round<3",
  "n6>n8": "停止条件",
  "n8>n9": "checks 全绿",
};

/* 边是否已经被走过 */
function loom_edgeWalked(e) {
  const a = loom_ex(e.from);
  const b = loom_ex(e.to);
  if (!a || !b) return false;
  if (a.status === "pending") return false;
  return b.status !== "pending" || (b.instances || 0) > 0;
}

function loom_renderEdges() {
  const L = DATA.post.loom;
  const planned = STATE.loom.mode === "planned";
  return L.edges
    .map((e) => {
      const a = loom_find(e.from);
      const b = loom_find(e.to);
      if (!a || !b) return "";
      const walked = !planned && loom_edgeWalked(e);
      const cls =
        "lm-edge" +
        (e.back ? " is-back" : "") +
        (planned ? " is-planned" : walked ? " is-walked" : " is-cold");
      const marker = e.back
        ? "url(#lm-arrow-accent)"
        : walked
          ? "url(#lm-arrow-strong)"
          : "url(#lm-arrow-dim)";
      const key = e.from + ">" + e.to;
      const label = loom_EDGE_LABEL[key];
      let text = "";
      if (label) {
        if (e.back) {
          const lx = Math.max(a.x, b.x) + loom_HW + 52;
          const ly = (a.y + b.y) / 2;
          text =
            '<text class="lm-elabel is-back" x="' + lx + '" y="' + ly +
            '" transform="rotate(-90 ' + lx + " " + ly + ')">' + esc(label) + "</text>";
        } else if (a.y === b.y) {
          text =
            '<text class="lm-elabel" text-anchor="middle" x="' + (a.x + b.x) / 2 +
            '" y="' + (a.y - 12) + '">' + esc(label) + "</text>";
        } else {
          text =
            '<text class="lm-elabel" text-anchor="end" x="' + (a.x - 10) +
            '" y="' + ((a.y + b.y) / 2 + 4) + '">' + esc(label) + "</text>";
        }
      }
      return (
        '<path class="' + cls + '" d="' + loom_edgePath(a, b, e) +
        '" marker-end="' + marker + '"/>' + text
      );
    })
    .join("");
}

/* 重构新增节点与其兄弟节点之间的虚线 */
function loom_renderAddedLink() {
  if (STATE.loom.mode === "planned") return "";
  const L = DATA.post.loom;
  return (L.addedNodes || [])
    .map((n) => {
      const sib = loom_find("n7");
      if (!sib) return "";
      return (
        '<path class="lm-edge is-added" d="M ' + (sib.x - loom_HW) + " " + sib.y +
        " L " + (n.x + loom_HW) + " " + n.y + '"/>'
      );
    })
    .join("");
}

/* ---------- 节点 ---------- */

function loom_renderNode(node) {
  const st = loom_stateOf(node);
  const ex = loom_ex(node.id);
  const sel = STATE.loom.sel === node.id;
  const chip = loom_devChip(node);
  const isGate = node.type === "gate";
  const running = STATE.loom.mode !== "planned" && ex && ex.running;
  const pend = STATE.loom.mode !== "planned" && loom_isPending(node.id);

  let badge = "";
  if (STATE.loom.mode !== "planned" && ex && ex.instances > 1) {
    badge =
      '<text class="lm-n-badge" text-anchor="end" x="54" y="4">×' + ex.instances + "</text>";
  }

  let chipEl = "";
  if (chip) {
    chipEl =
      '<text class="lm-n-chip is-' + chip.kind + '" text-anchor="middle" x="0" y="40">' +
      esc(chip.text) + "</text>";
  }

  return (
    '<g class="lm-node is-' + st + (sel ? " is-sel" : "") + (isGate ? " is-gate" : "") +
    (running ? " is-running" : "") + (pend ? " is-pend" : "") +
    '" data-act="loom_pick" data-arg="' + node.id +
    '" transform="translate(' + node.x + "," + node.y + ')">' +
    (running ? '<rect class="lm-n-halo" x="-68" y="-28" width="136" height="56" rx="12"/>' : "") +
    '<rect class="lm-n-box" x="-64" y="-24" width="128" height="48" rx="9"/>' +
    (pend ? '<circle class="lm-n-pend" cx="58" cy="-18" r="4.5"/>' : "") +
    (isGate ? '<rect class="lm-n-bar" x="-64" y="-24" width="4" height="48"/>' : "") +
    '<circle class="lm-n-dot" cx="-48" cy="0" r="3.4"/>' +
    '<text class="lm-n-label" x="-38" y="-3">' + esc(node.label) + "</text>" +
    '<text class="lm-n-type" x="-38" y="12">' + esc(node.id + " · " + node.type) + "</text>" +
    badge + chipEl +
    "</g>"
  );
}

/* ---------- 画布 ---------- */

function loom_canvas() {
  return (
    '<div class="lm-canvas">' +
    '<svg viewBox="0 0 800 400" role="img" aria-label="任务执行图">' +
    "<defs>" +
    '<marker id="lm-arrow-dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lm-mk is-dim" d="M0 0.6 L7.4 4 L0 7.4 z"/></marker>' +
    '<marker id="lm-arrow-strong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lm-mk is-strong" d="M0 0.6 L7.4 4 L0 7.4 z"/></marker>' +
    '<marker id="lm-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lm-mk is-accent" d="M0 0.6 L7.4 4 L0 7.4 z"/></marker>' +
    "</defs>" +
    loom_renderEdges() +
    loom_renderAddedLink() +
    loom_all().map(loom_renderNode).join("") +
    "</svg>" +
    "</div>"
  );
}

/* ---------- 顶部 ---------- */

function loom_toolbar() {
  const L = DATA.post.loom;
  const M = STATE.loom.mode;
  const tab = (k, label, hint) =>
    '<button class="lm-tab ' + (M === k ? "is-on" : "") + '" data-act="loom_mode" data-arg="' + k +
    '"><b>' + label + "</b><span>" + hint + "</span></button>";

  return (
    '<div class="lm-bar">' +
    '<div class="lm-bar-l">' +
    '<span class="lm-loom mono">' + loom_icon("branch") + esc(L.id) + "</span>" +
    '<span class="badge badge-square">' + loom_icon("hand") + esc(L.trigger) + "</span>" +
    '<span class="meta">run #' + L.run + " · 起于 " + esc(L.started) + "</span>" +
    "</div>" +
    '<div class="lm-bar-r">' +
    '<span class="badge badge-accent badge-square">round ' + L.round + " / " + L.roundLimit + "</span>" +
    '<span class="badge badge-square mono">graph ' + esc(L.graphHash) + "</span>" +
    "</div>" +
    "</div>" +
    '<div class="lm-tabs">' +
    tab("planned", "预设图", "loom 模板声明的结构") +
    tab("exec", "执行图", "实际跑出来的") +
    tab("diff", "对照", "偏离在哪、为什么") +
    "</div>"
  );
}

function loom_legend() {
  const items =
    STATE.loom.mode === "planned"
      ? [["planned", "预设节点"], ["gate", "闸门 · 阻塞人"]]
      : [
          ["done", "已完成"],
          ["blocked", "阻断"],
          ["pending", "未到达"],
          ["escalated", "gate 升级为同步"],
          ["added", "重构新增"],
        ];
  return (
    '<div class="lm-legend">' +
    items
      .map((i) => '<span class="lm-lg is-' + i[0] + '"><i></i>' + esc(i[1]) + "</span>")
      .join("") +
    "</div>"
  );
}

/* ---------- 侧栏 ---------- */

function loom_devPanel() {
  const d = DATA.post.loom.deviation;
  const row = (label, val, note, kind) =>
    '<div class="lm-dv ' + (kind ? "is-" + kind : "") + '"><span>' + esc(label) +
    '</span><b>' + esc(val) + "</b>" +
    (note ? '<i class="meta">' + esc(note) + "</i>" : "") + "</div>";

  return (
    '<section class="panel">' +
    '<div class="panel-head"><h2 class="panel-title">偏离度</h2>' +
    '<span class="meta">预设 vs 实际</span></div>' +
    '<div class="panel-body lm-dvs">' +
    row("节点数", d.plannedNodes + " → " + d.actualNodes, "重构新增 1", "more") +
    row("节点实例总数", String(d.instances), "9 个节点跑出 13 次") +
    row("回边经过", d.backEdge + " / " + d.backEdgeLimit, "已到上限，本轮为最后一轮", "more") +
    row("gate 升级", d.gatesEscalated + " / " + d.gatesTotal, "闸门 B 升级成 Talk", "sync") +
    row("图重构", d.restructured + " 次", "cause: decision", "added") +
    row("未到达节点", d.unreached.join(" ") || "—", "被 n8 阻断", "dim") +
    "</div>" +
    '<div class="lm-dv-foot">这一屏要回答的就是这张表 —— ' +
    "执行图凭什么偏离了预设图。</div>" +
    "</section>"
  );
}

function loom_rsPanel() {
  const list = DATA.post.loom.restructures;
  return (
    '<section class="panel">' +
    '<div class="panel-head"><h2 class="panel-title">重构记录</h2>' +
    '<span class="badge badge-square">' + list.length + "</span></div>" +
    '<div class="panel-body lm-rss">' +
    list
      .map((r) => {
        const on = STATE.loom.rs === r.id;
        return (
          '<article class="lm-rs ' + (on ? "is-on" : "") + '" data-act="loom_rs" data-arg="' +
          r.id + '">' +
          '<div class="lm-rs-top"><span class="badge badge-sync badge-square">' +
          esc(r.cause.kind) + "</span>" +
          '<span class="mono faint">' + esc(r.cause.id) + "</span>" +
          '<span class="spacer"></span><span class="meta">' + esc(r.at) + "</span></div>" +
          '<p class="lm-rs-sum">' + esc(r.summary) + "</p>" +
          '<div class="lm-rs-cause">cause · ' + esc(r.cause.label) +
          ' <span class="mono">' + esc(r.cause.from) + "</span></div>" +
          '<div class="lm-rs-mut">' +
          r.mutation
            .map(
              (m) =>
                '<div><code>' + esc(m.op) + "</code><span>" + esc(m.args) + "</span></div>",
            )
            .join("") +
          "</div>" +
          '<div class="lm-rs-hash mono">' + esc(r.before) + " → " + esc(r.after) + "</div>" +
          "</article>"
        );
      })
      .join("") +
    "</div>" +
    '<div class="lm-dv-foot">每次重构必须记录 cause —— ' +
    "否则事后无法解释执行图为什么偏离。</div>" +
    "</section>"
  );
}

/* ---------- 现在：哪些 agent 在跑 ---------- */

function loom_livePanel() {
  const live = DATA.post.loom.live || [];
  if (!live.length) return "";
  return (
    '<div class="lm-live">' +
    '<div class="lm-live-lab"><i class="dot dot-accent dot-pulse"></i>' +
    live.length + " 个 agent 在跑</div>" +
    live
      .map((l) => {
        const node = loom_find(l.node);
        return (
          '<button class="lm-live-i" data-act="loom_pick" data-arg="' + esc(l.node) + '">' +
          '<b>' + esc(l.agent) + "</b>" +
          '<span class="mono">' + esc(l.node) + " · " + esc(node ? node.label : "") + "</span>" +
          "<em>" + esc(l.task) + "</em>" +
          '<span class="lm-live-t mono">' + esc(l.since) + "</span>" +
          "</button>"
        );
      })
      .join("") +
    "</div>"
  );
}

/* ---------- 待提交：agent 的 staging 区 ---------- */

function loom_pendingPanel() {
  const ids = (DATA.post.loom.pending || []).filter((id) => loom_isPending(id));
  if (!ids.length) {
    return (
      '<section class="panel">' +
      '<div class="panel-head"><h2 class="panel-title">待提交</h2></div>' +
      '<div class="panel-body lm-empty">没有未提交的产出。' +
      "<br><br>会写 branch 的节点实例 = 一个 commit。</div></section>"
    );
  }
  return ids
    .map((id) => {
      const inst = loom_instances(id)[0];
      if (!inst || !inst.commit) return "";
      const c = inst.commit;
      return (
        '<section class="panel lm-pend-panel">' +
        '<div class="panel-head"><h2 class="panel-title">待提交</h2>' +
        '<span class="badge badge-accent badge-square mono">rev ' + c.rev + "</span></div>" +
        '<div class="panel-body">' +
        '<div class="lm-pend-top"><span class="mono">' + esc(id) + "</span>" +
        "<span>" + esc(inst.agent) + " · " + esc(inst.at) + "</span></div>" +
        '<p class="lm-pend-task">' + esc(inst.task) + "</p>" +
        '<div class="lm-pend-files">' +
        (c.files || []).map((f) => "<div>" + esc(f) + "</div>").join("") +
        "</div>" +
        '<div class="lm-pend-act">' +
        '<button class="btn btn-primary btn-sm" data-act="loom_commit">提交为 rev ' + c.rev + "</button>" +
        '<button class="btn btn-sm" data-act="loom_inst" data-arg="' + esc(id) + "#" + inst.n +
        '">先看 CoT</button>' +
        "</div>" +
        '<div class="lm-pend-foot">产出还没落到 branch 上 —— ' +
        "看过过程再决定。</div>" +
        "</div></section>"
      );
    })
    .join("");
}

/* ---------- 节点详情：实例列表 + CoT ---------- */

function loom_instCard(nodeId, inst) {
  const key = nodeId + "#" + inst.n;
  const open = STATE.loom.inst === key;
  const c = inst.commit;
  return (
    '<article class="lm-inst ' + (open ? "is-open" : "") + (inst.running ? " is-running" : "") + '">' +
    '<button class="lm-inst-top" data-act="loom_inst" data-arg="' + esc(key) + '">' +
    '<span class="mono lm-inst-n">#' + inst.n + "</span>" +
    "<b>" + esc(inst.agent) + "</b>" +
    '<span class="spacer"></span>' +
    (c
      ? '<span class="badge badge-square ' +
        (c.state === "pending" ? "badge-accent" : "") + ' mono">' +
        (c.state === "pending" ? "待提交 rev " + c.rev : "rev " + c.rev + " · " + c.sha) +
        "</span>"
      : "") +
    '<span class="meta">' + esc(inst.at) + "</span>" +
    "</button>" +
    (open
      ? '<div class="lm-inst-body">' +
        '<div class="lm-inst-lab">task</div><p class="lm-inst-task">' + esc(inst.task) + "</p>" +
        (inst.input && inst.input.length
          ? '<div class="lm-inst-lab">输入</div><div class="lm-chips">' +
            inst.input.map((i) => '<span class="lm-chip">' + esc(i) + "</span>").join("") +
            "</div>"
          : "") +
        (inst.cot && inst.cot.length
          ? '<div class="lm-inst-lab">chain of thought</div><ol class="lm-cot">' +
            inst.cot
              .map(
                (s) =>
                  "<li><b>" + esc(s.s) + "</b><span>" + esc(s.d) + "</span></li>",
              )
              .join("") +
            "</ol>"
          : inst.running
            ? '<div class="lm-inst-lab">chain of thought</div><div class="lm-cot-live">' +
              '<i class="dot dot-accent dot-pulse"></i>正在生成…</div>'
            : "") +
        (inst.out
          ? '<div class="lm-inst-lab">产出</div><div class="lm-out">' +
            '<span class="mono">' + esc(inst.out.ref) + "</span>" +
            "<span>" + esc(inst.out.note || "") + "</span></div>"
          : "") +
        (c && c.state === "pending"
          ? '<button class="btn btn-primary btn-sm lm-inst-commit" data-act="loom_commit">' +
            "提交为 rev " + c.rev + "</button>"
          : "") +
        "</div>"
      : "") +
    "</article>"
  );
}

function loom_selPanel() {
  const id = STATE.loom.sel;
  const node = id ? loom_find(id) : null;
  if (!node) {
    return (
      '<section class="panel"><div class="panel-head">' +
      '<h2 class="panel-title">节点详情</h2></div>' +
      '<div class="panel-body lm-empty">点击图上任意节点，查看它的执行实例、' +
      "每次实例的 task 与 chain of thought。" +
      "<br><br>节点类型是<b>封闭集合</b>，不开放自定义 —— " +
      "新增类型是改 workflow.md，不是用户配置。</div></section>"
    );
  }
  const ex = loom_ex(node.id);
  const list = loom_instances(node.id);

  return (
    '<section class="panel">' +
    '<div class="panel-head"><h2 class="panel-title">' + esc(node.label) + "</h2>" +
    '<span class="mono faint">' + esc(node.id) + " · " + esc(node.type) + "</span></div>" +
    (ex && ex.detail ? '<div class="lm-sel-detail">' + esc(ex.detail) + "</div>" : "") +
    (list.length
      ? '<div class="lm-insts">' +
        list.map((i) => loom_instCard(node.id, i)).join("") +
        "</div>"
      : '<div class="panel-body lm-empty">这个节点还没有执行实例。</div>') +
    (ex && ex.resolution === "escalated"
      ? '<div class="lm-sel-foot">' +
        '<button class="btn btn-sm btn-sync-soft" data-act="loom_openTalk">查看这次同步 Talk</button>' +
        "</div>"
      : "") +
    (node.id === "n7b"
      ? '<div class="lm-note">这个节点不在预设图里 —— 由 rs_1 重构产生。</div>'
      : "") +
    "</section>"
  );
}

/* ---------- actions ---------- */

ACTIONS.loom_mode = (arg) => {
  STATE.loom.mode = arg;
};

ACTIONS.loom_pick = (arg) => {
  STATE.loom.sel = STATE.loom.sel === arg ? null : arg;
};

ACTIONS.loom_rs = (arg) => {
  const r = DATA.post.loom.restructures.find((x) => x.id === arg);
  if (!r) return;
  const on = STATE.loom.rs === arg;
  STATE.loom.rs = on ? null : arg;
  STATE.loom.sel = on ? null : r.addedNodes[0];
  if (!on) STATE.loom.mode = "diff";
};

ACTIONS.loom_openTalk = () => {
  openSync("从 闸门 B 升级");
};

/* 点开某个实例的 task + CoT。同时把节点选中，图上跟着高亮。 */
ACTIONS.loom_inst = (arg) => {
  STATE.loom.inst = STATE.loom.inst === arg ? null : arg;
  const nodeId = String(arg).split("#")[0];
  STATE.loom.sel = nodeId;
  if (STATE.loom.mode === "planned") STATE.loom.mode = "exec";
};

/* 根据现有的过程去 commit —— 把 agent 的产出落到 branch 上 */
ACTIONS.loom_commit = () => {
  STATE.loom.committed = true;
};

/* ---------- 入口 ---------- */

function renderLoom() {
  return (
    loom_toolbar() +
    loom_livePanel() +
    '<div class="cols lm-cols">' +
    '<div class="stack">' +
    '<section class="panel lm-graph">' +
    '<div class="panel-head"><h2 class="panel-title">' +
    (STATE.loom.mode === "planned"
      ? "预设图 · researched-essay"
      : STATE.loom.mode === "exec"
        ? "执行图 · run #1"
        : "对照 · 预设 vs 实际") +
    "</h2>" + loom_legend() + "</div>" +
    loom_canvas() +
    "</section>" +
    '<div class="lm-hint">一个 task 一张图。图可调度、可执行、可重构 —— ' +
    "三者都是第一类对象，不是日志。</div>" +
    "</div>" +
    '<aside class="stack">' +
    loom_pendingPanel() +
    loom_selPanel() +
    loom_devPanel() +
    loom_rsPanel() +
    "</aside>" +
    "</div>"
  );
}


/* ============================================================
   App Shell —— 运行时：状态 / 路由 / 事件委托 / 渲染

   结构：
     顶层实体   Blog（列表）· Context（材料库）· Public（发布）
     进入一篇   Draft = 主页面（人机协同）
                点 branch 名 → Git mode（commit / review）
                右上 Loom 按钮 → 滑出侧栏
   ============================================================ */

/* STATE / ACTIONS / esc 定义在 runtime.js，排在所有屏文件之前。 */

function go(view) {
  STATE.view = view;
  window.scrollTo({ top: 0 });
  rerender();
}

function openSync(origin) {
  STATE.sync = origin || "同步 Talk";
  document.body.style.overflow = "hidden";
  rerender();
}

function closeSync() {
  STATE.sync = null;
  document.body.style.overflow = "";
  rerender();
}

function openLoom() {
  STATE.loomOpen = true;
  rerender();
}

function closeLoom() {
  STATE.loomOpen = false;
  rerender();
}

const VIEWS = {
  posts: { fn: () => renderPosts(), key: "posts", level: "top" },
  context: { fn: () => renderContext(), key: "context", level: "top" },
  public: { fn: () => renderPublish(), key: "publish", level: "top" },
  draft: { fn: () => renderDraft(), key: "draft", level: "post" },
  git: { fn: () => renderReview(), key: "review", level: "post" },
};

const ICON_MARK =
  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"/><circle cx="6" cy="18" r="2.6"/><circle cx="18" cy="6" r="2.6"/><path d="M18 8.6v3A5.4 5.4 0 0 1 12.6 17H8.6"/></svg>';
const ICON_BRANCH =
  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>';
const ICON_BACK =
  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const ICON_GRAPH =
  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="5" rx="1.4"/><rect x="15" y="16" width="6" height="5" rx="1.4"/><rect x="15" y="3" width="6" height="5" rx="1.4"/><path d="M9 5.5h6M18 8v8M6 8v7a3.5 3.5 0 0 0 3.5 3.5H15"/></svg>';

const TOP_ENTITIES = [
  { view: "posts", label: "Blog" },
  { view: "context", label: "Context" },
  { view: "public", label: "Public" },
];

function renderTopbar() {
  const v = VIEWS[STATE.view] || VIEWS.posts;
  const p = DATA.post;

  if (v.level === "top") {
    return `
      <header class="topbar">
        <div class="brand">${ICON_MARK}<span>Blog Studio</span></div>
        <nav class="ents">
          ${TOP_ENTITIES.map(
            (e) =>
              `<button class="ent ${STATE.view === e.view ? "is-on" : ""}" data-act="__go" data-arg="${e.view}">${e.label}</button>`,
          ).join("")}
        </nav>
        <div class="spacer"></div>
        <div class="avatar avatar-you">${esc(DATA.user.initials)}</div>
      </header>`;
  }

  // 一篇文章内：左上只有标题和分支名
  const inGit = STATE.view === "git";
  return `
    <header class="topbar">
      <button class="tb-back" data-act="__go" data-arg="posts" title="回到 Blog 列表">${ICON_BACK}</button>
      <h1 class="tb-title">${esc(p.title)}</h1>
      <button class="tb-branch ${inGit ? "is-on" : ""}" data-act="__toggleGit"
        title="${inGit ? "回到写作" : "切换到 Git mode（commit / review）"}">
        ${ICON_BRANCH}<span class="mono">${esc(p.branch)}</span>
        <em>${inGit ? "Git mode" : "写作中"}</em>
      </button>
      <div class="spacer"></div>
      <button class="tb-loom ${STATE.loomOpen ? "is-on" : ""}" data-act="__toggleLoom">
        ${ICON_GRAPH}Loom
      </button>
      <div class="avatar avatar-you">${esc(DATA.user.initials)}</div>
    </header>`;
}

function rerender() {
  const v = VIEWS[STATE.view] || VIEWS.posts;
  let body = "";
  try {
    body = v.fn();
  } catch (err) {
    body = `<div class="card" style="padding:16px"><strong>渲染失败：${esc(STATE.view)}</strong><pre class="mono" style="white-space:pre-wrap;color:var(--danger)">${esc((err && err.stack) || err)}</pre></div>`;
  }

  let overlay = "";
  if (STATE.sync != null) {
    let panel = "";
    try {
      panel = renderSync();
    } catch (err) {
      panel = `<div class="card" style="padding:16px;color:var(--danger)">Sync 渲染失败：${esc(err && err.message)}</div>`;
    }
    overlay = `<div class="sync-scrim" data-scrim="1"><div class="screen screen-sync">${panel}</div></div>`;
  }

  let loom = "";
  if (STATE.loomOpen && v.level === "post") {
    let panel = "";
    try {
      panel = renderLoom();
    } catch (err) {
      panel = `<div class="card" style="padding:16px;color:var(--danger)">Loom 渲染失败：${esc(err && err.message)}</div>`;
    }
    loom = `<div class="loom-scrim" data-loomscrim="1"></div>
      <aside class="loom-drawer">
        <div class="loom-drawer-head">
          <strong>${ICON_GRAPH}Loom · 任务即图</strong>
          <button class="btn btn-sm btn-ghost" data-act="__closeLoom">收起</button>
        </div>
        <div class="loom-drawer-body"><div class="screen screen-loom">${panel}</div></div>
      </aside>`;
  }

  const wide = v.level === "post" && STATE.view === "draft";
  document.getElementById("root").innerHTML = `
    <div class="app ${STATE.sync != null ? "app-sync-on" : ""}">
      ${renderTopbar()}
      <main class="main ${wide ? "main-wide" : ""}"><div class="screen screen-${v.key}">${body}</div></main>
    </div>
    ${overlay}${loom}`;
}

ACTIONS.__go = (arg) => go(arg);
ACTIONS.__openSync = (arg) => openSync(arg);
ACTIONS.__closeSync = () => closeSync();
ACTIONS.__closeLoom = () => closeLoom();
ACTIONS.__toggleLoom = () => (STATE.loomOpen ? closeLoom() : openLoom());
ACTIONS.__toggleGit = () => go(STATE.view === "git" ? "draft" : "git");

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el) {
    const fn = ACTIONS[el.dataset.act];
    if (typeof fn === "function") {
      e.preventDefault();
      try {
        fn(el.dataset.arg, el);
      } catch (err) {
        console.error("action failed:", el.dataset.act, err);
      }
      rerender();
      return;
    }
  }
  if (e.target.dataset && e.target.dataset.scrim === "1") closeSync();
  if (e.target.dataset && e.target.dataset.loomscrim === "1") closeLoom();
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (STATE.sync != null) closeSync();
  else if (STATE.loomOpen) closeLoom();
});

rerender();

</script>
</body>
</html>
