<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog Studio · 界面原型</title>
<meta name="description" content="Blog Studio 写作工作流的界面原型：同步 / 异步双模式，一篇文章一个 branch。">
<style>
/* ============================================================
   Blog Studio Prototype — Design System
   共享 token + 组件。各屏 CSS 只允许使用这里的 CSS 变量取色。
   ============================================================ */

:root {
  color-scheme: light dark;

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
    "Liberation Mono", monospace;
  --font-serif: "Songti SC", "Source Han Serif SC", Georgia, "Times New Roman",
    serif;

  --r-sm: 4px;
  --r: 7px;
  --r-lg: 11px;
  --r-xl: 16px;

  /* neutral */
  --bg: #fbfbfc;
  --bg-elev: #ffffff;
  --bg-sunken: #f2f3f5;
  --bg-hover: #f6f7f8;
  --border: #e3e5e8;
  --border-strong: #cdd0d5;
  --text: #16181c;
  --text-dim: #5c6370;
  --text-faint: #8b919b;

  /* async / primary */
  --accent: #2f6feb;
  --accent-hover: #2860d3;
  --accent-bg: #eaf1fe;
  --accent-border: #b9d0fb;
  --accent-text: #1c4fb5;

  /* sync — 暖色，整套设计的第二语义轴 */
  --sync: #b4690e;
  --sync-hover: #9c5a09;
  --sync-bg: #fdf3e3;
  --sync-border: #f0d3a1;
  --sync-text: #8a5008;
  --sync-solid: #d4820f;

  /* stance / status */
  --support: #1a7f45;
  --support-bg: #e7f6ec;
  --support-border: #b4e0c4;

  /* 砖红而非橙 —— 必须和 --sync 的琥珀拉开色相，
     否则 stance 色会稀释「暖色 = 同步」这条语义。 */
  --refute: #b34a2b;
  --refute-bg: #fdeee8;
  --refute-border: #f2c7b4;

  --danger: #ce3a3a;
  --danger-bg: #fdeded;
  --danger-border: #f5c2c2;

  --warn: #a37a08;
  --warn-bg: #fcf6e0;
  --warn-border: #ecd9a0;

  --neutral-bg: #eef0f2;
  --neutral-border: #dcdfe3;

  --shadow-sm: 0 1px 2px rgb(16 18 22 / 0.06);
  --shadow: 0 2px 6px rgb(16 18 22 / 0.07), 0 1px 2px rgb(16 18 22 / 0.05);
  --shadow-lg: 0 12px 34px rgb(16 18 22 / 0.16), 0 3px 10px rgb(16 18 22 / 0.09);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1114;
    --bg-elev: #16191d;
    --bg-sunken: #1b1f24;
    --bg-hover: #1e2228;
    --border: #272c33;
    --border-strong: #383f48;
    --text: #e6e9ed;
    --text-dim: #9aa2ad;
    --text-faint: #6c757f;

    --accent: #5b93f5;
    --accent-hover: #74a4f7;
    --accent-bg: #16233c;
    --accent-border: #2c4573;
    --accent-text: #8fb6f9;

    --sync: #e0a13c;
    --sync-hover: #edb257;
    --sync-bg: #2a2013;
    --sync-border: #4d3b1d;
    --sync-text: #e8b35a;
    --sync-solid: #d4920f;

    --support: #47b877;
    --support-bg: #12241a;
    --support-border: #24462f;

    --refute: #e08c63;
    --refute-bg: #2a1a12;
    --refute-border: #4a2d1d;

    --danger: #e56b6b;
    --danger-bg: #2a1618;
    --danger-border: #4d2529;

    --warn: #d3aa3f;
    --warn-bg: #262013;
    --warn-border: #453a1e;

    --neutral-bg: #21262c;
    --neutral-border: #2f353c;

    --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.4);
    --shadow: 0 2px 8px rgb(0 0 0 / 0.45);
    --shadow-lg: 0 14px 40px rgb(0 0 0 / 0.6), 0 3px 10px rgb(0 0 0 / 0.4);
  }
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

::selection { background: var(--accent-bg); }

/* ---------- scrollbars ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 99px;
  border: 3px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

/* ============================================================
   共享组件
   ============================================================ */

.mono { font-family: var(--font-mono); font-size: 0.86em; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  background: var(--bg-elev);
  color: var(--text);
  border-radius: var(--r);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background .13s, border-color .13s, color .13s;
}
.btn:hover { background: var(--bg-hover); border-color: var(--text-faint); }
.btn:active { transform: translateY(0.5px); }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }

.btn-sync {
  background: var(--sync-solid);
  border-color: var(--sync-solid);
  color: #fff;
}
.btn-sync:hover { background: var(--sync-hover); border-color: var(--sync-hover); color: #fff; }

.btn-sync-soft {
  background: var(--sync-bg);
  border-color: var(--sync-border);
  color: var(--sync-text);
}
.btn-sync-soft:hover { background: var(--sync-bg); border-color: var(--sync); color: var(--sync-text); }

.btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-hover); border-color: transparent; color: var(--text); }

.btn-sm { padding: 3px 9px; font-size: 12px; border-radius: var(--r-sm); }
.btn-lg { padding: 9px 18px; font-size: 14px; }

.btn[disabled], .btn:disabled {
  opacity: .5;
  cursor: not-allowed;
  pointer-events: none;
}

/* ---------- badges ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 8px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 550;
  line-height: 1.7;
  border: 1px solid var(--neutral-border);
  background: var(--neutral-bg);
  color: var(--text-dim);
  white-space: nowrap;
}
.badge-accent  { background: var(--accent-bg);  border-color: var(--accent-border);  color: var(--accent-text); }
.badge-sync    { background: var(--sync-bg);    border-color: var(--sync-border);    color: var(--sync-text); }
.badge-support { background: var(--support-bg); border-color: var(--support-border); color: var(--support); }
.badge-refute  { background: var(--refute-bg);  border-color: var(--refute-border);  color: var(--refute); }
.badge-danger  { background: var(--danger-bg);  border-color: var(--danger-border);  color: var(--danger); }
.badge-warn    { background: var(--warn-bg);    border-color: var(--warn-border);    color: var(--warn); }
.badge-square  { border-radius: var(--r-sm); }

/* ---------- dots ---------- */
.dot { width: 8px; height: 8px; border-radius: 99px; flex: none; background: var(--text-faint); }
.dot-accent { background: var(--accent); }
.dot-sync { background: var(--sync-solid); }
.dot-support { background: var(--support); }
.dot-danger { background: var(--danger); }
.dot-warn { background: var(--warn); }
.dot-pulse { position: relative; }
.dot-pulse::after {
  content: ""; position: absolute; inset: -4px;
  border-radius: 99px; border: 1.5px solid currentColor;
  opacity: .45; animation: pulse 2s ease-out infinite;
}
@keyframes pulse {
  0% { transform: scale(.7); opacity: .55; }
  100% { transform: scale(1.5); opacity: 0; }
}

/* ---------- cards & panels ---------- */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
}
.panel { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-sunken);
}
.panel-title { font-size: 12.5px; font-weight: 650; letter-spacing: .02em; color: var(--text); margin: 0; }
.panel-body { padding: 14px; }

.side-label {
  font-size: 11px; font-weight: 650; letter-spacing: .07em;
  text-transform: uppercase; color: var(--text-faint);
  margin: 0 0 8px;
}

/* ---------- misc ---------- */
.meta { font-size: 12.5px; color: var(--text-dim); }
.faint { color: var(--text-faint); }
.hr { height: 1px; background: var(--border); border: 0; margin: 14px 0; }

.bar { height: 6px; border-radius: 99px; background: var(--bg-sunken); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; }

.avatar {
  width: 22px; height: 22px; border-radius: 99px; flex: none;
  display: grid; place-items: center;
  font-size: 10.5px; font-weight: 650; letter-spacing: -.02em;
  background: var(--neutral-bg); color: var(--text-dim);
  border: 1px solid var(--border);
}
.avatar-you { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent-border); }
.avatar-bot { background: var(--bg-sunken); color: var(--text-dim); font-size: 11px; }

.quote {
  border-left: 2px solid var(--border-strong);
  padding: 2px 0 2px 11px;
  color: var(--text-dim);
  font-family: var(--font-serif);
  font-size: 13.5px;
  line-height: 1.65;
}

.kbd {
  font-family: var(--font-mono); font-size: 11px;
  padding: 1px 5px; border-radius: var(--r-sm);
  border: 1px solid var(--border-strong); background: var(--bg-sunken);
  color: var(--text-dim);
}

/* 网格：主栏 + 侧栏 */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 1080px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.spacer { flex: 1; }


/* ============================================================
   App Shell —— 顶栏 / 内容区 / 同步遮罩 / Loom 抽屉
   ============================================================ */

.app { min-height: 100%; display: flex; flex-direction: column; }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  height: 50px; padding: 0 16px;
  background: color-mix(in srgb, var(--bg-elev) 90%, transparent);
  backdrop-filter: saturate(1.6) blur(10px);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13.5px; letter-spacing: -.01em; }
.brand svg { color: var(--accent); }

/* 顶层实体切换 */
.ents { display: flex; gap: 2px; margin-left: 14px; }
.ent {
  padding: 4px 12px; border: 0; background: none; cursor: pointer;
  border-radius: var(--r); font-size: 13px; font-weight: 500; color: var(--text-dim);
}
.ent:hover { background: var(--bg-hover); color: var(--text); }
.ent.is-on { background: var(--bg-sunken); color: var(--text); font-weight: 600; }

/* 文章内顶栏 */
.tb-back {
  display: grid; place-items: center;
  width: 28px; height: 28px; flex: none;
  border: 0; background: none; cursor: pointer;
  border-radius: var(--r-sm); color: var(--text-dim);
}
.tb-back:hover { background: var(--bg-hover); color: var(--text); }

.tb-title {
  margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw;
}

.tb-branch {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px 4px 9px;
  border: 1px solid var(--border); background: var(--bg-sunken);
  border-radius: 99px; cursor: pointer; color: var(--text-dim);
}
.tb-branch .mono { font-size: 11.5px; color: var(--text-dim); }
.tb-branch em {
  font-style: normal; font-size: 10.5px; padding-left: 7px;
  margin-left: 1px; border-left: 1px solid var(--border-strong);
  color: var(--text-faint);
}
.tb-branch:hover { border-color: var(--accent-border); background: var(--accent-bg); color: var(--accent-text); }
.tb-branch:hover .mono, .tb-branch:hover em { color: var(--accent-text); }
.tb-branch.is-on {
  border-color: var(--accent); background: var(--accent); color: #fff;
}
.tb-branch.is-on .mono, .tb-branch.is-on em { color: #fff; }
.tb-branch.is-on em { border-left-color: color-mix(in srgb, #fff 45%, transparent); }

.tb-loom {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border: 1px solid var(--border-strong);
  background: var(--bg-elev); border-radius: var(--r);
  font-size: 12.5px; font-weight: 550; color: var(--text-dim); cursor: pointer;
}
.tb-loom:hover { border-color: var(--text-faint); color: var(--text); background: var(--bg-hover); }
.tb-loom.is-on { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-text); }

/* ---------- 内容区 ---------- */
.main { flex: 1; width: 100%; max-width: 1420px; margin: 0 auto; padding: 20px 18px 48px; }
.main-wide { max-width: none; padding: 0; }

/* ---------- 同步遮罩 ---------- */
.sync-scrim {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-items: center;
  padding: 24px;
  background: color-mix(in srgb, var(--sync) 12%, rgb(10 8 4 / .5));
  backdrop-filter: blur(3px);
  animation: shell-fade .16s ease-out;
}
@keyframes shell-fade { from { opacity: 0 } to { opacity: 1 } }
.sync-scrim > .screen-sync { width: 100%; display: flex; justify-content: center; }

.app-sync-on::after {
  content: ""; position: fixed; inset: 0; z-index: 89; pointer-events: none;
  box-shadow: inset 0 0 0 3px var(--sync-solid);
}

/* ---------- Loom 抽屉 ---------- */
.loom-scrim {
  position: fixed; inset: 0; z-index: 70;
  background: rgb(10 12 16 / .28);
  animation: shell-fade .14s ease-out;
}
.loom-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 71;
  width: min(1080px, 94vw);
  display: flex; flex-direction: column;
  background: var(--bg);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  animation: shell-slide .2s cubic-bezier(.2,.7,.3,1);
}
@keyframes shell-slide { from { transform: translateX(24px); opacity: .4 } to { transform: none; opacity: 1 } }

.loom-drawer-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
}
.loom-drawer-head strong {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 650;
}
.loom-drawer-head svg { color: var(--accent); }
.loom-drawer-body { flex: 1; overflow: auto; padding: 16px; }


/* ===== screen: posts ===== */
/* ============================================================
   S0 · Posts（列表 / Inbox）
   所有选择器以 .screen-posts 开头；颜色只用 base.css 变量。
   ============================================================ */

.screen-posts .ico { flex: none; }

/* ---------- 模式图例 ---------- */
.screen-posts .legend {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 7px 12px;
  margin: 0 0 16px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-elev);
  font-size: 12px;
  color: var(--text-dim);
}
.screen-posts .legend-item { display: inline-flex; align-items: center; gap: 7px; }
.screen-posts .legend-item .dot { width: 7px; height: 7px; }
.screen-posts .legend-sync { color: var(--sync-text); }
.screen-posts .legend-sep {
  width: 1px;
  height: 12px;
  background: var(--border);
}
.screen-posts .legend-ratio { color: var(--text-faint); font-size: 11px; }

/* ---------- 主栏头 ---------- */
.screen-posts .head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.screen-posts .head-l { display: flex; align-items: center; gap: 9px; }
.screen-posts .h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 660;
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.screen-posts .count {
  color: var(--text-faint);
  font-size: 13px;
  padding: 0 6px;
  border-radius: var(--r-sm);
  background: var(--bg-sunken);
}
.screen-posts .head-r { display: flex; align-items: center; gap: 10px; }
.screen-posts .new-hint {
  font-size: 11.5px;
  color: var(--sync-text);
  text-align: right;
  max-width: 210px;
  line-height: 1.35;
}
.screen-posts .new-hint b { font-weight: 650; }

/* ---------- 筛选 chips ---------- */
.screen-posts .chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.screen-posts .chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--text-dim);
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background .13s, border-color .13s, color .13s;
}
.screen-posts .chip:hover { background: var(--bg-hover); border-color: var(--border-strong); color: var(--text); }
.screen-posts .chip.is-on {
  background: var(--accent-bg);
  border-color: var(--accent-border);
  color: var(--accent-text);
  font-weight: 600;
}
.screen-posts .chip-dot { width: 6px; height: 6px; }
.screen-posts .chip-n {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
}
.screen-posts .chip.is-on .chip-n { color: var(--accent-text); opacity: .8; }

/* ---------- 列表 ---------- */
.screen-posts .list {
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--bg-elev);
  overflow: hidden;
}
.screen-posts .list-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 108px 56px 76px;
  gap: 10px;
  padding: 7px 14px 7px 34px;
  background: var(--bg-sunken);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.screen-posts .list-head .cell-eval,
.screen-posts .list-head .cell-todo,
.screen-posts .list-head .cell-time { text-align: right; }

.screen-posts .prow {
  position: relative;
  display: grid;
  grid-template-columns: 8px minmax(0, 1fr) 108px 56px 76px;
  gap: 10px;
  align-items: center;
  padding: 11px 14px 11px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
}
.screen-posts .prow:last-child { border-bottom: 0; }
.screen-posts .prow:hover { background: var(--bg-hover); }
.screen-posts .prow:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.screen-posts .prow .rail {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
}
.screen-posts .prow.is-wait .rail { background: var(--accent); }
.screen-posts .prow.is-sync .rail { background: var(--sync-solid); }
.screen-posts .prow.is-wait { background: var(--accent-bg); }
.screen-posts .prow.is-wait:hover { background: var(--accent-bg); filter: brightness(.985); }
.screen-posts .prow.is-cur { box-shadow: inset 0 0 0 1px var(--accent-border); }

.screen-posts .prow-dot { align-self: center; }
.screen-posts .prow-main { min-width: 0; }
.screen-posts .prow-top {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  min-width: 0;
}
.screen-posts .prow-title {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
}
.screen-posts .prow:hover .prow-title { color: var(--accent); }
.screen-posts .b-wait { padding-left: 5px; }
.screen-posts .b-wait .ico { width: 12px; height: 12px; }

.screen-posts .prow-sub {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 3px;
  font-size: 12px;
}
.screen-posts .prow-sub .sep { color: var(--text-faint); }
.screen-posts .pid { color: var(--text-faint); }
.screen-posts .branch {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--text-dim);
}
.screen-posts .branch .ico { width: 13px; height: 13px; color: var(--text-faint); }
.screen-posts .cur-tag {
  font-size: 11px;
  color: var(--accent-text);
  border: 1px dashed var(--accent-border);
  border-radius: var(--r-sm);
  padding: 0 5px;
}

.screen-posts .run {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--accent-text);
  font-size: 12px;
}
.screen-posts .run .dot-accent { color: var(--accent); }
.screen-posts .run-sync { color: var(--sync-text); }
.screen-posts .run-sync .dot-sync { color: var(--sync-solid); }

.screen-posts .cell { text-align: right; }
.screen-posts .cell-eval {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
}
.screen-posts .score {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.screen-posts .delta {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
}
.screen-posts .delta.is-up { color: var(--support); }
.screen-posts .spark-wrap { display: inline-flex; color: var(--text-faint); }
.screen-posts .spark-wrap.is-up { color: var(--support); }
.screen-posts .spark { display: block; }

.screen-posts .todo {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
}
.screen-posts .todo .ico { width: 13px; height: 13px; }
.screen-posts .todo.is-wait { color: var(--accent-text); font-weight: 600; }
.screen-posts .cell-time { font-size: 12px; white-space: nowrap; }

.screen-posts .empty {
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-lg);
  padding: 28px;
  text-align: center;
}

/* ---------- 侧栏 ---------- */
.screen-posts .side { position: sticky; top: 0; }

/* 等你处理 —— 产品主入口 */
.screen-posts .panel-inbox {
  border-color: var(--accent-border);
  box-shadow: var(--shadow-sm);
}
.screen-posts .panel-inbox .panel-head {
  background: var(--accent-bg);
  border-bottom-color: var(--accent-border);
}
.screen-posts .panel-inbox .panel-title { color: var(--accent-text); }

.screen-posts .ibx-list { display: flex; flex-direction: column; }
.screen-posts .ibx {
  position: relative;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) 14px;
  align-items: start;
  gap: 9px;
  padding: 9px 12px 9px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
}
.screen-posts .ibx:last-child { border-bottom: 0; }
.screen-posts .ibx:hover { background: var(--bg-hover); }
.screen-posts .ibx:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.screen-posts .ibx-rail {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.screen-posts .ibx-ico { display: flex; padding-top: 1px; }
.screen-posts .ibx-go { display: flex; padding-top: 3px; color: var(--text-faint); opacity: 0; transition: opacity .12s; }
.screen-posts .ibx-go .ico { width: 14px; height: 14px; }
.screen-posts .ibx:hover .ibx-go { opacity: 1; }

.screen-posts .m-async .ibx-rail { background: var(--accent); }
.screen-posts .m-async .ibx-ico { color: var(--accent); }
.screen-posts .m-sync .ibx-rail { background: var(--sync-solid); }
.screen-posts .m-sync .ibx-ico { color: var(--sync); }
.screen-posts .m-sync .ibx-label { color: var(--sync-text); }
.screen-posts .m-danger .ibx-rail { background: var(--danger); }
.screen-posts .m-danger .ibx-ico { color: var(--danger); }
.screen-posts .m-danger .ibx-label { color: var(--danger); }

.screen-posts .ibx-label {
  font-size: 12.8px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text);
}
.screen-posts .ibx-meta {
  display: flex;
  align-items: baseline;
  gap: 5px;
  flex-wrap: wrap;
  font-size: 11.5px;
  margin-top: 2px;
}
.screen-posts .ibx-title {
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.screen-posts .ibx-foot {
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  background: var(--bg-sunken);
  font-size: 11.5px;
}

/* Context 库 */
.screen-posts .lib { padding: 12px 14px 13px; }
.screen-posts .lib-bar { height: 7px; }
.screen-posts .lib-bar .seg-ok { background: var(--support); }
.screen-posts .lib-bar .seg-no { background: var(--border-strong); }
.screen-posts .lib-bar .seg-dis { background: var(--warn); }
.screen-posts .lib-legend {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 11px;
}
.screen-posts .lib-l { display: flex; align-items: center; gap: 7px; }
.screen-posts .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.screen-posts .sw-ok { background: var(--support); }
.screen-posts .sw-no { background: var(--border-strong); }
.screen-posts .sw-dis { background: var(--warn); }
.screen-posts .lib-k { flex: 1; font-size: 12px; }
.screen-posts .lib-n { font-size: 12px; color: var(--text-dim); }
.screen-posts .lib-note {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin-top: 11px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  line-height: 1.5;
}
.screen-posts .lib-note .ico { width: 13px; height: 13px; margin-top: 2px; color: var(--warn); }

/* Agent 活动 */
.screen-posts .act-toggle { gap: 3px; padding: 2px 6px; }
.screen-posts .act-toggle .ico { width: 13px; height: 13px; transition: transform .15s; }
.screen-posts .act-toggle.is-open .ico { transform: rotate(180deg); }

.screen-posts .feed { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.screen-posts .fitem {
  position: relative;
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 9px;
  padding: 6px 0;
}
.screen-posts .fitem::before {
  content: "";
  position: absolute;
  left: 10.5px;
  top: 32px;
  bottom: -2px;
  width: 1px;
  background: var(--border);
}
.screen-posts .fitem:last-child::before { display: none; }
.screen-posts .fbody { min-width: 0; }
.screen-posts .fline { font-size: 12.3px; line-height: 1.45; color: var(--text-dim); }
.screen-posts .fwho { color: var(--text); font-weight: 600; }
.screen-posts .fdetail {
  display: flex;
  align-items: baseline;
  gap: 5px;
  flex-wrap: wrap;
  font-size: 11.5px;
  margin-top: 1px;
}
.screen-posts .fdetail .sep { color: var(--text-faint); }

/* ---------- 窄屏 ---------- */
@media (max-width: 860px) {
  .screen-posts .prow { grid-template-columns: 8px minmax(0, 1fr) 92px; }
  .screen-posts .cell-todo, .screen-posts .cell-time { display: none; }
  .screen-posts .list-head { grid-template-columns: minmax(0, 1fr) 92px; }
  .screen-posts .list-head .cell-todo, .screen-posts .list-head .cell-time { display: none; }
  .screen-posts .new-hint { display: none; }
}

/* 非 #12 的行被点击时的说明条 */
.screen-posts .pnotice {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding: 10px 12px;
  border: 1px solid var(--warn-border);
  background: var(--warn-bg);
  border-radius: var(--r);
  color: var(--warn);
}
.screen-posts .pnotice > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.screen-posts .pnotice b { color: var(--text); font-weight: 600; font-size: 13px; }
.screen-posts .pnotice .meta { color: var(--text-dim); }
.screen-posts .pnotice .btn { margin-left: auto; }


/* ===== screen: context ===== */
/* ============================================================
   S2 · Context —— 材料库 + 闸门 A
   所有选择器必须以 .screen-context 开头
   ============================================================ */

.screen-context {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-bottom: 4px;
}

.screen-context .ico {
  flex: none;
  display: block;
}
.screen-context .badge .ico { width: 12px; height: 12px; }
.screen-context .btn-sm .ico { width: 13px; height: 13px; }
.screen-context .fpill .ico { width: 12px; height: 12px; }
.screen-context .btn-lg .ico { width: 15px; height: 15px; }

/* ---------- 覆盖度报告 ---------- */

.screen-context .cov-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 296px;
  gap: 0;
  padding: 0;
}
@media (max-width: 1040px) {
  .screen-context .cov-body { grid-template-columns: minmax(0, 1fr); }
}

.screen-context .cov-main { padding: 11px 14px 12px; min-width: 0; }

.screen-context .cov-side {
  border-left: 1px solid var(--border);
  background: var(--bg-sunken);
  padding: 11px 14px 12px;
}
@media (max-width: 1040px) {
  .screen-context .cov-side { border-left: 0; border-top: 1px solid var(--border); }
}

.screen-context .cov-legend {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 11.5px;
  color: var(--text-faint);
}
.screen-context .cov-legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.screen-context .cov-legend i {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  display: block;
}
.screen-context .cov-legend .lg-support { background: var(--support); }
.screen-context .cov-legend .lg-refute { background: var(--refute); }
.screen-context .cov-legend .lg-bg { background: var(--border-strong); }

.screen-context .cov-row {
  display: grid;
  grid-template-columns: 16px minmax(96px, 178px) minmax(0, 1fr) 74px 96px;
  align-items: center;
  gap: 10px;
  padding: 6px 8px;
  margin: 0 -8px;
  border-radius: var(--r);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .12s, border-color .12s;
}
.screen-context .cov-row:hover { background: var(--bg-hover); }
.screen-context .cov-row.is-active {
  background: var(--accent-bg);
  border-color: var(--accent-border);
}
.screen-context .cov-row.is-thin {
  background: var(--danger-bg);
  border-color: var(--danger-border);
}
.screen-context .cov-row.is-thin.is-active { border-color: var(--danger); }

.screen-context .cov-n {
  font-size: 11px;
  color: var(--text-faint);
  text-align: right;
}
.screen-context .cov-row.is-thin .cov-n { color: var(--danger); }

.screen-context .cov-title {
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.screen-context .cov-track .bar { height: 8px; border-radius: 3px; }
.screen-context .cov-track .bar > span { min-width: 0; }

.screen-context .cov-nums {
  display: flex;
  gap: 7px;
  font-size: 11px;
  justify-content: flex-end;
}
.screen-context .cov-nums .n-support { color: var(--support); }
.screen-context .cov-nums .n-refute { color: var(--refute); }
.screen-context .cov-nums .n-bg { color: var(--text-faint); }
.screen-context .cov-nums .n-off { opacity: .35; }

.screen-context .cov-end {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
}

.screen-context .cov-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px dashed var(--border);
  font-size: 12px;
  color: var(--text-faint);
}

/* 未归类告警卡 —— 异步语义，用冷色 */
.screen-context .seed {
  border: 1px solid var(--accent-border);
  background: var(--accent-bg);
  border-radius: var(--r);
  padding: 10px 11px;
}
.screen-context .seed-head {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--accent-text);
  font-size: 12.5px;
  font-weight: 650;
}
.screen-context .seed-n {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
  color: var(--accent-text);
  margin-top: 4px;
}
.screen-context .seed-body {
  font-size: 12px;
  color: var(--accent-text);
  opacity: .88;
  margin: 2px 0 9px;
}

.screen-context .cov-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  margin-top: 12px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.screen-context .cov-stat {
  background: var(--bg-elev);
  padding: 7px 6px 8px;
  text-align: center;
}
.screen-context .cov-stat b {
  display: block;
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.02em;
}
.screen-context .cov-stat span {
  font-size: 10.5px;
  color: var(--text-faint);
}
.screen-context .cov-stat.s-approved b { color: var(--support); }
.screen-context .cov-stat.s-rejected b { color: var(--text-dim); }
.screen-context .cov-stat.s-disputed b { color: var(--refute); }

/* ---------- 过滤条 ---------- */

.screen-context .filters {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 14px;
  padding: 8px 12px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
}

.screen-context .fgroup { display: flex; align-items: center; gap: 6px; }

.screen-context .flabel {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-right: 1px;
}

.screen-context .chip {
  padding: 2px 9px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, border-color .12s, color .12s;
}
.screen-context .chip:hover { background: var(--bg-hover); color: var(--text); }
.screen-context .chip.on {
  background: var(--neutral-bg);
  border-color: var(--border-strong);
  color: var(--text);
  font-weight: 600;
}
.screen-context .chip.on.c-support { background: var(--support-bg); border-color: var(--support-border); color: var(--support); }
.screen-context .chip.on.c-refute { background: var(--refute-bg); border-color: var(--refute-border); color: var(--refute); }
.screen-context .chip.on.c-accent { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent-text); }

.screen-context .fdiv {
  width: 1px;
  height: 16px;
  background: var(--border);
}

.screen-context .fcount {
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
}
.screen-context .fcount b {
  font-family: var(--font-mono);
  color: var(--text);
  font-weight: 600;
}

.screen-context .fpill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 6px 2px 9px;
  border-radius: 99px;
  font-size: 12px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  color: var(--accent-text);
  cursor: pointer;
}
.screen-context .fpill:hover { border-color: var(--accent); }

/* ---------- 卡片列表 ---------- */

.screen-context .list { display: flex; flex-direction: column; gap: 10px; }

.screen-context .ctx-card {
  border-left: 3px solid var(--border);
  padding: 12px 14px 11px;
  transition: border-color .12s, box-shadow .12s;
}
.screen-context .ctx-card.st-approved { border-left-color: var(--support); }
.screen-context .ctx-card.st-disputed { border-left-color: var(--refute); background: var(--refute-bg); }
.screen-context .ctx-card.st-rejected { border-left-color: var(--border-strong); }
.screen-context .ctx-card.st-rejected .card-fade { opacity: .45; }
.screen-context .ctx-card.is-dirty { box-shadow: 0 0 0 1px var(--accent-border); }

.screen-context .ctx-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.screen-context .ctx-id { font-size: 11.5px; }

.screen-context .conf {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-faint);
}
.screen-context .conf .bar { width: 46px; height: 4px; }
.screen-context .conf b {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text-dim);
}
.screen-context .conf.is-low b { color: var(--danger); }

.screen-context .claim {
  font-size: 15.5px;
  line-height: 1.5;
  font-weight: 600;
  letter-spacing: -.005em;
  color: var(--text);
  margin: 9px 0 9px;
}

.screen-context .ev { position: relative; padding-right: 116px; }
.screen-context .ev .quote { margin: 0; }
.screen-context .ev-tag {
  position: absolute;
  top: 0;
  right: 0;
  font-size: 10.5px;
  letter-spacing: .02em;
  color: var(--text-faint);
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-sm);
  padding: 0 6px;
  white-space: nowrap;
  background: var(--bg-sunken);
}
@media (max-width: 720px) {
  .screen-context .ev { padding-right: 0; }
  .screen-context .ev-tag { position: static; display: inline-block; margin-bottom: 5px; }
}

.screen-context .srcline {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 10px;
  margin-top: 10px;
  font-size: 12.5px;
  color: var(--text-dim);
}
.screen-context .srcline .src { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.screen-context .srcline .src-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 340px;
}
.screen-context .loc {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 0 5px;
  border-radius: var(--r-sm);
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  color: var(--text-dim);
}

.screen-context .tags { display: inline-flex; gap: 5px; }
.screen-context .tag {
  font-size: 11px;
  padding: 0 6px;
  border-radius: var(--r-sm);
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  color: var(--text-faint);
}

.screen-context .hint {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-dim);
}
.screen-context .hint-none { color: var(--accent-text); }

.screen-context .acts {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 11px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.screen-context .act.on-approved {
  background: var(--support-bg);
  border-color: var(--support-border);
  color: var(--support);
}
.screen-context .act.on-rejected {
  background: var(--neutral-bg);
  border-color: var(--border-strong);
  color: var(--text-dim);
}
.screen-context .act.on-disputed {
  background: var(--refute-bg);
  border-color: var(--refute-border);
  color: var(--refute);
}

.screen-context .reassign {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
  padding: 9px 10px;
  border-radius: var(--r);
  background: var(--bg-sunken);
  border: 1px solid var(--border);
}
.screen-context .reassign .rlabel { font-size: 11.5px; color: var(--text-faint); margin-right: 2px; }
.screen-context .rbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- disputed 连锁影响 ---------- */

.screen-context .dispute {
  margin-top: 11px;
  border: 1px solid var(--danger-border);
  border-radius: var(--r);
  background: var(--bg-elev);
  overflow: hidden;
}
.screen-context .dispute-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 11px;
  background: var(--danger-bg);
  border-bottom: 1px solid var(--danger-border);
  color: var(--danger);
  font-size: 12.5px;
  font-weight: 650;
}
.screen-context .dispute-body { padding: 10px 11px 11px; }
.screen-context .dispute-note {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 10px;
}
.screen-context .dispute-note em {
  font-style: normal;
  color: var(--danger);
}

.screen-context .chain {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  font-size: 12.5px;
  color: var(--warn);
}
.screen-context .chain b { color: var(--danger); font-weight: 650; }
.screen-context .bchip {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 0 6px;
  border-radius: var(--r-sm);
  background: var(--bg-elev);
  border: 1px solid var(--danger-border);
  color: var(--danger);
  cursor: pointer;
}
.screen-context .bchip:hover { background: var(--danger-bg); }
.screen-context .chain-arrow { color: var(--text-faint); }

.screen-context .dispute-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-faint);
}

/* ---------- 列表尾 + 空态 ---------- */

.screen-context .more {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 9px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-lg);
  font-size: 12px;
  color: var(--text-faint);
}

.screen-context .empty {
  padding: 30px 14px;
  text-align: center;
  color: var(--text-faint);
  font-size: 13px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-lg);
}

/* ---------- 底部固定 pending 栏 ---------- */

.screen-context .pendbar {
  position: sticky;
  bottom: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 2px;
  padding: 10px 14px;
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
}

.screen-context .pend-n {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.screen-context .pend-n b {
  font-family: var(--font-mono);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -.02em;
  color: var(--text);
}
.screen-context .pend-n.is-zero b { color: var(--text-faint); }
.screen-context .pend-n span {
  font-size: 12.5px;
  color: var(--text-dim);
  font-weight: 600;
}

.screen-context .pend-break {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-dim);
  flex-wrap: wrap;
}
.screen-context .pend-break .k {
  font-family: var(--font-mono);
  font-weight: 600;
}
.screen-context .pend-break .k-approved { color: var(--support); }
.screen-context .pend-break .k-rejected { color: var(--text-dim); }
.screen-context .pend-break .k-disputed { color: var(--refute); }
.screen-context .pend-break .k-moved { color: var(--accent); }

.screen-context .pend-sub {
  font-size: 11.5px;
  color: var(--text-faint);
  text-align: right;
  line-height: 1.45;
  max-width: 210px;
}


/* ===== screen: draft ===== */
/* ===== Draft · Studio ===== */

.screen-draft { --doc: 720px; }

.screen-draft .st-wrap {
  display: grid;
  grid-template-columns: 224px minmax(0, 1fr);
  align-items: start;
  min-height: calc(100vh - 50px);
}

/* ---------- TOC（朴素，无状态显示） ---------- */
.screen-draft .st-toc {
  position: sticky; top: 50px;
  padding: 34px 14px 40px 24px;
  max-height: calc(100vh - 50px); overflow: auto;
}
.screen-draft .st-toc-lab {
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-faint); margin: 0 0 10px 8px;
}
.screen-draft .st-toc nav { display: flex; flex-direction: column; gap: 1px; }
.screen-draft .st-toc-i {
  display: flex; align-items: baseline; gap: 9px;
  padding: 5px 8px; text-align: left;
  border: 0; background: none; cursor: pointer;
  border-radius: var(--r-sm);
  font-size: 12.5px; line-height: 1.5; color: var(--text-dim);
}
.screen-draft .st-toc-i i {
  font-style: normal; font-family: var(--font-mono);
  font-size: 10.5px; color: var(--text-faint); flex: none;
}
.screen-draft .st-toc-i:hover { background: var(--bg-hover); color: var(--text); }
.screen-draft .st-toc-i.is-on { color: var(--text); font-weight: 600; }

/* ---------- 文档 ---------- */
.screen-draft .st-main { padding: 0 24px; }
.screen-draft .st-doc {
  max-width: var(--doc);
  margin: 0 auto;
  padding: 34px 0 220px;
}
.screen-draft .st-doc h1 {
  margin: 0 0 30px;
  font-size: 30px; line-height: 1.32; letter-spacing: -.015em;
  font-weight: 700;
}

.screen-draft .st-block {
  position: relative;
  padding: 3px 0;
  border-radius: var(--r-sm);
  cursor: text;
}
.screen-draft .st-block h2 {
  margin: 34px 0 12px;
  font-size: 18.5px; font-weight: 650; letter-spacing: -.01em;
}
.screen-draft .st-block p {
  margin: 0 0 17px;
  font-family: var(--font-serif);
  font-size: 16.5px; line-height: 1.85;
  color: var(--text);
}
.screen-draft .st-block.is-sel { background: var(--bg-hover); }
.screen-draft .st-block.is-sel::before {
  content: ""; position: absolute; left: -14px; top: 4px; bottom: 4px;
  width: 2px; border-radius: 2px; background: var(--accent);
}

/* 确定性检查落在正文里 */
.screen-draft .st-flag { cursor: help; }
.screen-draft .st-flag.is-unsourced {
  text-decoration: underline wavy var(--danger);
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
}
.screen-draft .st-flag.is-disputed {
  text-decoration: underline dashed var(--refute);
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
}

/* ---------- 页脚 ---------- */
.screen-draft .st-foot {
  margin-top: 26px; padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-faint);
}
.screen-draft .st-link {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--accent); font-size: 12px;
}
.screen-draft .st-link:hover { text-decoration: underline; }

/* ---------- composer ---------- */
.screen-draft .st-composer-wrap {
  position: fixed; left: 224px; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center;
  padding: 0 24px 22px;
  background: linear-gradient(to top,
    var(--bg) 42%, color-mix(in srgb, var(--bg) 70%, transparent) 72%, transparent);
  pointer-events: none;
}
.screen-draft .st-composer {
  width: 100%; max-width: var(--doc);
  pointer-events: auto;
  border: 1px solid var(--border-strong);
  background: var(--bg-elev);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.screen-draft .st-composer-state {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-sunken);
  font-size: 11.5px; color: var(--text-dim);
}
.screen-draft .st-composer-state em {
  font-style: normal; margin-left: auto; color: var(--text-faint);
}
.screen-draft .st-composer-row { display: flex; align-items: flex-end; gap: 9px; padding: 9px 10px 10px; }
.screen-draft .st-composer textarea {
  flex: 1; resize: none; border: 0; outline: none; background: none;
  font-size: 14px; line-height: 1.6; padding: 4px 4px 5px;
  min-height: 32px; color: var(--text);
}
.screen-draft .st-composer textarea::placeholder { color: var(--text-faint); }

@media (max-width: 900px) {
  .screen-draft .st-wrap { grid-template-columns: minmax(0, 1fr); }
  .screen-draft .st-toc { position: static; max-height: none; padding: 20px 24px 0; }
  .screen-draft .st-toc nav { flex-direction: row; flex-wrap: wrap; gap: 4px; }
  .screen-draft .st-composer-wrap { left: 0; }
}

/* ============================================================
   展开面板 —— 最小编辑单位是一个 block，点开就看到它的全部
   ============================================================ */

.screen-draft .st-body { cursor: pointer; }

.screen-draft .st-panel {
  margin: 4px 0 8px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-elev);
  overflow: hidden;
  font-family: var(--font-sans);
}

.screen-draft .st-panel-head {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 11px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-sunken);
}
.screen-draft .st-bid { font-size: 11px; color: var(--text-faint); }
.screen-draft .st-noreview { font-size: 11.5px; color: var(--text-faint); margin-left: auto; }
.screen-draft .st-rev {
  display: inline-flex; align-items: center; gap: 5px;
  margin-left: auto; padding: 2px 8px;
  border: 1px solid var(--accent-border); background: var(--accent-bg);
  color: var(--accent-text); border-radius: 99px;
  font-size: 11.5px; cursor: pointer;
}
.screen-draft .st-rev:hover { border-color: var(--accent); }

/* ---------- diff ---------- */
.screen-draft .st-diff { padding: 9px 11px 10px; }
.screen-draft .st-diff-head {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  margin-bottom: 7px;
  font-size: 11px; color: var(--text-faint);
}
.screen-draft .st-diff-head .mono { color: var(--accent); font-weight: 650; }
.screen-draft .st-diff-why {
  margin-left: auto; color: var(--text-dim); font-style: italic;
}
.screen-draft .st-d {
  display: flex; gap: 8px;
  padding: 5px 9px;
  font-size: 12.5px; line-height: 1.65;
  border-radius: var(--r-sm);
}
.screen-draft .st-d + .st-d { margin-top: 3px; }
.screen-draft .st-d i {
  font-style: normal; font-family: var(--font-mono);
  font-weight: 700; flex: none; opacity: .7;
}
.screen-draft .st-d.is-del {
  background: var(--danger-bg); color: var(--text-dim);
}
.screen-draft .st-d.is-del i { color: var(--danger); }
.screen-draft .st-d.is-del span { text-decoration: line-through; text-decoration-color: var(--danger-border); }
.screen-draft .st-d.is-ins { background: var(--support-bg); color: var(--text); }
.screen-draft .st-d.is-ins i { color: var(--support); }

.screen-draft .st-nodiff {
  display: flex; align-items: center; gap: 7px;
  padding: 10px 11px;
  font-size: 12px; color: var(--text-faint);
}

/* ---------- context 索引：一个一个小点 ---------- */
.screen-draft .st-src {
  border-top: 1px solid var(--border);
  padding: 7px 11px 9px;
}
.screen-draft .st-src-i {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 4px; border-radius: var(--r-sm);
  cursor: pointer;
}
.screen-draft .st-src-i:hover { background: var(--bg-hover); }
.screen-draft .st-dot {
  width: 6px; height: 6px; border-radius: 99px; flex: none;
  background: var(--text-faint);
}
.screen-draft .st-dot.is-support { background: var(--support); }
.screen-draft .st-dot.is-refute { background: var(--refute); }
.screen-draft .st-dot.is-background { background: var(--border-strong); }
.screen-draft .st-dot.is-none { background: var(--danger); }
.screen-draft .st-src-i b {
  font-size: 12.5px; font-weight: 500; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.screen-draft .st-src-i .mono { margin-left: auto; font-size: 10.5px; color: var(--text-faint); flex: none; }
.screen-draft .st-src-i em {
  font-style: normal; font-size: 10.5px; flex: none;
  padding: 0 6px; border-radius: 99px;
  background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border);
}
.screen-draft .st-src-i.is-bad b { color: var(--danger); }
.screen-draft .st-src-i.is-none { cursor: default; }
.screen-draft .st-src-i.is-none:hover { background: none; }
.screen-draft .st-src-i.is-none b { color: var(--danger); font-weight: 600; }
.screen-draft .st-src-i.is-none span { font-size: 12px; color: var(--text-dim); }
.screen-draft .st-src-i.is-none .btn { margin-left: auto; }


/* ===== screen: review ===== */
/* ============================================================
   S4 · Review — Talk page
   所有选择器均以 .screen-review 开头；颜色只用 base.css 变量。
   ============================================================ */

/* ---------- 顶部汇总条 ---------- */

.screen-review .rv-top {
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 11px 16px;
  margin-bottom: 14px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  flex-wrap: wrap;
}

.screen-review .rv-stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.screen-review .rv-stat + .rv-stat {
  padding-left: 26px;
  border-left: 1px solid var(--border);
  margin-left: -14px;
}

.screen-review .rv-stat-k {
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.screen-review .rv-stat-v {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  display: flex;
  align-items: center;
  gap: 7px;
}

.screen-review .rv-score {
  font-size: 19px;
  font-weight: 680;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.screen-review .rv-delta {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  font-size: 12px;
  font-weight: 650;
  color: var(--support);
  background: var(--support-bg);
  border: 1px solid var(--support-border);
  border-radius: 99px;
  padding: 0 7px 0 4px;
}

.screen-review .rv-oc {
  font-weight: 500;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.screen-review .rv-oc b {
  color: var(--text);
  font-weight: 680;
}

.screen-review .rv-top-meta {
  text-align: right;
  line-height: 1.45;
}
.screen-review .rv-top-meta .mono {
  font-size: 12px;
  color: var(--text-dim);
}

/* ---------- 布局 ---------- */

.screen-review .rv-cols {
  align-items: start;
}

/* 底部 sticky pending 栏会浮在内容之上 —— 主栏留出净空 */
.screen-review .rv-main {
  min-width: 0;
  padding-bottom: 78px;
}

/* 顶栏 48px + Tab 栏 39px */
.screen-review .rv-side {
  position: sticky;
  top: 99px;
  padding-bottom: 78px;
}

/* ---------- 筛选 ---------- */

.screen-review .rv-filters {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.screen-review .rv-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  font-size: 12.5px;
  font-weight: 550;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 99px;
  cursor: pointer;
  transition: background 0.13s, border-color 0.13s, color 0.13s;
}
.screen-review .rv-chip:hover {
  background: var(--bg-hover);
  color: var(--text);
}
.screen-review .rv-chip.is-on {
  background: var(--accent-bg);
  border-color: var(--accent-border);
  color: var(--accent-text);
}
.screen-review .rv-chip-n {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
}
.screen-review .rv-chip.is-on .rv-chip-n {
  color: var(--accent-text);
  opacity: 0.75;
}

.screen-review .rv-chip-sm {
  padding: 2px 8px;
  font-size: 11.5px;
  font-weight: 500;
  background: var(--bg-elev);
}

/* ---------- comment 流 ---------- */

.screen-review .rv-stream {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.screen-review .rv-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border-strong);
  border-radius: var(--r-lg);
  padding: 12px 15px 13px;
}

.screen-review .rv-sev-high {
  border-left-color: var(--danger);
}
.screen-review .rv-sev-medium {
  border-left-color: var(--warn);
}
.screen-review .rv-sev-low {
  border-left-color: var(--border-strong);
}
.screen-review .rv-card.is-accepted {
  border-left-color: var(--support);
}
.screen-review .rv-card.is-dismissed {
  border-left-color: var(--refute);
}
.screen-review .rv-mine {
  border-left-color: var(--accent);
  border-style: solid;
  background: var(--bg-elev);
  box-shadow: inset 0 0 0 1px var(--accent-bg);
}

.screen-review .rv-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
}

.screen-review .rv-author {
  font-weight: 620;
  font-size: 13px;
}

.screen-review .rv-id {
  font-size: 11.5px;
}

.screen-review .rv-anchor {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--bg-sunken);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 11.5px;
  cursor: pointer;
  transition: color 0.13s, border-color 0.13s;
}
.screen-review .rv-anchor:hover {
  color: var(--accent);
  border-color: var(--accent-border);
}
.screen-review .rv-anchor svg {
  opacity: 0.65;
}

.screen-review .rv-quote {
  margin: 0 0 9px;
  border-left-color: var(--border-strong);
}

.screen-review .rv-issue {
  margin: 0 0 10px;
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--text);
}

/* ---------- instruction：必须可执行 ---------- */

.screen-review .rv-instr {
  border-left: 3px solid var(--accent);
  background: var(--accent-bg);
  border-radius: 0 var(--r) var(--r) 0;
  padding: 8px 12px 9px;
  margin-bottom: 11px;
}

.screen-review .rv-instr-label {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--accent-text);
  opacity: 0.85;
  margin-bottom: 3px;
}

.screen-review .rv-instr-text {
  font-family: var(--font-mono);
  font-size: 12.2px;
  line-height: 1.62;
  color: var(--text);
}

/* ---------- 操作条 ---------- */

.screen-review .rv-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  padding-top: 2px;
}
.screen-review .rv-actions svg {
  opacity: 0.85;
}

/* ---------- 状态条（accepted / dismissed） ---------- */

.screen-review .rv-strip {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 8px 11px;
  border-radius: var(--r);
  font-size: 12.5px;
  line-height: 1.5;
  border: 1px solid var(--border);
  background: var(--bg-sunken);
  color: var(--text-dim);
}
.screen-review .rv-strip b {
  color: var(--text);
}
.screen-review .rv-strip-ic {
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  flex: none;
  margin-top: 1px;
}
.screen-review .rv-strip-sub {
  font-size: 11.5px;
  color: var(--text-faint);
  margin-top: 1px;
}
.screen-review .rv-strip-ok {
  background: var(--support-bg);
  border-color: var(--support-border);
}
.screen-review .rv-strip-ok .rv-strip-ic {
  color: var(--support);
}
.screen-review .rv-strip-dismissed {
  background: var(--neutral-bg);
  border-color: var(--refute-border);
}
.screen-review .rv-strip-dismissed .rv-strip-ic {
  color: var(--refute);
}
.screen-review .rv-strip .btn {
  flex: none;
}

.screen-review .rv-reason {
  margin-top: 8px;
  padding: 7px 11px;
  border-radius: var(--r);
  background: var(--refute-bg);
  border: 1px solid var(--refute-border);
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text);
}
.screen-review .rv-reason-label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--refute);
  margin-bottom: 2px;
}

/* ---------- 表单（dismiss 理由 / reply） ---------- */

.screen-review .rv-form {
  margin-top: 4px;
  padding: 10px 12px 11px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-sunken);
}
.screen-review .rv-form-dismiss {
  border-color: var(--refute-border);
  background: var(--refute-bg);
}
.screen-review .rv-form-dismiss.is-err {
  border-color: var(--danger);
}

.screen-review .rv-form-title {
  font-size: 12.5px;
  font-weight: 620;
  margin-bottom: 7px;
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.screen-review .rv-req {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--danger);
  border: 1px solid var(--danger-border);
  background: var(--danger-bg);
  border-radius: var(--r-sm);
  padding: 0 5px;
}
.screen-review .rv-form-note {
  font-size: 11.5px;
  font-weight: 450;
  color: var(--text-dim);
}

.screen-review .rv-textarea {
  display: block;
  width: 100%;
  resize: vertical;
  padding: 7px 10px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  outline: none;
}
.screen-review .rv-textarea:focus {
  border-color: var(--accent);
}
.screen-review .rv-textarea::placeholder {
  color: var(--text-faint);
}

.screen-review .rv-err {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 7px;
  font-size: 12px;
  color: var(--danger);
}
.screen-review .rv-err svg {
  flex: none;
}

.screen-review .rv-quick {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}

.screen-review .rv-form-foot {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 9px;
}

/* ---------- 回复 ---------- */

.screen-review .rv-replies {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 11px;
  padding-left: 11px;
  border-left: 1px solid var(--border);
}
.screen-review .rv-reply {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.screen-review .rv-reply-head {
  font-size: 12px;
  font-weight: 620;
}
.screen-review .rv-reply-body {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-dim);
}

/* ---------- resolved：折叠 / 灰化 ---------- */

.screen-review .rv-resolved {
  border-left-color: var(--border);
  background: var(--bg-sunken);
  padding: 0;
  overflow: hidden;
}
.screen-review .rv-resolved-head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 14px;
  background: transparent;
  border: 0;
  cursor: pointer;
  text-align: left;
  color: var(--text-dim);
}
.screen-review .rv-resolved-head:hover {
  background: var(--bg-hover);
}
.screen-review .rv-chevron {
  display: grid;
  place-items: center;
  color: var(--text-faint);
  transition: transform 0.15s;
}
.screen-review .rv-resolved.is-open .rv-chevron {
  transform: rotate(90deg);
}
.screen-review .rv-resolved-text {
  font-size: 12.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 44%;
}
.screen-review .rv-resolved-body {
  padding: 2px 14px 13px 36px;
  border-top: 1px solid var(--border);
  padding-top: 11px;
}
.screen-review .rv-resolved-foot {
  margin-top: 2px;
}

/* ---------- 追加意见 / 空态 ---------- */

.screen-review .rv-add {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 10px 14px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-lg);
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
}
.screen-review .rv-add:hover {
  color: var(--accent);
  border-color: var(--accent-border);
  background: var(--accent-bg);
}

.screen-review .rv-empty {
  padding: 26px;
  text-align: center;
  color: var(--text-faint);
  font-size: 13px;
  border: 1px dashed var(--border);
  border-radius: var(--r-lg);
}

.screen-review .rv-foot-note {
  margin-top: 14px;
  padding-left: 3px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-faint);
}

/* ---------- 侧栏：确定性检查 ---------- */

.screen-review .rv-checks-sum {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.screen-review .rv-cnt {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-dim);
}
.screen-review .rv-cnt::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 99px;
  background: currentColor;
}
.screen-review .rv-cnt-pass {
  color: var(--support);
}
.screen-review .rv-cnt-fail {
  color: var(--danger);
}
.screen-review .rv-cnt-warn {
  color: var(--warn);
}

.screen-review .rv-checks {
  list-style: none;
  margin: 0;
  padding: 4px 0;
}
.screen-review .rv-check {
  display: flex;
  gap: 9px;
  padding: 6px 14px;
  align-items: flex-start;
}
.screen-review .rv-check + .rv-check {
  border-top: 1px solid var(--border);
}
.screen-review .rv-check-ic {
  display: grid;
  place-items: center;
  width: 17px;
  height: 20px;
  flex: none;
  color: var(--text-faint);
}
.screen-review .rv-check-pass .rv-check-ic {
  color: var(--support);
}
.screen-review .rv-check-fail .rv-check-ic {
  color: var(--danger);
}
.screen-review .rv-check-warn .rv-check-ic {
  color: var(--warn);
}
.screen-review .rv-check-fail {
  background: var(--danger-bg);
}
.screen-review .rv-check-main {
  min-width: 0;
}
.screen-review .rv-check-name {
  font-size: 12.5px;
  font-weight: 550;
  line-height: 1.5;
}
.screen-review .rv-blk {
  vertical-align: 1px;
  font-size: 10.5px;
}
.screen-review .rv-check-detail {
  font-size: 11.5px;
  color: var(--text-faint);
  line-height: 1.5;
  word-break: break-word;
}
.screen-review .rv-checks-foot {
  padding: 9px 14px;
  border-top: 1px solid var(--border);
  background: var(--bg-sunken);
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--text-faint);
}

/* ---------- 侧栏：迭代曲线 ---------- */

.screen-review .rv-curve {
  padding: 10px 6px 2px;
}
.screen-review .rv-curve svg {
  display: block;
}
.screen-review .rv-axis {
  stroke: var(--border);
  stroke-width: 1;
}
.screen-review .rv-area {
  fill: var(--accent-bg);
  stroke: none;
}
.screen-review .rv-line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.screen-review .rv-pt circle {
  fill: var(--bg-elev);
  stroke: var(--accent);
  stroke-width: 2;
}
.screen-review .rv-pt.is-best circle {
  fill: var(--accent);
  stroke: var(--bg-elev);
}
.screen-review .rv-pt-val {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 650;
  fill: var(--text);
  text-anchor: middle;
}
.screen-review .rv-pt.is-best .rv-pt-val {
  fill: var(--accent-text);
}
.screen-review .rv-pt-x {
  font-family: var(--font-mono);
  font-size: 9.5px;
  fill: var(--text-faint);
  text-anchor: middle;
}

.screen-review .rv-stop {
  list-style: none;
  margin: 0;
  padding: 4px 14px 13px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px solid var(--border);
  padding-top: 11px;
}
.screen-review .rv-stop li {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-dim);
}
.screen-review .rv-stop .dot {
  transform: translateY(-1px);
}

/* ---------- 底部 sticky pending 栏 ---------- */

.screen-review .rv-pending {
  position: sticky;
  bottom: 12px;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 18px;
  margin-bottom: 12px;
  padding: 11px 14px;
  background: var(--bg-elev);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-lg);
  box-shadow: 0 0 0 3px var(--accent-bg), var(--shadow-lg);
  flex-wrap: wrap;
}

.screen-review .rv-pending.is-submitted {
  border-color: var(--support-border);
  box-shadow: 0 0 0 3px var(--support-bg), var(--shadow-lg);
}

.screen-review .rv-pending-l {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
}
.screen-review .rv-pending-l > .dot {
  margin-top: 7px;
}
.screen-review .rv-live {
  color: var(--support);
}
.screen-review .rv-live-a {
  color: var(--accent);
}

.screen-review .rv-pending-counts {
  font-size: 14px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.screen-review .rv-pending-counts b {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.screen-review .rv-pending-counts b.rv-n-ok {
  color: var(--support);
}
.screen-review .rv-sep {
  color: var(--text-faint);
  margin: 0 7px;
}

.screen-review .rv-pending-note {
  text-align: right;
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--text-dim);
  max-width: 240px;
}

@media (max-width: 1080px) {
  .screen-review .rv-side {
    position: static;
  }
  .screen-review .rv-pending-note {
    display: none;
  }
}

@media (max-width: 720px) {
  .screen-review .rv-stat + .rv-stat {
    padding-left: 0;
    border-left: 0;
    margin-left: 0;
  }
  .screen-review .rv-top {
    gap: 16px;
  }
}

/* ---------- 提交历史（从 Draft 搬来） ---------- */
.screen-review .rv-commits { display: flex; flex-direction: column; }
.screen-review .rv-commit {
  padding: 9px 14px; border-bottom: 1px solid var(--border);
}
.screen-review .rv-commit:last-child { border-bottom: 0; }
.screen-review .rv-commit.is-cur { background: var(--accent-bg); }
.screen-review .rv-commit-top { display: flex; align-items: center; gap: 7px; }
.screen-review .rv-commit-top b { font-size: 12.5px; font-weight: 700; }
.screen-review .rv-commit-score {
  font-family: var(--font-mono); font-size: 12px; font-weight: 650; color: var(--accent);
}
.screen-review .rv-commit-note { font-size: 12px; color: var(--text-dim); margin-top: 2px; line-height: 1.5; }
.screen-review .rv-commit-by { font-size: 11px; margin-top: 1px; }
.screen-review .rv-dec-wrap {
  padding: 10px 14px 12px; border-top: 1px solid var(--border); background: var(--sync-bg);
}
.screen-review .rv-dec-wrap .side-label { color: var(--sync-text); margin-bottom: 6px; }
.screen-review .rv-dec { display: flex; flex-direction: column; gap: 1px; }
.screen-review .rv-dec b { font-size: 12.5px; font-weight: 600; line-height: 1.5; }
.screen-review .rv-dec span { font-size: 11.5px; color: var(--sync-text); font-family: var(--font-mono); }


/* ===== screen: publish ===== */
/* ===== Public —— 选 branch 发布 ===== */

.screen-publish .pb-ic { flex: none; }

.screen-publish .pb-head { margin: 0 2px 16px; }
.screen-publish .pb-head h1 {
  margin: 0 0 3px; font-size: 20px; font-weight: 650; letter-spacing: -.015em;
}
.screen-publish .pb-head .meta { margin: 0; }

.screen-publish .pb-list { display: flex; flex-direction: column; }

.screen-publish .pb-row {
  display: flex; align-items: center; gap: 11px;
  width: 100%; text-align: left;
  padding: 11px 14px;
  border: 0; border-bottom: 1px solid var(--border);
  background: none; cursor: pointer;
}
.screen-publish .pb-row:hover { background: var(--bg-hover); }
.screen-publish .pb-row.is-on { background: var(--accent-bg); }

.screen-publish .pb-radio {
  width: 15px; height: 15px; flex: none; border-radius: 99px;
  border: 1.5px solid var(--border-strong); background: var(--bg-elev);
}
.screen-publish .pb-row.is-on .pb-radio {
  border-color: var(--accent); border-width: 4.5px;
}

.screen-publish .pb-row-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.screen-publish .pb-row-main b { font-size: 13.5px; font-weight: 600; }
.screen-publish .pb-row-main .meta { font-size: 11.5px; }

.screen-publish .pb-score { font-size: 13px; font-weight: 650; color: var(--text-dim); }
.screen-publish .badge .pb-ic { width: 11px; height: 11px; }

/* ---------- 详情 ---------- */
.screen-publish .pb-detail {
  padding: 16px 14px;
  border-top: 1px solid var(--border);
  background: var(--bg-sunken);
  display: flex; flex-direction: column; gap: 14px;
}
.screen-publish .pb-merge { display: flex; align-items: center; gap: 9px; }
.screen-publish .pb-merge .pb-ic { color: var(--text-faint); }
.screen-publish .pb-b {
  padding: 3px 10px; border-radius: 99px; font-size: 12px;
  border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim);
}
.screen-publish .pb-b.is-src {
  border-color: var(--accent-border); background: var(--accent-bg); color: var(--accent-text);
}

.screen-publish .pb-meta { display: flex; flex-direction: column; gap: 6px; }
.screen-publish .pb-meta > div { display: flex; gap: 12px; align-items: baseline; }
.screen-publish .pb-meta span {
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-faint); min-width: 70px;
}
.screen-publish .pb-meta b { font-size: 12.5px; font-weight: 550; }

.screen-publish .pb-go { align-self: flex-start; }

.screen-publish .pb-block {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 12px; border-radius: var(--r);
  border: 1px solid var(--danger-border); background: var(--danger-bg);
}
.screen-publish .pb-block .pb-ic { color: var(--danger); margin-top: 2px; }
.screen-publish .pb-block > div { display: flex; flex-direction: column; gap: 2px; }
.screen-publish .pb-block b { font-size: 13px; color: var(--danger); }
.screen-publish .pb-block span { font-size: 12.5px; color: var(--text-dim); line-height: 1.6; }
.screen-publish .pb-detail .btn { align-self: flex-start; }

.screen-publish .pb-empty { padding: 20px 14px; color: var(--text-faint); font-size: 12.5px; }

/* ---------- 已发布 ---------- */
.screen-publish .pb-done-i {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
}
.screen-publish .pb-done-i:last-child { border-bottom: 0; }
.screen-publish .pb-done-i .pb-ic { color: var(--support); }
.screen-publish .pb-done-i > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.screen-publish .pb-done-i b { font-size: 13px; font-weight: 600; }
.screen-publish .pb-done-i .meta { font-size: 11px; }


/* ===== screen: sync ===== */
/* ============================================================
   S6 · Sync Talk（全局 Overlay · 唯一的同步空间）
   所有选择器均以 .screen-sync 开头；颜色只用 base.css 变量。
   视觉基调：整体暖色（--sync 系列）—— 一眼可辨的「另一种模式」。
   ============================================================ */

/* ---------- 面板本体 ---------- */

.screen-sync .sy-panel {
  width: 100%;
  max-width: 1080px;
  height: 86vh;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg-elev);
  border: 1px solid var(--sync-border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: sync-rise 0.18s cubic-bezier(0.2, 0.7, 0.3, 1);
}

@keyframes sync-rise {
  from { opacity: 0; transform: translateY(10px) scale(0.992); }
  to { opacity: 1; transform: none; }
}

/* ---------- 1. 顶栏 ---------- */

.screen-sync .sy-top {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 13px 12px 16px;
  background: color-mix(in srgb, var(--sync) 13%, var(--bg-elev));
  border-bottom: 1px solid var(--sync-border);
}

.screen-sync .sy-top::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 3px;
  background: var(--sync-solid);
}

.screen-sync .sy-mark {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--sync-solid);
  color: #fff;
  box-shadow: var(--shadow-sm);
}

.screen-sync .sy-head-main { min-width: 0; }

.screen-sync .sy-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.25;
}

.screen-sync .sy-title {
  font-size: 16.5px;
  font-weight: 680;
  letter-spacing: -0.01em;
  color: var(--text);
  margin: 0;
}

.screen-sync .sy-origin-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 3px;
  min-width: 0;
}

.screen-sync .sy-origin-detail {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--sync-text);
  opacity: 0.85;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.screen-sync .sy-top-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
}

.screen-sync .sy-meter {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  padding-right: 14px;
  border-right: 1px solid var(--sync-border);
}

.screen-sync .sy-meter-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--sync-text);
  white-space: nowrap;
}

.screen-sync .sy-meter-label span {
  font-weight: 450;
  opacity: 0.72;
}

.screen-sync .sy-gauge {
  display: flex;
  gap: 3px;
}

.screen-sync .sy-gauge i {
  display: block;
  width: 18px;
  height: 5px;
  border-radius: 99px;
  background: var(--sync-border);
}

.screen-sync .sy-gauge i.on { background: var(--sync-solid); }

.screen-sync .sy-elapsed {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--sync-text);
  white-space: nowrap;
}

.screen-sync .sy-close {
  padding: 5px;
  color: var(--sync-text);
}

.screen-sync .sy-close:hover {
  background: color-mix(in srgb, var(--sync) 18%, transparent);
  color: var(--sync-text);
}

/* ---------- 2. 能力声明条 ---------- */

.screen-sync .sy-cap {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 11px 14px 0;
  padding: 8px 12px;
  background: var(--sync-bg);
  border: 1px solid var(--sync-border);
  border-left: 3px solid var(--sync-solid);
  border-radius: var(--r);
}

.screen-sync .sy-cap-icon {
  flex: none;
  display: grid;
  place-items: center;
  color: var(--sync);
}

.screen-sync .sy-cap-list {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12.5px;
}

.screen-sync .sy-cap-no {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 1px 9px 1px 6px;
  border-radius: 99px;
  border: 1px solid var(--sync-border);
  background: var(--bg-elev);
  color: var(--sync-text);
  font-weight: 550;
  white-space: nowrap;
}

.screen-sync .sy-cap-no svg { opacity: 0.75; }

.screen-sync .sy-cap-yes {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 1px 10px 1px 7px;
  border-radius: 99px;
  background: var(--sync-solid);
  border: 1px solid var(--sync-solid);
  color: #fff;
  font-weight: 600;
  white-space: nowrap;
}

.screen-sync .sy-cap-sep {
  color: var(--sync-border);
  font-size: 12px;
}

.screen-sync .sy-cap-note {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--sync-text);
  opacity: 0.85;
  white-space: nowrap;
}

/* ---------- 3. 主体 ---------- */

.screen-sync .sy-body {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
}

/* ----- 3a. 对话区 ----- */

.screen-sync .sy-talk {
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  background: color-mix(in srgb, var(--sync) 3.5%, var(--bg-elev));
}

.screen-sync .sy-sysline {
  align-self: center;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  max-width: 100%;
  padding: 3px 12px;
  border-radius: 99px;
  border: 1px dashed var(--sync-border);
  background: var(--bg-elev);
  color: var(--sync-text);
  font-size: 11.5px;
}

.screen-sync .sy-msg {
  display: flex;
  gap: 9px;
  max-width: 90%;
}

.screen-sync .sy-msg-you {
  margin-left: auto;
  flex-direction: row-reverse;
}

.screen-sync .sy-msg-main { min-width: 0; }

.screen-sync .sy-av-bot {
  background: var(--sync-bg);
  border-color: var(--sync-border);
  color: var(--sync);
}

.screen-sync .sy-who {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-faint);
  margin: 2px 2px 4px;
}

.screen-sync .sy-who b {
  font-weight: 600;
  color: var(--text-dim);
}

.screen-sync .sy-msg-you .sy-who { justify-content: flex-end; }

.screen-sync .sy-bubble {
  padding: 9px 13px 10px;
  border-radius: var(--r-lg);
  font-size: 13.5px;
  line-height: 1.68;
}

/* agent = 暖色（这个空间的声音） */
.screen-sync .sy-msg-agent .sy-bubble {
  background: var(--sync-bg);
  border: 1px solid var(--sync-border);
  border-top-left-radius: var(--r-sm);
  color: var(--text);
}

/* 人 = 中性冷色，避免和空间标识撞色 */
.screen-sync .sy-msg-you .sy-bubble {
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-top-right-radius: var(--r-sm);
  color: var(--text);
}

/* ----- 内联 context 引用卡（异步产物 → 保持中性冷色） ----- */

.screen-sync .sy-ref {
  margin-top: 8px;
  padding: 8px 10px 9px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r);
  cursor: pointer;
  transition: border-color 0.13s, background 0.13s;
}

.screen-sync .sy-ref:hover {
  border-color: var(--border-strong);
  background: var(--bg-hover);
}

.screen-sync .sy-ref-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 4px;
}

.screen-sync .sy-ref-id {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
}

.screen-sync .sy-ref-tag {
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.screen-sync .sy-ref-chev {
  margin-left: auto;
  color: var(--text-faint);
  display: grid;
  place-items: center;
  transition: transform 0.15s;
}

.screen-sync .sy-ref-open .sy-ref-chev { transform: rotate(180deg); }

.screen-sync .sy-ref-claim {
  font-size: 12.8px;
  font-weight: 550;
  line-height: 1.55;
  color: var(--text);
}

.screen-sync .sy-ref-src {
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--text-dim);
}

.screen-sync .sy-ref-body {
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px dashed var(--border);
}

.screen-sync .sy-ref-note {
  margin: 6px 0 0;
  font-size: 11px;
  color: var(--text-faint);
}

/* ----- 收束提示 ----- */

.screen-sync .sy-nudge {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 2px;
  padding: 9px 10px 9px 12px;
  border: 1px dashed var(--sync);
  border-radius: var(--r);
  background: color-mix(in srgb, var(--sync) 7%, var(--bg-elev));
}

.screen-sync .sy-nudge-text {
  font-size: 12.5px;
  color: var(--sync-text);
  line-height: 1.5;
}

.screen-sync .sy-nudge .btn { margin-left: auto; flex: none; }

/* ----- 3b. 右侧只读参照栏 ----- */

.screen-sync .sy-side {
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  border-left: 1px solid var(--border);
  background: var(--bg-sunken);
}

.screen-sync .sy-side-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 12px 9px;
  background: var(--bg-sunken);
  border-bottom: 1px solid var(--border);
}

.screen-sync .sy-side-head .side-label { margin: 0; }

.screen-sync .sy-ro-flag {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 7px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-elev);
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.screen-sync .sy-side-note {
  padding: 8px 12px 0;
  font-size: 11px;
  line-height: 1.55;
  color: var(--text-faint);
}

.screen-sync .sy-side-sec { padding: 12px; }

.screen-sync .sy-side-sec + .sy-side-sec {
